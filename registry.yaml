aliases:
  - name: jdxcode/rtx
  - name: jdx/rtx
type: github_release
repo_owner: jdx
repo_name: mise
description: dev tools, env vars, task runner
version_overrides:
  - version_constraint: semver("<= 2023.12.9")
    files:
      - name: rtx
        src: rtx/bin/rtx
  - version_constraint: semver("<= 2024.0.0")
    files:
      - name: rtx
        src: rtx/bin/rtx
  - version_constraint: semver("<= 2024.12.17")
    files:
      - name: mise
        src: mise/bin/mise
  - version_constraint: semver(">= 2025.7.13, <= 2025.7.15")
    no_asset: true
  - version_constraint: semver("<= 2025.8.21")
    files:
      - name: mise
        src: mise/bin/mise
    checksum:
      type: github_release
      asset: SHASUMS512.txt
      algorithm: sha512
      minisign:
        type: github_release
        asset: SHASUMS512.txt.minisig
        public_key: RWTC3g8W3z4RZK3V3qv7fa1QY4JEWyBtqIHW+85QlJpZc5yG+uNYNBSZ
  - version_constraint: "true"
    files:
      - name: mise
        src: mise/bin/mise
    checksum:
      type: github_release
      asset: SHASUMS512.txt
      algorithm: sha512
      minisign:
        type: github_release
        asset: SHASUMS512.txt.minisig
        public_key: RWTC3g8W3z4RZK3V3qv7fa1QY4JEWyBtqIHW+85QlJpZc5yG+uNYNBSZ
