type: github_release
repo_owner: starship
repo_name: starship
description: The minimal, blazing-fast, and infinitely customizable prompt for any shell
version_overrides:
  - version_constraint: Version in ["v0.14.0", "v0.32.0", "v0.35.0", "v0.37.1", "v0.41.2"]
    no_asset: true
  - version_constraint: Version == "v0.31.0"
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-msvc
  - version_constraint: Version == "v0.39.0"
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-gnu
      windows: pc-windows-msvc
  - version_constraint: Version == "v1.20.0"
    replacements:
      amd64: x86_64
      arm64: aarch64
      linux: unknown-linux-musl
      windows: pc-windows-msvc
  - version_constraint: Version == "v1.22.0"
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
  - version_constraint: semver("<= 0.8.0")
    files:
      - name: starship
        src: '{{.Arch}}-{{.OS}}/starship'
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-gnu
  - version_constraint: semver("<= 0.8.3")
