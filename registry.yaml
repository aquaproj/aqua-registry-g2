type: github_release
repo_owner: tailwindlabs
repo_name: tailwindcss
description: A utility-first CSS framework for rapid UI development
version_overrides:
  - version_constraint: semver("> 3.4.17")
    overrides:
      - goos: linux
        variants:
          - key: libc
            value: glibc
      - goos: linux
        variants:
          - key: libc
            value: musl
  - version_constraint: semver("> 3.2.7")
  - version_constraint: semver("> 3.2.4")
  - version_constraint: semver("> 3.0.7")
  - version_constraint: semver("> 3.0.2")
  - version_constraint: semver("<= 3.0.2")
    no_asset: true
  - version_constraint: "true"
    overrides:
      - goos: linux
        variants:
          - key: libc
            value: glibc
      - goos: linux
        variants:
          - key: libc
            value: musl
