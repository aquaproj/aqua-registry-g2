type: github_release
repo_owner: denoland
repo_name: deno
description: A modern runtime for JavaScript and TypeScript
version_overrides:
  - version_constraint: semver("> 1.40.2")
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-gnu
      windows: pc-windows-msvc
  - version_constraint: semver("> 1.5.4")
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-gnu
      windows: pc-windows-msvc
  - version_constraint: semver("> 0.38.0")
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      linux: unknown-linux-gnu
      windows: pc-windows-msvc
  - version_constraint: semver("> 0.35.0")
    replacements:
      amd64: x86_64
      darwin: apple-darwin
      windows: pc-windows-msvc
    overrides:
      - goos: linux
        files:
          - name: deno
            src: deno_{{.OS}}_{{.Arch}}
        replacements:
          amd64: x64
  - version_constraint: semver("> 0.1.0")
    files:
      - name: deno
        src: deno_{{.OS}}_{{.Arch}}
    replacements:
      amd64: x64
      darwin: osx
      windows: win
    overrides:
      - goos: windows
        files:
          - name: deno
  - version_constraint: semver("<= 0.1.0")
    files:
      - name: deno
        src: deno_{{.OS}}_{{.Arch}}
    replacements:
      amd64: x64
      darwin: mac
      windows: win
    overrides:
      - goos: windows
        files:
          - name: deno
  - version_constraint: "true"
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-gnu
      windows: pc-windows-msvc
