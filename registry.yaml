type: github_release
repo_owner: charmbracelet
repo_name: glow
description: Render markdown on the CLI, with pizzazz
version_overrides:
  - version_constraint: Version == "v1.5.0"
  - version_constraint: Version == "v1.5.1"
  - version_constraint: semver("> 2.1.1")
    files:
      - name: glow
        src: '{{.AssetWithoutExt}}/glow'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/glow
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
  - version_constraint: semver("> 1.4.1")
    files:
      - name: glow
        src: '{{.AssetWithoutExt}}/glow'
  - version_constraint: semver("> 1.3.0")
  - version_constraint: semver("> 1.0.1")
  - version_constraint: semver("> 0.2.0")
  - version_constraint: semver("<= 0.2.0")
  - version_constraint: "true"
    files:
      - name: glow
        src: '{{.AssetWithoutExt}}/glow'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/glow
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
