type: github_release
repo_owner: cli
repo_name: cli
description: GitHub’s official command line tool
files:
  - name: gh
    src: gh_{{trimV .Version}}_{{.OS}}_{{.Arch}}/bin/gh
github_artifact_attestations:
  signer_workflow: cli/cli/.github/workflows/deployment.yml
version_overrides:
  - version_constraint: semver(">= 2.50.0")
    replacements:
      darwin: macOS
    github_artifact_attestations:
      signer_workflow: cli/cli/.github/workflows/deployment.yml
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
  - version_constraint: semver("> 2.27.0")
    replacements:
      darwin: macOS
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
  - version_constraint: semver("> 2.23.0")
    replacements:
      darwin: macOS
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
  - version_constraint: semver("> 2.20.0")
    replacements:
      darwin: macOS
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
  - version_constraint: semver("> 0.5.5")
    replacements:
      darwin: macOS
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
  - version_constraint: semver("> 0.5.2")
    replacements:
      darwin: macOS
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
  - version_constraint: semver("> 0.4.0")
    replacements:
      darwin: macOS
  - version_constraint: semver("<= 0.4.0")
    replacements:
      darwin: macOS
  - version_constraint: "true"
    replacements:
      darwin: macOS
    github_artifact_attestations:
      signer_workflow: cli/cli/.github/workflows/deployment.yml
    overrides:
      - goos: windows
        files:
          - name: gh
            src: bin/gh.exe
