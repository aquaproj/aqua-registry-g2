type: github_release
repo_owner: GoogleCloudPlatform
repo_name: terraformer
description: CLI tool to generate terraform files from existing infrastructure (reverse Terraform). Infrastructure to Code
# The release carries a build per provider -- aws, google, alicloud, and thirty more -- and
# an "all" build carrying every one of them. This package is the "all" build; the per-provider
# ones are packages of their own.
all_assets_filter: Asset matches "^terraformer-all-(darwin|linux|windows)-(amd64|arm64)(\\.exe)?$"
