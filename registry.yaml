type: github_release
repo_owner: go-delve
repo_name: delve
description: Delve is a debugger for the Go programming language
files:
  - name: dlv
version_overrides:
  - version_constraint: semver("<= 1.26.1") or Version in ["v1.27.0", "v1.27.1"]
  - version_constraint: "true"
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/go-delve/delve/.github/workflows/release.yml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --signature
          - https://github.com/go-delve/delve/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate
          - https://github.com/go-delve/delve/releases/download/{{.Version}}/checksums.txt.cert
          - --certificate-github-workflow-repository
          - go-delve/delve
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
