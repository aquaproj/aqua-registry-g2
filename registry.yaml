type: github_release
repo_owner: astral-sh
repo_name: ruff
description: An extremely fast Python linter and code formatter, written in Rust
github_artifact_attestations:
  signer_workflow: astral-sh/ruff/.github/workflows/release.yml
version_overrides:
  - version_constraint: semver("> 0.15.1")
    files:
      - name: ruff
        src: '{{.AssetWithoutExt}}/ruff'
    github_artifact_attestations:
      signer_workflow: astral-sh/ruff/.github/workflows/release.yml
    overrides:
      - goos: windows
        files:
          - name: ruff
  - version_constraint: semver("> 0.4.10")
    files:
      - name: ruff
        src: '{{.AssetWithoutExt}}/ruff'
    overrides:
      - goos: windows
        files:
          - name: ruff
  - version_constraint: semver("> 0.1.7")
  - version_constraint: semver("> 0.0.246")
  - version_constraint: semver("<= 0.0.246")
    no_asset: true
  - version_constraint: "true"
    files:
      - name: ruff
        src: '{{.AssetWithoutExt}}/ruff'
    github_artifact_attestations:
      signer_workflow: astral-sh/ruff/.github/workflows/release.yml
    overrides:
      - goos: windows
        files:
          - name: ruff
