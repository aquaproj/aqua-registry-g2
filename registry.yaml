name: moby/buildkit
type: github_release
repo_owner: moby
repo_name: buildkit
description: concurrent, cache-efficient, and Dockerfile-agnostic builder toolkit
version_filter: not (Version matches "-(alpha|beta|rc)")
files:
    - name: buildctl
      src: bin/{{.FileName}}
cosign:
    opts:
        - --certificate-identity
        - https://github.com/docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - moby/buildkit
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
    bundle:
        type: github_release
        asset: '{{.Asset}}.sigstore.json'
version_overrides:
    - version_constraint: semver(">= 0.27.0")
      cosign:
        opts:
            - --certificate-identity-regexp
            - ^https://github\.com/docker/github-builder/\.github/workflows/bake\.yml@
            - --certificate-oidc-issuer
            - https://token.actions.githubusercontent.com
            - --certificate-github-workflow-repository
            - moby/buildkit
            - --certificate-github-workflow-ref
            - refs/tags/{{.Version}}
        bundle:
            type: github_release
            asset: '{{.AssetWithoutExt}}.sigstore.json'
      overrides:
        - goos: linux
          goarch: amd64
          files:
            - name: buildctl
              src: bin/{{.FileName}}
            - name: buildkit-cni-bridge
              src: bin/{{.FileName}}
            - name: buildkit-cni-firewall
              src: bin/{{.FileName}}
            - name: buildkit-cni-host-local
              src: bin/{{.FileName}}
            - name: buildkit-cni-loopback
              src: bin/{{.FileName}}
