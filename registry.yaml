name: infracost/infracost
type: github_release
repo_owner: infracost
repo_name: infracost
description: Cloud cost estimates for Terraform in pull requests. Love your cloud bill
overrides:
    - goos: windows
      goarch: amd64
      files:
        - name: infracost
          src: infracost.exe
    - goos: windows
      goarch: arm64
      files:
        - name: infracost
          src: infracost-arm64.exe
files:
    - name: infracost
      src: infracost-{{.OS}}-{{.Arch}}
version_overrides:
    - version_constraint: "true"
