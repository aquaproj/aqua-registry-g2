type: github_release
repo_owner: charmbracelet
repo_name: vhs
description: Your CLI home video recorder
version_overrides:
  - version_constraint: Version == "v0.7.0"
    no_asset: true
  - version_constraint: Version == "v0.7.1"
  - version_constraint: semver("> 0.10.0")
    files:
      - name: vhs
        src: '{{.AssetWithoutExt}}/vhs'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/vhs
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
  - version_constraint: semver("> 0.6.0")
    files:
      - name: vhs
        src: '{{.AssetWithoutExt}}/vhs'
  - version_constraint: semver("<= 0.6.0")
  - version_constraint: "true"
    files:
      - name: vhs
        src: '{{.AssetWithoutExt}}/vhs'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/vhs
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
