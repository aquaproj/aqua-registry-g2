type: github_release
repo_owner: loft-sh
repo_name: devpod
description: "Codespaces but open-source, client-only and unopinionated: Works with any IDE and lets you use any cloud, kubernetes or just localhost docker"
# The release carries the desktop application as well as the command line one -- a dmg, an
# msi, an AppImage and a tarball of each -- and the inference took those for the package.
# The command is the executable per target, which is what aqua-registry has always
# installed.
all_assets_filter: Asset matches "^devpod-(darwin|linux|windows)-(amd64|arm64)(\\.exe)?$"
