type: github_release
repo_owner: jgm
repo_name: pandoc
description: Universal markup converter
version_overrides:
  - version_constraint: semver("> 3.1.1")
    replacements:
      amd64: x86_64
      darwin: macOS
    overrides:
      - goos: linux
        files:
          - name: pandoc
            src: pandoc-{{.Version}}/bin/pandoc
          - name: pandoc-lua
            src: pandoc-{{.Version}}/bin/pandoc-lua
          - name: pandoc-server
            src: pandoc-{{.Version}}/bin/pandoc-server
        replacements:
          amd64: amd64
      - goos: darwin
        files:
          - name: pandoc
            src: pandoc-{{.Version}}-{{.Arch}}/bin/pandoc
          - name: pandoc-lua
            src: pandoc-{{.Version}}-{{.Arch}}/bin/pandoc-lua
          - name: pandoc-server
            src: pandoc-{{.Version}}-{{.Arch}}/bin/pandoc-server
      - goos: windows
        files:
          - name: pandoc
            src: pandoc-{{.Version}}/pandoc
  - version_constraint: semver(">= 3.0.0")
    files:
      - name: pandoc
        src: pandoc-{{.Version}}/bin/pandoc
      - name: pandoc-lua
        src: pandoc-{{.Version}}/bin/pandoc-lua
      - name: pandoc-server
        src: pandoc-{{.Version}}/bin/pandoc-server
    replacements:
      darwin: macOS
    overrides:
      - goos: windows
        files:
          - name: pandoc
            src: pandoc-{{.Version}}/pandoc
        replacements:
          amd64: x86_64
  - version_constraint: semver("< 3.0.0")
    error_message: This version is too old. Please upgrade to 3.0.0 or a newer version.
  - version_constraint: "true"
    replacements:
      amd64: x86_64
      darwin: macOS
    overrides:
      - goos: linux
        files:
          - name: pandoc
            src: pandoc-{{.Version}}/bin/pandoc
          - name: pandoc-lua
            src: pandoc-{{.Version}}/bin/pandoc-lua
          - name: pandoc-server
            src: pandoc-{{.Version}}/bin/pandoc-server
        replacements:
          amd64: amd64
      - goos: darwin
        files:
          - name: pandoc
            src: pandoc-{{.Version}}-{{.Arch}}/bin/pandoc
          - name: pandoc-lua
            src: pandoc-{{.Version}}-{{.Arch}}/bin/pandoc-lua
          - name: pandoc-server
            src: pandoc-{{.Version}}-{{.Arch}}/bin/pandoc-server
      - goos: windows
        files:
          - name: pandoc
            src: pandoc-{{.Version}}/pandoc
