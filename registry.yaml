type: github_release
repo_owner: PowerShell
repo_name: PowerShell
description: PowerShell for every system
files:
  - name: pwsh
version_overrides:
  - version_constraint: semver("<= 6.1.6")
    replacements:
      amd64: x64
      darwin: osx
      windows: win
  - version_constraint: semver("<= 7.0.13")
    replacements:
      amd64: x64
      darwin: osx
      windows: win
  - version_constraint: semver("<= 7.4.7") || (semver(">= 7.5.0-preview.1, <= 7.5.1")) || (semver(">= 7.6.0-preview.1, <= 7.6.0-preview.4"))
    replacements:
      amd64: x64
      darwin: osx
      windows: win
  - version_constraint: "true"
    replacements:
      amd64: x64
      darwin: osx
      windows: win
