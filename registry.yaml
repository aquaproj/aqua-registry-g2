type: github_release
repo_owner: gopasspw
repo_name: gopass
description: The slightly more awesome standard unix password manager for teams
version_overrides:
  - version_constraint: semver("> 1.16.1")
    checksum:
      type: github_release
      asset: gopass_{{trimV .Version}}_SHA256SUMS
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/gopasspw/gopass/.github/workflows/autorelease.yml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - gopasspw/gopass
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: gopass_{{trimV .Version}}_SHA256SUMS.sigstore.json
  - version_constraint: semver("<= 1.16.1")
  - version_constraint: "true"
    checksum:
      type: github_release
      asset: gopass_{{trimV .Version}}_SHA256SUMS
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/gopasspw/gopass/.github/workflows/autorelease.yml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - gopasspw/gopass
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: gopass_{{trimV .Version}}_SHA256SUMS.sigstore.json
