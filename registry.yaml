aliases:
  - name: crates.io/tailspin
type: github_release
repo_owner: bensadeh
repo_name: tailspin
description: A log file highlighter
version_overrides:
  - version_constraint: Version == "2.2.0"
    files:
      - name: tspin
  - version_constraint: semver("> 2.1.0")
    files:
      - name: tspin
  - version_constraint: semver("> 0.1.1")
    files:
      - name: tspin
  - version_constraint: semver("<= 0.1.1")
  - version_constraint: "true"
    files:
      - name: tspin
