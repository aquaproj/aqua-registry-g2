type: http
repo_owner: npm
repo_name: cli
description: the package manager for JavaScript
url: https://registry.npmjs.org/npm/-/npm-{{trimV .Version}}.tgz
format: tar.gz
version_filter: Version matches "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
files:
  - name: npm
    src: package/bin/npm-cli.js
  - name: npx
    src: package/bin/npx-cli.js
supported_envs:
  - darwin
  - linux
