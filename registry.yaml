type: github_release
repo_owner: ginuerzh
repo_name: gost
description: GO Simple Tunnel - a simple tunnel written in golang
version_overrides:
  - version_constraint: Version in ["2.1-rc1", "v2.3-dev"]
    no_asset: true
  - version_constraint: Version in ["2.0", "2.1", "v2.2"]
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}/gost'
    overrides:
      - goos: windows
        files:
          - name: gost
  - version_constraint: Version == "v2.4-dev"
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}/gost'
    overrides:
      - goos: windows
        files:
          - name: gost
  - version_constraint: Version == "v2.11.2"
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}'
    overrides:
      - goos: windows
        files:
          - name: gost
            src: gost-{{.OS}}-{{.Arch}}.exe
  - version_constraint: semver("<= 1.0")
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}/gost'
    overrides:
      - goos: windows
        files:
          - name: gost
  - version_constraint: semver("<= 2.2-rc2")
    no_asset: true
  - version_constraint: semver("<= 2.8.1")
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}/gost'
    overrides:
      - goos: windows
        files:
          - name: gost
  - version_constraint: semver("<= 2.11.1")
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}'
    overrides:
      - goos: windows
        files:
          - name: gost
            src: gost-{{.OS}}-{{.Arch}}.exe
  - version_constraint: semver("<= 2.11.5")
    files:
      - name: gost
        src: '{{.AssetWithoutExt}}'
    overrides:
      - goos: windows
        files:
          - name: gost
            src: gost-{{.OS}}-{{.Arch}}.exe
  - version_constraint: "true"
