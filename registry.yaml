type: github_release
repo_owner: denoland
repo_name: deno
description: A modern runtime for JavaScript and TypeScript
version_overrides:
  - version_constraint: semver("> 1.40.2")
  - version_constraint: semver("> 1.5.4")
  - version_constraint: semver("> 0.38.0")
  - version_constraint: semver("> 0.35.0")
    overrides:
      - goos: linux
        files:
          - name: deno
            src: deno_{{.OS}}_{{.Arch}}
  - version_constraint: semver("> 0.1.0")
    files:
      - name: deno
        src: deno_{{.OS}}_{{.Arch}}
    overrides:
      - goos: windows
        files:
          - name: deno
  - version_constraint: semver("<= 0.1.0")
    files:
      - name: deno
        src: deno_{{.OS}}_{{.Arch}}
    overrides:
      - goos: windows
        files:
          - name: deno
  - version_constraint: "true"
