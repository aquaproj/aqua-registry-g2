name: earendil-works/pi
type: github_release
repo_owner: earendil-works
repo_name: pi
description: Interactive coding agent CLI
version_overrides:
    - version_constraint: Version == "v0.12.0"
      files:
        - name: pi
          src: pi-{{.OS}}-{{.Arch}}
    - version_constraint: semver(">= 0.46.0")
      files:
        - name: pi
          src: pi/pi
      overrides:
        - goos: windows
          files:
            - name: pi
    - version_constraint: semver(">= 0.12.0")
    - version_constraint: semver("< 0.12.0")
      no_asset: true
    - version_constraint: "true"
      files:
        - name: pi
          src: pi/pi
      overrides:
        - goos: windows
          files:
            - name: pi
