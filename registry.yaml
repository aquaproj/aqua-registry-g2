type: github_release
repo_owner: kyverno
repo_name: kyverno
description: Cloud Native Policy Management
version_filter: not (Version matches "-(alpha|beta|rc)")
cosign:
  opts:
    - --certificate-identity
    - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
    - --certificate-github-workflow-repository
    - kyverno/kyverno
    - --certificate-github-workflow-ref
    - refs/tags/{{.Version}}
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
version_overrides:
  - version_constraint: Version == "v1.5.5"
    no_asset: true
  - version_constraint: semver(">= 1.17.2")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - kyverno/kyverno
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
  - version_constraint: semver("> 1.10.7")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate
          - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.pem
          - --certificate-identity
          - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --signature
          - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate-github-workflow-repository
          - kyverno/kyverno
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: semver("> 1.10.0")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate
          - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.pem
          - --certificate-identity
          - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --signature
          - https://github.com/kyverno/kyverno/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate-github-workflow-repository
          - kyverno/kyverno
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: semver("> 1.5.8")
  - version_constraint: semver("> 1.1.5")
  - version_constraint: semver("<= 1.1.5")
    no_asset: true
  - version_constraint: "true"
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - kyverno/kyverno
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
