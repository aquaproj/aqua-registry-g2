type: github_release
repo_owner: charmbracelet
repo_name: crush
description: The glamourous AI coding agent for your favourite terminal
version_overrides:
  - version_constraint: semver("> 0.20.0")
    files:
      - name: crush
        src: crush_{{trimV .Version}}_{{.OS}}_{{.Arch}}/crush
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/crush
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
  - version_constraint: semver("<= 0.20.0")
    files:
      - name: crush
        src: crush_{{trimV .Version}}_{{.OS}}_{{.Arch}}/crush
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate
          - https://github.com/charmbracelet/crush/releases/download/{{.Version}}/checksums.txt.pem
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --signature
          - https://github.com/charmbracelet/crush/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate-github-workflow-repository
          - charmbracelet/crush
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: "true"
    files:
      - name: crush
        src: crush_{{trimV .Version}}_{{.OS}}_{{.Arch}}/crush
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/crush
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
