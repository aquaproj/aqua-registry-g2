type: github_release
repo_owner: charmbracelet
repo_name: gum
description: A tool for glamorous shell scripts
version_overrides:
  - version_constraint: semver(">= 2.0.0")
    files:
      - name: gum
        src: '{{.AssetWithoutExt}}/gum'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/gum
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
  - version_constraint: semver("> 0.13.0")
    files:
      - name: gum
        src: '{{.AssetWithoutExt}}/gum'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate
          - https://github.com/charmbracelet/gum/releases/download/{{.Version}}/checksums.txt.pem
          - --signature
          - https://github.com/charmbracelet/gum/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate-github-workflow-repository
          - charmbracelet/gum
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: semver("> 0.8.0")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate
          - https://github.com/charmbracelet/gum/releases/download/{{.Version}}/checksums.txt.pem
          - --signature
          - https://github.com/charmbracelet/gum/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate-github-workflow-repository
          - charmbracelet/gum
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: semver("<= 0.8.0")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate
          - https://github.com/charmbracelet/gum/releases/download/{{.Version}}/checksums.txt.pem
          - --signature
          - https://github.com/charmbracelet/gum/releases/download/{{.Version}}/checksums.txt.sig
          - --certificate-github-workflow-repository
          - charmbracelet/gum
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: "true"
    files:
      - name: gum
        src: '{{.AssetWithoutExt}}/gum'
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity
          - https://github.com/charmbracelet/meta/.github/workflows/goreleaser.yml@refs/heads/main
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - charmbracelet/gum
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
