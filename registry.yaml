type: github_release
repo_owner: fission
repo_name: fission
description: Fast and Simple Serverless Functions for Kubernetes
# The release carries the Kubernetes manifests that install Fission, an SBOM of each
# image it builds, and the command line client. The inference took an SBOM for Linux,
# and the signature the definition names then pointed beside that rather than beside
# the client.
all_assets_filter: Asset matches "^fission-[^-]+-(darwin|linux|windows)-(amd64|arm64)(\\.exe)?$"
cosign:
  opts:
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
    - --certificate-identity
    - https://github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
    - --certificate-github-workflow-repository
    - fission/fission
    - --certificate-github-workflow-ref
    - refs/tags/{{.Version}}
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
github_artifact_attestations:
  signer_workflow: fission/fission/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 1.21.0")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-identity
          - https://github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-github-workflow-repository
          - fission/fission
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sig.bundle
    cosign:
      opts:
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-identity
        - https://github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
        - --certificate-github-workflow-repository
        - fission/fission
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: '{{.Asset}}.sig.bundle'
    github_artifact_attestations:
      signer_workflow: fission/fission/.github/workflows/release.yaml
  - version_constraint: semver("> 1.20.5")
    cosign:
      opts:
        - --certificate
        - https://github.com/fission/fission/releases/download/{{.Version}}/{{.Asset}}.pem
        - --certificate-identity
        - https://github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --signature
        - https://github.com/fission/fission/releases/download/{{.Version}}/{{.Asset}}.sig
        - --certificate-github-workflow-repository
        - fission/fission
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
    slsa_provenance:
      type: github_release
      asset: fission_{{.Version}}.intoto.jsonl
  - version_constraint: semver("> 1.17.0-rc2")
  - version_constraint: semver("> 1.14.1")
  - version_constraint: semver("> 1.12.0")
  - version_constraint: semver("<= 1.12.0")
  - version_constraint: "true"
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-identity
          - https://github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
          - --certificate-github-workflow-repository
          - fission/fission
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums.txt.sig.bundle
    cosign:
      opts:
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-identity
        - https://github.com/fission/fission/.github/workflows/release.yaml@refs/tags/{{.Version}}
        - --certificate-github-workflow-repository
        - fission/fission
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: '{{.Asset}}.sig.bundle'
    github_artifact_attestations:
      signer_workflow: fission/fission/.github/workflows/release.yaml
