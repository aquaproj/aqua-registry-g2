type: github_release
repo_owner: github
repo_name: gh-ost
description: GitHub's Online Schema-migration Tool for MySQL
version_overrides:
  - version_constraint: Version == "v1.0.49"
  - version_constraint: Version == "v1.1.0"
  - version_constraint: Version == "v1.1.1"
  - version_constraint: Version == "v1.1.2"
  - version_constraint: Version == "v1.1.3"
  - version_constraint: Version == "v1.1.4"
  - version_constraint: Version == "v1.1.5"
  - version_constraint: Version == "v1.1.6"
  - version_constraint: Version == "v1.1.7"
  - version_constraint: Version == "v1.1.8"
  - version_constraint: Version == "v1.1.9"
  - version_constraint: Version == "v1.1.10"
  - version_constraint: semver("> 1.0.48")
  - version_constraint: semver("<= 1.0.48")
    error_message: Versions <= 1.0.48 are not supported. Please use version >= v1.0.49
  - version_constraint: "true"
