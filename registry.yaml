name: openbao/openbao/bao
type: github_release
repo_owner: openbao
repo_name: openbao
description: OpenBao exists to provide a software solution to manage, store, and distribute sensitive data including secrets, certificates, and keys
cosign:
  opts:
    - --certificate-identity
    - https://github.com/openbao/openbao/.github/workflows/release.yml@refs/heads/release/2.7.x
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
    - --certificate-github-workflow-repository
    - openbao/openbao
    - --certificate-github-workflow-ref
    - refs/heads/release/2.7.x
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
version_overrides:
  - version_constraint: Version == "v2.0.0-alpha20240329"
  - version_constraint: Version == "v2.0.0-beta20240618"
  - version_constraint: Version == "v2.5.0-beta20251125"
  - version_constraint: semver("> 2.5.5")
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity-regexp
          - ^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/(tags/.*|heads/release/.*)$
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - openbao/openbao
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
  - version_constraint: semver("> 2.4.4")
    checksum:
      type: github_release
      asset: checksums-{{.OS}}.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity-regexp
          - ^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/tags/.*$
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - openbao/openbao
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
        bundle:
          type: github_release
          asset: checksums-{{.OS}}.txt.sigstore.json
  - version_constraint: semver("> 2.1.1")
    checksum:
      type: github_release
      asset: checksums-{{.OS}}.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate
          - https://github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt.pem
          - --certificate-identity-regexp
          - ^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/tags/.*$
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --signature
          - https://github.com/openbao/openbao/releases/download/{{.Version}}/checksums-{{.OS}}.txt.sig
          - --certificate-github-workflow-repository
          - openbao/openbao
          - --certificate-github-workflow-ref
          - refs/tags/{{.Version}}
  - version_constraint: semver("<= 2.1.1")
  - version_constraint: "true"
    checksum:
      type: github_release
      asset: checksums.txt
      algorithm: sha256
      cosign:
        opts:
          - --certificate-identity-regexp
          - ^https://github\.com/openbao/openbao/\.github/workflows/release\.yml@refs/(tags/.*|heads/release/.*)$
          - --certificate-oidc-issuer
          - https://token.actions.githubusercontent.com
          - --certificate-github-workflow-repository
          - openbao/openbao
        bundle:
          type: github_release
          asset: checksums.txt.sigstore.json
