name: Skardyy/mcat
type: github_release
repo_owner: Skardyy
repo_name: mcat
repo_id: 966114168
description: Terminal image, video, directory, and Markdown viewer
version_overrides:
  - version_constraint: Version == "v0.1.3"
    files:
      - name: mcat
        src: mcat-{{.Arch}}-{{.OS}}/mcat
    overrides:
      - goos: windows
        files:
          - name: mcat
  - version_constraint: semver(">= 0.6.0-rc.1")
    files:
      - name: mcat
        src: mcat-{{.Version}}-{{.Arch}}-{{.OS}}/mcat
  - version_constraint: semver(">= 0.5.0-rc.1")
    files:
      - name: mcat
        src: mcat-{{.Arch}}-{{.OS}}/mcat
  - version_constraint: semver("< 0.5.0-rc.1")
    files:
      - name: mcat
        src: mcat-{{.Arch}}-{{.OS}}/mcat
    overrides:
      - goos: windows
        files:
          - name: mcat
  - version_constraint: "true"
    files:
      - name: mcat
        src: mcat-{{.Version}}-{{.Arch}}-{{.OS}}/mcat
