      - darwin
      - linux/amd64
  - version_constraint: semver(">= 0.10.2")
    files:
      - name: wapm
        src: bin/wapm
      - name: wasmer
        src: bin/wasmer
  - version_constraint: semver(">= 0.10.0")
    files:
      - name: wapm
        src: bin/wapm
      - name: wasmer
        src: bin/wasmer
    supported_envs:
      - darwin
      - amd64
  - version_constraint: semver(">= 0.3.0")
    files:
      - name: wasmer
        src: bin/wasmer
