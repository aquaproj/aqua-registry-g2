name: wasmerio/wasmer
type: github_release
repo_owner: wasmerio
repo_name: wasmer
repo_id: 152572186
description: The leading WebAssembly Runtime supporting WASI and Emscripten
overrides:
  - goos: linux
    goarch: arm64
    files:
      - name: wasmer
        src: bin/wasmer
files:
  - name: wasmer
    src: bin/wasmer
  - name: wasmer-headless
    src: bin/wasmer-headless
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
