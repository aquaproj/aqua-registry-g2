  - version_constraint: semver(">= 3.0.0-alpha")
  - version_constraint: semver(">= 2.2.1")
    files:
      - name: wapm
        src: bin/wapm
      - name: wasmer-headless
        src: bin/wasmer-headless
      - name: wax
        src: bin/wax
    overrides:
      - goos: linux
        goarch: arm64
        files:
          - name: wasmer
            src: bin/wasmer
      - goos: windows
        files:
          - name: wapm
            src: bin/wapm
          - name: wasmer-headless
            src: bin/wasmer-headless
          - name: wasmer
            src: bin/wasmer
