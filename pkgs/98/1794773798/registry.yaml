name: Code-Hex/Neo-cowsay
type: github_release
repo_owner: Code-Hex
repo_name: Neo-cowsay
repo_id: 72919606
description: Cowsay reborn in Go
version_overrides:
  - version_constraint: semver("> 1.0.1")
    files:
      - name: cowsay
      - name: cowthink
  - version_constraint: semver("> 0.0.5")
    files:
      - name: cowsay
      - name: cowthink
    supported_envs:
      - darwin/amd64
      - linux/amd64
      - windows/amd64
  - version_constraint: semver("<= 0.0.5")
    files:
      - name: cowsay
        src: '{{.OS}}_{{.Arch}}/cowsay'
      - name: cowthink
        src: '{{.OS}}_{{.Arch}}/cowthink'
    supported_envs:
      - darwin/amd64
      - linux/amd64
      - windows/amd64
  - version_constraint: "true"
    files:
      - name: cowsay
      - name: cowthink
