name: EnvCLI/EnvCLI
type: github_release
repo_owner: EnvCLI
repo_name: EnvCLI
repo_id: 116320181
description: Don't install Node, Go, ... locally - use containers you define within
  your project. If you have a new machine / other contributors you just have to install
  docker and envcli to get started
files:
  - name: envcli
version_overrides:
  - version_constraint: semver("> 0.6.4")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.6.4")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
