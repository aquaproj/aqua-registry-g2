name: knative/func
type: github_release
repo_owner: knative
repo_name: func
repo_id: 242137258
description: Knative Functions client API and CLI
version_overrides:
  - version_constraint: semverWithVersion(">= 1.8.0", trimPrefix(Version, "knative-"))
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: semverWithVersion(">= 1.7.0", trimPrefix(Version, "knative-"))
      or semver(">= 0.26.0")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: semver(">= 0.20.0")
    supported_envs:
      - darwin
      - amd64
  - version_constraint: semver(">= 0.9.0")
    files:
      - name: func
        src: func_{{.OS}}_{{.Arch}}
    supported_envs:
      - darwin
      - amd64
  - version_constraint: "true"
    files:
      - name: faas
        src: faas_{{.OS}}_{{.Arch}}
    supported_envs:
      - darwin
      - amd64
