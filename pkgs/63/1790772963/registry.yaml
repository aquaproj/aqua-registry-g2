name: pkgxdev/pkgx
type: github_release
repo_owner: pkgxdev
repo_name: pkgx
repo_id: 430183021
description: “run anything” from the creator of `brew`
version_overrides:
    - version_constraint: semver(">= 1.0.0")
    - version_constraint: Version == "v0.14.2"
      files:
        - name: tea
    - version_constraint: semver(">= 0.11.14")
      files:
        - name: tea
    - version_constraint: semver(">= 0.8.8")
      files:
        - name: tea
    - version_constraint: semver(">= 0.6.6")
      no_asset: true
    - version_constraint: semver("< 0.6.6")
      files:
        - name: tea
          src: tea.xyz/{{.Version}}/bin/tea
    - version_constraint: "true"
# From v2.3.2 each build is also published as pkgx-<version>.<os>.<arch>.tar.gz, beside the
# pkgx-<version>+<os>+<arch> names every version has.
all_assets_filter: not (Asset matches "^pkgx-[0-9.]+[.](darwin|linux)[.]")
