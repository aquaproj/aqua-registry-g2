name: cert-manager/cert-manager/cmctl
aliases:
  - name: jetstack/cert-manager/cmctl
type: github_release
repo_owner: cert-manager
repo_name: cert-manager
repo_id: 92313258
description: cmctl is a CLI tool that can help you to manage cert-manager resources
  inside your cluster
version_overrides:
  - version_constraint: semver("> 1.14.4")
    error_message: |
      Please use the package cert-manager/cmctl instead.
      The code of cmctl was moved from cert-manager/cert-manager to cert-manager/cmctl.
  - version_constraint: semver("<= 1.14.4")
    files:
      - name: cmctl
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: "true"
    error_message: |
      Please use the package cert-manager/cmctl instead.
      The code of cmctl was moved from cert-manager/cert-manager to cert-manager/cmctl.
all_assets_filter: Asset matches "^cmctl-.+-.+[.]tar[.]gz([.].+)?$" or Asset endsWith
  ".intoto.jsonl"
