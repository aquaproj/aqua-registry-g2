name: neovim/neovim-releases
type: github_release
repo_owner: neovim
repo_name: neovim-releases
repo_id: 688959145
description: Unsupported Nvim releases
files:
  - name: nvim
version_overrides:
  - version_constraint: semver("> 0.10.3")
    files:
      - name: nvim
        src: '{{.AssetWithoutExt}}/bin/nvim'
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 0.10.3")
    files:
      - name: nvim
        src: '{{.AssetWithoutExt}}/bin/nvim'
    supported_envs:
      - linux/amd64
  - version_constraint: "true"
    files:
      - name: nvim
        src: '{{.AssetWithoutExt}}/bin/nvim'
    supported_envs:
      - linux/amd64
# nvim-linux-x86_64-puc.tar.gz is a build against PUC Lua, which ties with the ordinary
# LuaJIT one.
all_assets_filter: not (Asset contains "-puc")
