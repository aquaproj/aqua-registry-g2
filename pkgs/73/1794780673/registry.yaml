name: MaybeJustJames/zephyr
type: github_release
repo_owner: MaybeJustJames
repo_name: zephyr
repo_id: 100788052
description: Tree shaking breeze for PureScript CoreFn AST
version_overrides:
  - version_constraint: semver("> 0.2.1")
    files:
      - name: zephyr
        src: zephyr/zephyr
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.2.1")
    files:
      - name: zephyr
        src: zephyr/zephyr
    replacements:
      linux: linux64
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: zephyr
        src: zephyr/zephyr
    supported_envs:
      - darwin
      - windows
      - amd64
