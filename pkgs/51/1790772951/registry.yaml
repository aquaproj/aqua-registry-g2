name: openbao/openbao/bao
type: github_release
repo_owner: openbao
repo_name: openbao
repo_id: 716719284
description: OpenBao exists to provide a software solution to manage, store, and distribute sensitive data including secrets, certificates, and keys
# The Arch Linux package (.pkg.tar.zst) ties with the tarball for linux/amd64 and linux/arm64,
# and so does the HSM build (openbao-hsm_*), which some releases also ship for Linux.
all_assets_filter: not (Asset endsWith ".pkg.tar.zst") and not (Asset startsWith "openbao-hsm")
cosign:
  opts:
    # Each minor version is released from its own branch, release/<major>.<minor>.x.
    - --certificate-identity-regexp
    - ^https://github[.]com/openbao/openbao/[.]github/workflows/release[.]yml@refs/heads/release/[0-9]+[.][0-9]+[.]x$
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
    - --certificate-github-workflow-repository
    - openbao/openbao
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
version_overrides:
  - version_constraint: Version == "v2.0.0-alpha20240329"
  - version_constraint: Version == "v2.0.0-beta20240618"
  - version_constraint: Version == "v2.5.0-beta20251125"
  - version_constraint: semver("> 2.5.5")
  # Up to 2.5.5 a release is signed at its tag, not from a release branch.
  - version_constraint: semver("> 2.4.4")
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/openbao/openbao/.github/workflows/release.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - openbao/openbao
      bundle:
        type: github_release
        asset: '{{.Asset}}.sigstore.json'
  - version_constraint: semver("> 2.1.1")
  - version_constraint: semver("<= 2.1.1")
  - version_constraint: "true"
