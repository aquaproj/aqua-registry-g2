name: ohkrab/krab
type: github_release
repo_owner: ohkrab
repo_name: krab
repo_id: 255390725
description: Krab is a migration and automation tool for PostgreSQL based on HCL syntax
version_overrides:
  - version_constraint: Version == "0.2.0"
    no_asset: true
  - version_constraint: semver("> 0.3.1")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.3.1")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
