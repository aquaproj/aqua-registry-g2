name: racket/racket/minimal
aliases:
  - name: racket-lang.org/racket-minimal
type: http
repo_owner: racket
repo_name: racket
repo_id: 615969
description: Minimal Racket distribution
url: https://download.racket-lang.org/releases/{{trimV .Version}}/installers/racket-minimal-{{trimV .Version}}-{{.Arch}}-{{.OS}}-cs.tgz
format: tgz
overrides:
  - goos: windows
    files:
      - name: racket
        src: racket/Racket
      - name: raco
        src: racket/raco
    replacements:
      arm64: arm64
files:
  - name: racket
    src: racket/bin/racket
  - name: raco
    src: racket/bin/raco
replacements:
  amd64: x86_64
  arm64: aarch64
  darwin: macosx
  linux: linux-buster
  windows: win32
version_overrides:
  # Before 8.18 the Linux build is named linux-cs rather than linux-buster-cs, and there is
  # no aarch64 one.
  - version_constraint: semver("< 8.18")
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: macosx
      linux: linux
      windows: win32
  - version_constraint: "true"
