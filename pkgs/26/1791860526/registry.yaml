name: kool-dev/kool
type: github_release
repo_owner: kool-dev
repo_name: kool
repo_id: 277661181
description: 'From local development to the cloud: web apps development with containers made easy'
version_overrides:
  - version_constraint: semver("> 2.2.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 1.14.0")
  - version_constraint: semver("> 1.0.15")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 1.0.3")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 1.0.3")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
