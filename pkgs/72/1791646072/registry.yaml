name: lxc/incus
type: github_release
repo_owner: lxc
repo_name: incus
repo_id: 669486760
description: Powerful system container and virtual machine manager
github_artifact_attestations:
  signer_workflow: lxc/incus/.github/workflows/release.yml
version_overrides:
  - version_constraint: semver(">= 6.23.0")
    github_artifact_attestations:
      signer_workflow: lxc/incus/.github/workflows/release.yml
  - version_constraint: semver("> 0.1.0")
  - version_constraint: semver("<= 0.1.0")
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: lxc/incus/.github/workflows/release.yml
# The release publishes incus-agent, incus-benchmark, incus-migrate and others beside incus,
# and a macOS pkg was offered for darwin/amd64 though bin.macos.incus.x86_64 is published.
all_assets_filter: Asset matches "^bin[.][a-z]+[.]incus[.]"
