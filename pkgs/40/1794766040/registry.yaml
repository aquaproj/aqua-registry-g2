name: plexsystems/sinker
type: github_release
repo_owner: plexsystems
repo_name: sinker
repo_id: 262421344
description: A tool to sync images from one container registry to another
version_overrides:
  - version_constraint: semver("> 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.4.0")
    files:
      - name: imagesync
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
