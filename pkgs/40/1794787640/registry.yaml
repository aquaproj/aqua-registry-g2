name: imuxin/kubectl-watch
type: github_release
repo_owner: imuxin
repo_name: kubectl-watch
repo_id: 531010878
description: A kubectl plugin to provide a pretty delta change view of being watched
  kubernetes resources
version_overrides:
  - version_constraint: Version == "0.1.5"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.2.3")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.1.4")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.1.4")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
