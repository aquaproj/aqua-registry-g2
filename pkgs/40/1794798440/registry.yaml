name: suzuki-shunsuke/migrate-urfave-cli-v3
type: github_release
repo_owner: suzuki-shunsuke
repo_name: migrate-urfave-cli-v3
repo_id: 958509800
description: Migrate github.com/urfave/cli/v2 to v3. This tool doesn't aim to the
  complete migration. Probably you need to fix code manually after running this tool,
  but this tool makes the migration easy
version_overrides:
  - version_constraint: semver("> 0.1.4")
  - version_constraint: semver("<= 0.1.4")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: "true"
