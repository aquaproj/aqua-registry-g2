name: apache/maven-mvnd
type: github_release
repo_owner: apache
repo_name: maven-mvnd
repo_id: 210029529
description: Apache Maven Daemon
files:
  - name: mvnd
version_overrides:
  - version_constraint: Version == "0.0.1"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: Version == "0.0.2"
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: Version in ["1.0-m6", "1.0-m8"]
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: Version == "1.0-m7"
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: Version == "1.0.2"
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.0.8")
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.7.1")
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.8.1")
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: mvnd
        src: '{{.AssetWithoutExt}}/bin/mvnd'
    supported_envs:
      - darwin
      - windows
      - amd64
# 1.0-m8 publishes a build for Maven 3.9 (m39) and one for Maven 4.0 (m40); m39 is the one of
# a released Maven.
all_assets_filter: not (Asset contains "-m40-")
