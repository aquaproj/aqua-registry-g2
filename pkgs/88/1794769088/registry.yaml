name: stunnel/static-curl
type: github_release
repo_owner: stunnel
repo_name: static-curl
repo_id: 535010912
description: static builds cURL with HTTP3
files:
  - name: curl
version_overrides:
  - version_constraint: Version == "8.6.0-1"
    files:
      - name: curl
  - version_constraint: Version == "8.6.0"
    files:
      - name: curl
    supported_envs:
      - linux
      - darwin
  # The plain archives hold curl alone at the top. curl-config, and the curl-<arch>/bin
  # layout, are the -dev- build's, which is left out.
  - version_constraint: semver("> 8.5.0")
    files:
      - name: curl
  - version_constraint: semver("> 8.2.0")
    files:
      - name: curl
    replacements:
      linux: static
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 8.2.0")
    files:
      - name: curl
    supported_envs:
      - linux
  - version_constraint: "true"
    files:
      - name: curl
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
    filter: Asset matches "^curl-static-.+-.+[.].+([.].+)?$"
# curl-*-dev-* is the build with headers and libraries, published beside the plain one.
all_assets_filter: not (Asset contains "-dev-")
