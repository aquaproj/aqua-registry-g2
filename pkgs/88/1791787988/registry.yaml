name: astefanutti/kubebox
type: github_release
repo_owner: astefanutti
repo_name: kubebox
repo_id: 74155531
description: Terminal and Web console for Kubernetes
version_overrides:
  - version_constraint: Version == "v0.1.0"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
