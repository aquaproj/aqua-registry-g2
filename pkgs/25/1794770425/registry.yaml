name: ByteNess/aws-vault
type: github_release
repo_owner: ByteNess
repo_name: aws-vault
repo_id: 988616604
description: A vault for securely storing and accessing AWS credentials in development
  environments
version_overrides:
  - version_constraint: Version == "v7.3.5"
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 7.3.4")
  - version_constraint: semver("<= 7.3.4")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
