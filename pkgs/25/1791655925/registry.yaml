name: grafana/mimir/metaconvert
type: github_release
repo_owner: grafana
repo_name: mimir
repo_id: 385634291
description: Grafana Mimir provides horizontally scalable, highly available, multi-tenant, long-term storage for Prometheus
version_prefix: mimir-
# Each binary has a <name>-sha-256 file beside it, which the first pattern also matches.
all_assets_filter: '(Asset matches "^metaconvert-.+-.+([.].+)?$" and not (Asset endsWith "-sha-256")) or Asset endsWith ".intoto.jsonl"'
