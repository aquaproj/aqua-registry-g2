name: momaek/authy
type: github_release
repo_owner: momaek
repo_name: authy
repo_id: 290223750
description: TOTP Alfred Workflow, Authy Aflred Workflow, Authy command line tool
files:
  - name: authy
    src: authy-{{.OS}}-{{.Arch}}
supported_envs:
  - darwin
asset_rules:
  - envs:
      - darwin/amd64
      - darwin/arm64
    filter: Asset matches "^authy[.]tar[.]gz([.].+)?$"
# Up to v0.0.8 the archive holds authy-darwin-amd64 alone, which an arm64 Mac runs through
# Rosetta 2.
version_overrides:
  - version_constraint: semver("<= 0.0.8")
    rosetta2: true
  - version_constraint: "true"
