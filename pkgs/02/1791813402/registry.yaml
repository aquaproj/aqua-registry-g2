name: ouch-org/ouch
type: github_release
repo_owner: ouch-org
repo_name: ouch
repo_id: 349334268
description: Painless compression and decompression in the terminal
cosign:
  opts:
    - --certificate-identity
    - https://github.com/ouch-org/ouch/.github/workflows/draft-release-automatic-trigger.yml@refs/tags/{{.Version}}-rc1
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
github_artifact_attestations:
  signer_workflow: ouch-org/ouch/.github/workflows/draft-release-automatic-trigger.yml
version_overrides:
  - version_constraint: Version == "0.1.4"
    supported_envs:
      - darwin
      - windows/amd64
  - version_constraint: Version == "0.1.5"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver(">= 0.8.0")
    files:
      - name: ouch
        src: '{{.AssetWithoutExt}}/ouch'
    github_artifact_attestations:
      signer_workflow: ouch-org/ouch/.github/workflows/draft-release-automatic-trigger.yml
  - version_constraint: semver("> 0.3.1")
    files:
      - name: ouch
        src: '{{.AssetWithoutExt}}/ouch'
  - version_constraint: semver("<= 0.3.1")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: ouch
        src: '{{.AssetWithoutExt}}/ouch'
    github_artifact_attestations:
      signer_workflow: ouch-org/ouch/.github/workflows/draft-release-automatic-trigger.yml
