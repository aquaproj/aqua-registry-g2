name: googleapis/api-linter
type: github_release
repo_owner: googleapis
repo_name: api-linter
repo_id: 178064406
description: A linter for APIs defined in protocol buffers
version_overrides:
  - version_constraint: Version == "v1.55.1"
    no_asset: true
  - version_constraint: semver("> 1.35.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.35.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
