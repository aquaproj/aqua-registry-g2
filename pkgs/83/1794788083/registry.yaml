name: suzuki-shunsuke/cmdx
type: github_release
repo_owner: suzuki-shunsuke
repo_name: cmdx
repo_id: 203486960
description: Task runner. It provides useful help messages and supports interactive
  prompts and validation of arguments
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
version_overrides:
  - version_constraint: Version == "v1.7.0-2"
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 2.0.2")
  - version_constraint: semver("> 2.0.0-0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: semver("> 1.6.1")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: semver("> 1.6.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.6.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
