name: acorn-io/runtime
aliases:
  - name: acorn-io/acorn
type: github_release
repo_owner: acorn-io
repo_name: runtime
repo_id: 484208174
description: A simple application deployment framework for Kubernetes
files:
  - name: acorn
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  # The signatures of checksums.txt from v0.5.1 to v0.9.2 aren't in the transparency log.
  - version_constraint: semver(">= 0.5.1") and semver("<= 0.9.2")
    checksum:
      cosign:
        enabled: false
  - version_constraint: "true"
