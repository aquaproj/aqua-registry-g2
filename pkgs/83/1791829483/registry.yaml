name: acorn-io/runtime
aliases:
  - name: acorn-io/acorn
type: github_release
repo_owner: acorn-io
repo_name: runtime
repo_id: 484208174
description: A simple application deployment framework for Kubernetes
files:
  - name: acorn
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  # The signature of v0.9.2's checksums.txt isn't in the transparency log.
  - version_constraint: Version == "v0.9.2"
    checksum:
      cosign:
        enabled: false
  - version_constraint: "true"
