name: takumin/qemu-bin
type: github_release
repo_owner: takumin
repo_name: qemu-bin
repo_id: 1415804611
description: Prebuilt binaries of `qemu` built with zig cc
files:
  - name: qemu-edid
    src: bin/qemu-edid
  - name: qemu-img
    src: bin/qemu-img
  - name: qemu-io
    src: bin/qemu-io
  - name: qemu-nbd
    src: bin/qemu-nbd
  - name: qemu-pr-helper
    src: bin/qemu-pr-helper
  - name: qemu-storage-daemon
    src: bin/qemu-storage-daemon
  - name: qemu-system-aarch64
    src: bin/qemu-system-aarch64
  - name: qemu-system-x86_64
    src: bin/qemu-system-x86_64
cosign:
  opts:
    - --certificate-identity
    - https://github.com/takumin/qemu-bin/.github/workflows/wc-sign.yml@refs/heads/main
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
github_artifact_attestations:
  signer_workflow: takumin/qemu-bin/.github/workflows/wc-sign.yml
version_overrides:
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: takumin/qemu-bin/.github/workflows/wc-sign.yml
    overrides:
      - goarch: amd64
        files:
          - name: qemu-edid
            src: bin/qemu-edid
          - name: qemu-img
            src: bin/qemu-img
          - name: qemu-io
            src: bin/qemu-io
          - name: qemu-nbd
            src: bin/qemu-nbd
          - name: qemu-pr-helper
            src: bin/qemu-pr-helper
          - name: qemu-storage-daemon
            src: bin/qemu-storage-daemon
          - name: qemu-system-aarch64
            src: bin/qemu-system-aarch64
          - name: qemu-system-x86_64
            src: bin/qemu-system-x86_64
          - name: qemu-vmsr-helper
            src: bin/qemu-vmsr-helper
    supported_envs:
      - linux
