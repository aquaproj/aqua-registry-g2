name: psastras/sarif-rs/clippy-sarif
type: github_release
repo_owner: psastras
repo_name: sarif-rs
repo_id: 347270006
description: Convert clippy output into SARIF
version_filter: not (Version matches "-latest$")
version_prefix: clippy-sarif-
version_overrides:
  - version_constraint: Version == "clippy-sarif-v0.2.23"
    files:
      - name: clippy-sarif
        src: target/release/{{.FileName}}-{{.Arch}}-{{.OS}}
    supported_envs:
      - linux/amd64
  - version_constraint: Version == "clippy-sarif-v0.6.2"
    supported_envs:
      - linux/amd64
  - version_constraint: semver("> 0.4.2")
    supported_envs:
      - linux/amd64
      - darwin/arm64
  - version_constraint: semver("<= 0.4.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin/arm64
all_assets_filter: Asset matches "^clippy-sarif-.+-.+[.].+([.].+)?$" or Asset matches
  "^clippy-sarif-.+-.+([.].+)?$" or Asset endsWith ".intoto.jsonl"
