name: vburenin/ifacemaker
type: go_install
repo_owner: vburenin
repo_name: ifacemaker
repo_id: 59815144
description: Generate interfaces from structure methods
version_overrides:
  - version_constraint: semver(">= 1.2.0")
  - version_constraint: "true"
    type: github_release
    asset: ifacemaker_{{trimV .Version}}_{{.OS}}_{{.Arch}}.tar.gz
    rosetta2: true
    replacements:
      amd64: x86_64
      darwin: Darwin
      linux: Linux
      windows: Windows
    overrides:
      - goos: linux
        goarch: arm64
        type: go_install
        replacements: {}
        checksum:
          enabled: false
      - goos: windows
        goarch: arm64
        type: go_install
        replacements: {}
        checksum:
          enabled: false
