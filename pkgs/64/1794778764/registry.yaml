name: windvalley/gossh
type: github_release
repo_owner: windvalley
repo_name: gossh
repo_id: 340302671
description: A high-performance and high-concurrency ssh tool written in Go. It is
  10 times faster than Ansible. If you need much more performance and better ease
  of use, you will love it
version_overrides:
  - version_constraint: Version == "v0.6.1"
    no_asset: true
  - version_constraint: semver("> 1.12.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 1.12.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
