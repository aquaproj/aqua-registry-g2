name: square/certigo
type: github_release
repo_owner: square
repo_name: certigo
repo_id: 59852599
description: A utility to examine and validate certificates in a variety of formats
version_overrides:
  - version_constraint: semver("> 1.12.1")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 1.11.0")
    no_asset: true
  - version_constraint: semver("> 1.6.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.6.0")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
