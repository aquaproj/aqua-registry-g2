name: volta-cli/volta
type: github_release
repo_owner: volta-cli
repo_name: volta
repo_id: 104796770
description: 'Volta: JS Toolchains as Code'
version_overrides:
    - version_constraint: semver("> 1.1.1")
    - version_constraint: semver("> 1.0.8")
    - version_constraint: semver("> 1.0.6")
    - version_constraint: semver("> 1.0.0")
    - version_constraint: semver("> 0.7.2")
    - version_constraint: semver("> 0.4.1")
    - version_constraint: semver("> 0.3.0")
      files:
        - name: notion
    - version_constraint: semver("> 0.1.5")
      files:
        - name: notion
    - version_constraint: semver("<= 0.1.5")
      files:
        - name: notion
    - version_constraint: "true"
# Up to 1.0.8 the Linux build was published for OpenSSL 1.0, 1.1 and RHEL. The one for 1.0
# is the one aqua-registry installs.
all_assets_filter: not (Asset contains "openssl-1.1" or Asset contains "openssl-rhel")
