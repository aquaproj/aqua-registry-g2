name: palantir/policy-bot
type: github_release
repo_owner: palantir
repo_name: policy-bot
repo_id: 151643522
description: A GitHub App that enforces approval policies on pull requests
version_overrides:
  - version_constraint: Version == "v1.38.1"
    no_asset: true
  - version_constraint: semver("> 1.41.1")
    files:
      - name: policy-bot
        src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
    supported_envs:
      - darwin
      - linux
  - version_constraint: semver("> 1.27.4")
    files:
      - name: policy-bot
        src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
    supported_envs:
      - linux
  - version_constraint: semver("<= 1.27.4")
    files:
      - name: policy-bot
        src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
    supported_envs:
      - linux/amd64
  - version_constraint: "true"
    files:
      - name: policy-bot
        src: policy-bot-{{trimV .Version}}/bin/{{.OS}}-{{.Arch}}/policy-bot
    supported_envs:
      - darwin
      - linux
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
    filter: Asset matches "^policy-bot-.+[.].+([.].+)?$"
