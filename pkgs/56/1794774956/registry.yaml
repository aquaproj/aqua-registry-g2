name: asciidoctor/asciidoctor-reveal.js
type: github_release
repo_owner: asciidoctor
repo_name: asciidoctor-reveal.js
repo_id: 25130822
description: A reveal.js converter for Asciidoctor and Asciidoctor.js. Write your
  slides in AsciiDoc
files:
  - name: asciidoctor-revealjs
version_overrides:
  - version_constraint: semver("> 3.0.0")
    files:
      - name: asciidoctor-revealjs
        src: asciidoctor-reveal.js
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 3.0.0")
    no_asset: true
  - version_constraint: "true"
    files:
      - name: asciidoctor-revealjs
        src: asciidoctor-reveal.js
    supported_envs:
      - darwin
      - windows
      - amd64
