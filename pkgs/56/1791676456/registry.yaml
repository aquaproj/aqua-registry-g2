      - goos: windows
        files:
          - name: csvlens
  - version_constraint: semver("< 0.10.0")
    files:
      - name: csvlens
        src: csvlens-{{.Arch}}-{{.OS}}/csvlens
    overrides:
      - goos: windows
        files:
          - name: csvlens
  - version_constraint: "true"
    files:
      - name: csvlens
        src: csvlens-{{.Arch}}-{{.OS}}/csvlens
    overrides:
      - goos: windows
        files:
          - name: csvlens
