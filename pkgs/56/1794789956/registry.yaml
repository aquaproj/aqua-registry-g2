name: openclarity/kubeclarity
type: github_release
repo_owner: openclarity
repo_name: kubeclarity
repo_id: 840731904
description: KubeClarity is a tool for detection and management of Software Bill Of
  Materials (SBOM) and vulnerabilities of container images and filesystems
# The repository also releases its Helm chart, tagged kubeclarity-v<version>-helm.
version_filter: not (Version endsWith "-helm")
files:
  - name: kubeclarity-cli
supported_envs:
  - linux
  - darwin
# v2.23.3's kubeclarity-cli-2.23.3-darwin-arm64.tar.gz is cut off at 20 MiB, partway
# through the binary, so darwin/arm64 runs the amd64 build under Rosetta 2.
asset_filters:
  - version_constraint: Version == "v2.23.3"
    all_assets_filter: not (Asset endsWith "-darwin-arm64.tar.gz")
version_overrides:
  - version_constraint: semver(">= 2.1.0")
  - version_constraint: semver("= 2.0.0")
    files:
      - name: kubeclarity-cli
        src: cli
  - version_constraint: "true"
