name: Future-Element/pinset
type: github_release
repo_owner: Future-Element
repo_name: pinset
repo_id: 1314775833
description: A predictable, local-first runtime version manager for multilingual projects
files:
  - name: pinset
  - name: pinset-shim
github_artifact_attestations:
  signer_workflow: Future-Element/pinset/.github/workflows/release.yml
version_overrides:
  - version_constraint: semver("> 2.15.0")
    supported_envs:
      - linux
      - darwin/arm64
      - windows/amd64
  - version_constraint: semver("<= 2.15.0")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin/arm64
      - windows/amd64
