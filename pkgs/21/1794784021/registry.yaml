name: neilpa/yajsv
type: github_release
repo_owner: neilpa
repo_name: yajsv
repo_id: 236075733
description: Yet Another JSON Schema Validator [CLI]
version_overrides:
  - version_constraint: semver("> 1.1.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.1.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
