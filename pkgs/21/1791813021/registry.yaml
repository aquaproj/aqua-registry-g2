name: xremap/xremap/hypr
aliases:
  - name: k0kubun/xremap/hypr
type: github_release
repo_owner: xremap
repo_name: xremap
repo_id: 75132102
description: Key remapper for X11 and Wayland (for Hyprland)
version_overrides:
  - version_constraint: semver("> 0.9.0")
    error_message: |
      The client for hypr was dropped.
      https://github.com/xremap/xremap/pull/479
  - version_constraint: semver("> 0.7.12")
    files:
      - name: xremap
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 0.7.12")
    no_asset: true
  - version_constraint: "true"
    error_message: |
      The client for hypr was dropped.
      https://github.com/xremap/xremap/pull/479
all_assets_filter: Asset matches "^xremap-.+-.+-hypr[.].+([.].+)?$" or Asset endsWith ".intoto.jsonl"
