name: containerd/stargz-snapshotter
type: github_release
repo_owner: containerd
repo_name: stargz-snapshotter
repo_id: 213618352
description: |-
  Fast container image distribution plugin with lazy pulling

  ## How to set up

  Please see:

  https://github.com/containerd/stargz-snapshotter/blob/main/docs/INSTALL.md
  https://github.com/containerd/stargz-snapshotter/blob/main/docs/rootless.md
files:
  - name: containerd-stargz-grpc
  - name: ctr-remote
  - name: stargz-store
  - name: stargz-store-helper
version_overrides:
  - version_constraint: semver(">= 0.16.0")
  # stargz-store-helper is in the archive from v0.16.0, and stargz-store from v0.6.0.
  - version_constraint: semver(">= 0.6.0")
    files:
      - name: containerd-stargz-grpc
      - name: ctr-remote
      - name: stargz-store
  - version_constraint: semver("< 0.6.0")
    files:
      - name: containerd-stargz-grpc
      - name: ctr-remote
  - version_constraint: "true"
