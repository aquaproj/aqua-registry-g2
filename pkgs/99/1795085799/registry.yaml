name: faberlang/releases/faber
type: github_release
repo_owner: faberlang
repo_name: releases
repo_id: 1302672799
description: Faber (Faber Romanus), an experimental programming language designed
  to be written by language models and read by people
version_prefix: faber-v
files:
  - name: faber
    src: bin/faber
supported_envs:
  - darwin/arm64
  - linux/amd64
version_overrides:
  - version_constraint: SemVer == "1.5.1"
    supported_envs:
      - darwin/arm64
  - version_constraint: "true"
all_assets_filter: Asset matches "^faber-v.+-.+-.+[.]tar[.]gz([.].+)?$" or Asset endsWith
  ".intoto.jsonl"
