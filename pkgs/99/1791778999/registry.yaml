name: qpdf/qpdf
type: github_release
repo_owner: qpdf
repo_name: qpdf
repo_id: 4539167
description: Content-preserving PDF document transformer
version_filter: Version startsWith "release-qpdf-" or Version matches "^v[0-9]"
version_overrides:
  - version_constraint: Version == "vcpkg-cache-v1"
    no_asset: true
  - version_constraint: Version startsWith "release-qpdf-"
    error_message: Please use v11.0.0 or later
  - version_constraint: semver("<= 12.2.0")
    files:
      - name: qpdf
        src: bin/qpdf
    overrides:
      - goos: windows
        files:
          - name: qpdf
            src: qpdf-{{trimV .Version}}-mingw64/bin/qpdf
    supported_envs:
      - linux/amd64
      - windows/amd64
  - version_constraint: "true"
    files:
      - name: qpdf
        src: bin/qpdf
    overrides:
      - goos: windows
        files:
          - name: qpdf
            src: qpdf-{{trimV .Version}}-mingw64/bin/qpdf
    supported_envs:
      - linux/amd64
      - windows/amd64
# The Windows build the files describe is qpdf-<version>-mingw64.zip. The .exe assets are
# installers, and the 32-bit and msvc builds tied with it.
all_assets_filter: Asset contains "-bin-linux-" or Asset endsWith "-mingw64.zip"
