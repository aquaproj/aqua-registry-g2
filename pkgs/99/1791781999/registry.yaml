name: variadico/noti
type: github_release
repo_owner: variadico
repo_name: noti
repo_id: 33417782
description: Monitor a process and trigger a notification
version_overrides:
  - version_constraint: Version == "v1.3.0"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: Version in ["v2.0.0", "v2.6.0"]
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: Version == "v2.1.0"
    supported_envs:
      - darwin
  - version_constraint: Version == "v2.7.0"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.2.0")
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 2.2.1")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 2.5.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 3.2.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 3.4.0")
    supported_envs:
      - linux/amd64
      - windows/amd64
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
