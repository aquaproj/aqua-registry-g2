name: cloudposse/github-commenter
type: github_release
repo_owner: cloudposse
repo_name: github-commenter
repo_id: 124439918
description: Command line utility for creating GitHub comments on Commits, Pull Request
  Reviews or Issues
version_overrides:
  - version_constraint: Version in ["0.11.1", "0.11.3", "0.11.4"]
    no_asset: true
  - version_constraint: Version == "0.10.0"
    supported_envs:
      - darwin
  - version_constraint: Version in ["0.11.5"]
    supported_envs:
      - darwin
  - version_constraint: Version == "0.16.0"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: Version == "0.16.2"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 0.27.0")
  - version_constraint: semver("> 0.19.0")
    no_asset: true
  - version_constraint: semver("> 0.16.1")
  - version_constraint: semver("> 0.14.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.12.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.12.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
