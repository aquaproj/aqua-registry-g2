name: apple/pkl-go/pkl-gen-go
type: github_release
repo_owner: apple
repo_name: pkl-go
repo_id: 745600827
description: Generates Go bindings for a Pkl module
version_filter: Version startsWith "v"
version_overrides:
  - version_constraint: semver(">= 0.13.0")
    error_message: |
      Releases since v0.13.0 don't include pkl-gen-go binaries.

      https://github.com/apple/pkl-go/releases
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
all_assets_filter: Asset matches "^pkl-gen-go-.+-.+[.]bin([.].+)?$" or Asset matches
  "^pkl-gen-go-.+[.]bin([.].+)?$" or Asset endsWith ".intoto.jsonl"
