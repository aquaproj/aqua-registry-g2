name: cloudposse/slack-notifier
type: github_release
repo_owner: cloudposse
repo_name: slack-notifier
repo_id: 120956686
description: Command line utility to send messages with attachments to Slack channels
  via Incoming Webhooks
version_overrides:
  - version_constraint: Version == "0.5.0"
  - version_constraint: Version == "0.5.1"
  - version_constraint: Version == "0.8.0"
  - version_constraint: semver("> 0.7.0")
    files:
      - name: slack-notifier
        src: slack-notifier_v{{.Version}}
  - version_constraint: semver("> 0.4.0")
    no_asset: true
  - version_constraint: semver("<= 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: slack-notifier
        src: slack-notifier_v{{.Version}}
