name: rlmcpherson/s3gof3r
type: github_release
repo_owner: rlmcpherson
repo_name: s3gof3r
repo_id: 11843609
description: Fast, concurrent, streaming access to Amazon S3, including gof3r, a CLI
files:
  - name: gof3r
    src: gof3r_{{trimV .Version}}_{{.OS}}_{{.Arch}}/gof3r
supported_envs:
  - darwin
  - amd64
version_overrides:
  # Only v0.5.0 publishes a Windows build, gof3r.exe.
  - version_constraint: semver("< 0.5.0")
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: "true"
