name: containers/conmon
type: github_release
repo_owner: containers
repo_name: conmon
repo_id: 144288854
description: An OCI container runtime monitor
version_overrides:
  - version_constraint: semver("<= 2.0.9") || Version in ["v2.2.0", "v2.1.1", "v2.0.29",
      "v2.0.28", "v2.0.21"]
    no_asset: true
  - version_constraint: semver("<= 2.0.17") || Version in ["v2.0.20", "v2.0.24"]
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 2.0.19")
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 2.0.23") || Version == "v2.0.25"
    files:
      - name: conmon
        src: result/bin/conmon
    supported_envs:
      - linux
  - version_constraint: semver("<= 2.0.32") && semver(">= 2.0.30")
    files:
      - name: conmon
        src: bin/conmon
    replacements:
      amd64: x86
    supported_envs:
      - linux
  - version_constraint: "true"
    supported_envs:
      - linux
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
    filter: Asset matches "^conmon([.].+)?$" or Asset matches "^conmon-.+([.].+)?$"
      or Asset matches "^conmon-.+[.].+([.].+)?$" or Asset matches "^conmon[.].+([.].+)?$"
