name: ktlint/ktlint
aliases:
  - name: pinterest/ktlint
type: github_release
repo_owner: ktlint
repo_name: ktlint
repo_id: 64293719
description: An anti-bikeshedding Kotlin linter with built-in formatter
version_overrides:
  - version_constraint: semver("> 0.49.0")
    files:
      - name: ktlint
        src: '{{.AssetWithoutExt}}/bin/ktlint'
  - version_constraint: semver("<= 0.49.0")
  - version_constraint: "true"
    files:
      - name: ktlint
        src: '{{.AssetWithoutExt}}/bin/ktlint'
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
      - windows/arm64
    filter: Asset matches "^ktlint([.].+)?$" or Asset matches "^ktlint-.+[.].+([.].+)?$"
