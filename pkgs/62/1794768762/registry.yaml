name: bazelbuild/bazel-watcher
type: github_release
repo_owner: bazelbuild
repo_name: bazel-watcher
repo_id: 91018552
description: Tools for building Bazel targets when source files change
files:
  - name: ibazel
version_overrides:
  - version_constraint: Version in ["v0.15.1", "v0.26.0", "v0.26.3", "v0.26.5"]
    no_asset: true
  - version_constraint: Version in ["v0.16.0", "v0.21.1"]
    supported_envs:
      - linux/amd64
      - windows
  - version_constraint: Version == "V0.25.1"
    version_prefix: V
  - version_constraint: Version == "V0.26.4"
    version_prefix: V
    supported_envs:
      - linux/amd64
      - darwin/arm64
      - windows
  - version_constraint: Version == "V0.26.6"
    version_prefix: V
    supported_envs:
      - linux
      - darwin/arm64
      - windows
  - version_constraint: semver("> 0.26.7")
  - version_constraint: semver("> 0.25.1")
    supported_envs:
      - linux
      - darwin/arm64
      - windows
  - version_constraint: semver("> 0.23.1")
  - version_constraint: semver("> 0.22.0")
    supported_envs:
      - darwin
  - version_constraint: semver("> 0.21.0")
  - version_constraint: semver("> 0.9.1")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.4.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.4.0")
    no_asset: true
  - version_constraint: "true"
