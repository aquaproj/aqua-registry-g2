name: chaaz/versio
type: github_release
repo_owner: chaaz
repo_name: versio
repo_id: 291630527
description: A version number manager
version_overrides:
  - version_constraint: Version == "v0.5.2"
    supported_envs:
      - linux/amd64
      - windows/amd64
  - version_constraint: Version == "v0.5.3"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.7.6")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.5.1")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 0.4.5")
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 0.4.5")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
