name: ko1nksm/getoptions
type: github_release
repo_owner: ko1nksm
repo_name: getoptions
repo_id: 286552947
description: An elegant option/argument parser for shell scripts (full support for
  bash and all POSIX shells)
supported_envs:
  - linux
  - darwin
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
    filter: Asset matches "^getoptions([.].+)?$"
