name: aws/amazon-ec2-spot-interrupter
type: github_release
repo_owner: aws
repo_name: amazon-ec2-spot-interrupter
repo_id: 469878284
description: The ec2-spot-interrupter is a simple CLI tool that triggers Amazon EC2
  Spot Interruption Notifications and Rebalance Recommendations
files:
  - name: ec2-spot-interrupter
version_overrides:
  - version_constraint: Version == "v0.0.11"
    no_asset: true
  - version_constraint: semver("> 0.0.10")
    supported_envs:
      - darwin
      - linux
  - version_constraint: semver("> 0.0.7")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.0.7")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - darwin
      - linux
