name: Traackr/binnacle
type: github_release
repo_owner: Traackr
repo_name: binnacle
repo_id: 130412631
description: An opinionated tool to interact with Kubernetes' Helm
version_overrides:
  - version_constraint: semver("> 0.0.3")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.0.3")
    supported_envs:
      - linux/amd64
      - windows
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
