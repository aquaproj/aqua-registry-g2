name: aubepkg/aube
aliases:
  - name: endevco/aube
  - name: jdx/aube
type: github_release
repo_owner: aubepkg
repo_name: aube
repo_id: 1214542327
description: A fast Node.js package manager
packslip:
  identity_prefix: https://github.com/aubepkg/aube/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: aubepkg/aube/.github/workflows/release.yml
version_overrides:
  - version_constraint: Version == "v1.0.0-beta.1"
  - version_constraint: semver("> 2.2.8")
    github_artifact_attestations:
      signer_workflow: aubepkg/aube/.github/workflows/release.yml
  - version_constraint: semver("> 2.2.4")
    github_artifact_attestations:
      signer_workflow: aubepkg/aube/.github/workflows/release.yml
  - version_constraint: semver("> 1.1.0")
  - version_constraint: semver("> 1.0.0-beta.11")
  - version_constraint: semver("<= 1.0.0-beta.11")
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: aubepkg/aube/.github/workflows/release.yml
all_assets_filter: not ((Asset matches "^libaube-") or (Asset == "aube.h"))
