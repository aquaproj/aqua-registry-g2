name: linebender/resvg
type: github_release
repo_owner: linebender
repo_name: resvg
repo_id: 72125332
description: An SVG rendering library
version_overrides:
  - version_constraint: semver("<= 0.15.0")
    error_message: This version is not supported. Please use a newer version.
  - version_constraint: Version == "0.45.0"
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 0.41.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.44.0")
    supported_envs:
      - linux/amd64
      - windows/amd64
  - version_constraint: semver(">= 0.48.0")
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
all_assets_filter: not (Asset matches "usvg")
