name: k1LoW/octocov
type: github_release
repo_owner: k1LoW
repo_name: octocov
repo_id: 361720627
description: octocov is a toolkit for collecting code metrics (code coverage, code
  to test ratio, test execution time and your own custom metrics)
version_overrides:
  - version_constraint: Version == "v0.47.0"
    supported_envs:
      - linux/amd64
  - version_constraint: semver("> 0.56.1")
  - version_constraint: semver("> 0.51.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.28.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.28.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
