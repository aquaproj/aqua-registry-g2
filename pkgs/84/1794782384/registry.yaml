name: Scalingo/cli
type: github_release
repo_owner: Scalingo
repo_name: cli
repo_id: 11901464
description: Command Line client for Scalingo PaaS
files:
  - name: scalingo
    src: scalingo_{{.Version}}_{{.OS}}_{{.Arch}}/scalingo
version_overrides:
  - version_constraint: semver(">= 1.21.0")
  - version_constraint: semver(">= 1.20.1")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: semver("< 1.20.1")
    overrides:
      - goos: windows
        files:
          - name: scalingo
    supported_envs:
      - darwin
      - amd64
  - version_constraint: "true"
