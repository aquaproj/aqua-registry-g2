name: tektoncd/pipelines-as-code
aliases:
  - name: openshift-pipelines/pipelines-as-code
type: github_release
repo_owner: tektoncd
repo_name: pipelines-as-code
repo_id: 355197825
description: Pipelines-as-Code for Tekton
files:
  - name: tkn-pac
version_overrides:
  - version_constraint: Version == "v0.33.0"
  - version_constraint: Version == "v0.36.0"
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.35.2")
  - version_constraint: semver("> 0.32.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.3.0")
  - version_constraint: semver("<= 0.3.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
