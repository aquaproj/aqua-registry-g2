name: apple/container
type: github_release
repo_owner: apple
repo_name: container
repo_id: 993475914
description: A tool for creating and running Linux containers using lightweight virtual machines on a Mac. It is written in Swift, and optimized for Apple silicon
# The installer holds an arm64 executable alone; container is for Apple silicon. Its name
# says no architecture, so without this it would also be offered to darwin/amd64.
supported_envs:
  - darwin/arm64
version_overrides:
    - version_constraint: semver("> 0.9.0")
      files:
        - name: container
          src: Payload/bin/container
    - version_constraint: semver("> 0.6.0")
      files:
        - name: container
          src: Payload/bin/container
    - version_constraint: semver("<= 0.6.0")
      files:
        - name: container
          src: Payload/bin/container
    - version_constraint: "true"
      files:
        - name: container
          src: Payload/bin/container
# From 0.9.0 the installer is published signed and unsigned, and the two tie. The signed one
# is what Apple's README points at.
all_assets_filter: not (Asset contains "-unsigned")
