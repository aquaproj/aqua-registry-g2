name: minamijoyo/tfschema
type: github_release
repo_owner: minamijoyo
repo_name: tfschema
repo_id: 117117824
description: A schema inspector for Terraform / OpenTofu providers
version_overrides:
  - version_constraint: semver("> 0.7.2")
  - version_constraint: semver("> 0.1.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.1.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
