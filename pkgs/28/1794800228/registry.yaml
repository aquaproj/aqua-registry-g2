name: syntax-sh/lexicon-releases
type: github_release
repo_owner: syntax-sh
repo_name: lexicon-releases
repo_id: 1291529228
description: CLI that builds a shared, indexed cache of vendor library/API documentation
  for coding agents
files:
  - name: lexicon
github_artifact_attestations:
  signer_workflow: syntax-sh/lexicon-releases/.github/workflows/attest.yml
version_overrides:
  - version_constraint: semver("> 0.3.0")
    files:
      - name: lexicon
        src: '{{.AssetWithoutExt}}/lexicon'
    github_artifact_attestations:
      signer_workflow: syntax-sh/lexicon-releases/.github/workflows/attest.yml
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.1.2")
    files:
      - name: lexicon
        src: '{{.AssetWithoutExt}}/lexicon'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.1.2")
    files:
      - name: lexicon
        src: '{{.AssetWithoutExt}}/lexicon'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: lexicon
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: lexicon
        src: '{{.AssetWithoutExt}}/lexicon'
    github_artifact_attestations:
      signer_workflow: syntax-sh/lexicon-releases/.github/workflows/attest.yml
    supported_envs:
      - darwin
      - windows
      - amd64
