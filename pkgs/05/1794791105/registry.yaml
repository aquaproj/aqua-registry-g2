name: suzuki-shunsuke/ghir
type: github_release
repo_owner: suzuki-shunsuke
repo_name: ghir
repo_id: 1069659306
description: ghir is a CLI making past GitHub Releases immutable
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 1.0.1")
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("> 0.0.3")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("<= 0.0.3")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
