name: kubernetes-sigs/aws-iam-authenticator
type: github_release
repo_owner: kubernetes-sigs
repo_name: aws-iam-authenticator
repo_id: 99036030
description: A tool to use AWS IAM credentials to authenticate to a Kubernetes cluster
version_overrides:
  - version_constraint: Version in ["v0.1.0", "v0.5.4", "v0.5.27", "v0.6.20"]
    no_asset: true
  - version_constraint: Version == "v0.3.0"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.4.0-alpha.3")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.5.3")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
