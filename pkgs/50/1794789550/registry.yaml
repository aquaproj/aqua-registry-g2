name: phrase/phrase-cli
type: github_release
repo_owner: phrase
repo_name: phrase-cli
repo_id: 259851765
description: CLI for the Phrase API
files:
  - name: phrase
version_overrides:
  - version_constraint: Version == "2.0.15-alpine-alpha9"
    no_asset: true
  - version_constraint: semver("> 2.4.1")
    files:
      - name: phrase
        src: phrase_{{.OS}}_{{.Arch}}
    overrides:
      - goos: darwin
        files:
          - name: phrase
  - version_constraint: semver("> 2.0.14")
    files:
      - name: phrase
        src: phrase_{{.OS}}_{{.Arch}}
    overrides:
      - goos: darwin
        files:
          - name: phrase
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 2.0.14")
    files:
      - name: phrase
        src: phrase_{{.OS}}_{{.Arch}}
    overrides:
      - goos: darwin
        files:
          - name: phrase
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: phrase
        src: phrase_{{.OS}}_{{.Arch}}
    overrides:
      - goos: darwin
        files:
          - name: phrase
