name: suzuki-shunsuke/sort-issue-template
type: github_release
repo_owner: suzuki-shunsuke
repo_name: sort-issue-template
repo_id: 900797239
description: CLI to sort GitHub Issue Templates using a text editor
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
version_overrides:
  - version_constraint: semver("> 0.1.4")
  - version_constraint: semver("<= 0.1.4")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: "true"
