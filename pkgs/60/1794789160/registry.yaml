name: containerd/fuse-overlayfs-snapshotter
type: github_release
repo_owner: containerd
repo_name: fuse-overlayfs-snapshotter
repo_id: 216317554
description: fuse-overlayfs plugin for rootless containerd on old Linux (not needed
  on modern Linux)
files:
  - name: containerd-fuse-overlayfs-grpc
github_artifact_attestations:
  signer_workflow: containerd/fuse-overlayfs-snapshotter/.github/workflows/release.yml
version_overrides:
  - version_constraint: Version == "v1.0.0"
    no_asset: true
  - version_constraint: semver("> 2.1.4")
    github_artifact_attestations:
      signer_workflow: containerd/fuse-overlayfs-snapshotter/.github/workflows/release.yml
    supported_envs:
      - linux
  - version_constraint: semver("> 2.1.2")
    no_asset: true
  - version_constraint: semver("<= 2.1.2")
    supported_envs:
      - linux
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: containerd/fuse-overlayfs-snapshotter/.github/workflows/release.yml
    supported_envs:
      - linux
