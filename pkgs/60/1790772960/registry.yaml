name: peco/peco
type: github_release
repo_owner: peco
repo_name: peco
description: Simplistic interactive filtering tool
version_overrides:
    - version_constraint: Version == "v0.5.5"
      no_asset: true
    - version_constraint: semver("> 0.5.11")
    - version_constraint: semver("> 0.5.8")
      files:
        - name: peco
          src: peco_{{.OS}}_{{.Arch}}/peco
    - version_constraint: semver("> 0.5.0")
      files:
        - name: peco
          src: peco_{{.OS}}_{{.Arch}}/peco
    - version_constraint: semver("> 0.3.5")
      files:
        - name: peco
          src: peco_{{.OS}}_{{.Arch}}/peco
    - version_constraint: semver("> 0.1.9")
      files:
        - name: peco
          src: peco_{{.OS}}_{{.Arch}}/peco
    - version_constraint: semver("<= 0.1.9")
      files:
        - name: peco
          src: peco_{{.OS}}_{{.Arch}}/peco
      overrides:
        - goos: windows
          files:
            - name: peco
    - version_constraint: "true"
