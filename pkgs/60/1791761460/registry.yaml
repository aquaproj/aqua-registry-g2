name: vjeantet/alerter
type: github_release
repo_owner: vjeantet
repo_name: alerter
repo_id: 48335712
description: Send User Alert Notification on MacOS from the command-line
version_overrides:
  - version_constraint: semver("> 4.0.0")
    supported_envs:
      - darwin/arm64
  - version_constraint: semver("<= 4.0.0")
    supported_envs:
      - darwin
  - version_constraint: "true"
    supported_envs:
      - darwin/arm64
# From v26.2 each release publishes a pkg beside the zip. ar2 can't open a pkg on Linux, so it
# couldn't see that the executable is built for arm64 alone and offered it for darwin/amd64
# too; the zip holds the same executable and can be checked.
all_assets_filter: not (Asset endsWith ".pkg")
