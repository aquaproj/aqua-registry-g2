name: DeNA/unity-meta-check/gh-action
type: github_release
repo_owner: DeNA
repo_name: unity-meta-check
repo_id: 339063961
description: Binary for GitHub Actions of DeNA/unity-meta-check
version_overrides:
  - version_constraint: semver("> 3.3.0")
    supported_envs:
      - linux
  - version_constraint: semver("<= 3.3.0")
    supported_envs:
      - linux/amd64
  - version_constraint: "true"
    supported_envs:
      - linux
# The release also carries gh-action-yaml-gen-<os>-<arch>, another program, for darwin and
# windows as well. gh-action itself is built for Linux alone.
all_assets_filter: (Asset startsWith "gh-action-" and not (Asset startsWith "gh-action-yaml-gen-")) or Asset endsWith ".intoto.jsonl"
