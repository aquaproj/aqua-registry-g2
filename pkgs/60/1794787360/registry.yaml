name: lintnet/lintnet
aliases:
  - name: suzuki-shunsuke/lintnet
type: github_release
repo_owner: lintnet
repo_name: lintnet
repo_id: 730666068
description: General Linter powered by Jsonnet
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 1.0.0")
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("> 0.4.8-1")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("<= 0.4.8-1")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
