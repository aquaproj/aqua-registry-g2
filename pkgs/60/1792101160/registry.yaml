name: facebook/buck2
type: github_release
repo_owner: facebook
repo_name: buck2
repo_id: 450625045
description: Build system, successor to Buck
version_overrides:
  - version_constraint: Version == "latest"
    error_message: |
      aqua doesn't support mutable versions such as "latest". Please change the version
  - version_constraint: semver("> 2023-07-11")
    files:
      - name: buck2
        src: buck2-{{.Arch}}-{{.OS}}
  - version_constraint: semver("<= 2023-07-11")
    files:
      - name: buck2
        src: buck2-{{.Arch}}-{{.OS}}
  - version_constraint: "true"
    files:
      - name: buck2
        src: buck2-{{.Arch}}-{{.OS}}
