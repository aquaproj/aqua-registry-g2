name: awslabs/dynein
type: github_release
repo_owner: awslabs
repo_name: dynein
repo_id: 312885986
description: DynamoDB CLI written in Rust
files:
  - name: dy
version_overrides:
  - version_constraint: semver("> 0.1.2")
    replacements:
      linux/amd64: linux
      linux/arm64: linux-arm
  - version_constraint: semver("<= 0.1.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    replacements:
      linux/amd64: linux
      linux/arm64: linux-arm
# v0.2.0's .tar.gz assets are uncompressed tars despite their names, which aqua can't unpack;
# only the windows zip is usable.
asset_filters:
  - version_constraint: Version == "v0.2.0"
    all_assets_filter: Asset endsWith ".zip"
