      signer_workflow: GitGuardian/ggshield/.github/workflows/tag.yml
    overrides:
      - goos: windows
        files:
          - name: ggshield
            src: ggshield-{{trimV .Version}}-{{.Arch}}-{{.OS}}/ggshield
      - goos: linux
        files:
          - name: ggshield
            src: ggshield-{{trimV .Version}}-{{.Arch}}-{{.OS}}/ggshield
  - version_constraint: semver("> 1.30.2")
    files:
      - name: ggshield
        src: ggshield-{{trimV .Version}}-{{.Arch}}-{{.OS}}/ggshield
    overrides:
