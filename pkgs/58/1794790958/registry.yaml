name: ibotta/sopstool
type: github_release
repo_owner: ibotta
repo_name: sopstool
repo_id: 119301074
description: SOPS multi-file wrapper
version_overrides:
  - version_constraint: semver("> 1.1.3")
  - version_constraint: semver("> 0.4.4")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 0.4.4")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
