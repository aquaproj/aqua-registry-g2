name: mumoshu/config-registry
type: github_release
repo_owner: mumoshu
repo_name: config-registry
repo_id: 302496428
description: Switch between kubeconfigs and avoid unintentional operation on your
  production clusters
version_overrides:
  # Up to v0.2.0 the command was called kubeconf, and the archive holds it under that name.
  - version_constraint: semver("<= 0.2.0")
    files:
      - name: kubeconf
  - version_constraint: "true"
