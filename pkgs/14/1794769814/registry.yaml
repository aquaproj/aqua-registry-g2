name: cococonscious/koji
aliases:
  - name: its-danny/koji
type: github_release
repo_owner: cococonscious
repo_name: koji
repo_id: 419508134
description: An interactive CLI for creating conventional commits
version_overrides:
  - version_constraint: semver("> 2.2.0")
    supported_envs:
      - linux/amd64
      - darwin/arm64
      - windows
  - version_constraint: semver("> 1.4.0")
    files:
      - name: koji
        src: '{{.AssetWithoutExt}}/koji'
  - version_constraint: semver("> 1.2.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 1.2.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin/arm64
      - windows
