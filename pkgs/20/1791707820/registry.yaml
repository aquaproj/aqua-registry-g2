name: rust-cross/cargo-zigbuild
type: github_release
repo_owner: rust-cross
repo_name: cargo-zigbuild
repo_id: 459882952
description: Compile Cargo project with zig as linker
version_overrides:
  - version_constraint: Version == "v0.10.0"
  - version_constraint: semver("> 0.21.4")
    files:
      - name: cargo-zigbuild
        src: '{{.AssetWithoutExt}}/{{.FileName}}'
    overrides:
      - goos: windows
        files:
          - name: cargo-zigbuild
  - version_constraint: semver("> 0.9.0")
  - version_constraint: semver("<= 0.9.0")
  - version_constraint: "true"
    files:
      - name: cargo-zigbuild
        src: '{{.AssetWithoutExt}}/{{.FileName}}'
    overrides:
      - goos: windows
        files:
          - name: cargo-zigbuild
