name: wren-lang/wren-cli
type: github_release
repo_owner: wren-lang
repo_name: wren-cli
repo_id: 209401273
description: A command line tool for the Wren programming language
files:
  - name: wren_cli
version_overrides:
  - version_constraint: Version == "0.3.0"
    files:
      - name: wren_cli
        src: '{{.AssetWithoutExt}}/wren_cli'
    overrides:
      - goos: darwin
        files:
          - name: wren_cli
      - goos: windows
        files:
          - name: wren_cli
            src: wren_cli-{{.Version}}.exe
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: wren_cli
        src: '{{.AssetWithoutExt}}/wren_cli'
    supported_envs:
      - darwin
      - windows
      - amd64
