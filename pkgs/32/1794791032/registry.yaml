name: grafana/flint
type: github_release
repo_owner: grafana
repo_name: flint
repo_id: 1157902094
description: Flint is a fast linter runner that keeps local and CI checks consistent
  with one binary, one config, and only the tools your repo declares
packslip:
  identity_prefix: https://github.com/grafana/flint/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: grafana/flint/.github/workflows/release.yml
version_overrides:
  # v0.22.0 was attested by release-assets.yml, which upstream renamed to release.yml after.
  - version_constraint: Version == "v0.22.0"
    github_artifact_attestations:
      signer_workflow: grafana/flint/.github/workflows/release-assets.yml
  - version_constraint: semver("> 0.9.2")
    github_artifact_attestations:
      signer_workflow: grafana/flint/.github/workflows/release.yml
  - version_constraint: semver("<= 0.9.2")
    no_asset: true
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: grafana/flint/.github/workflows/release.yml
