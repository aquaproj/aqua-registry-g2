name: dyne/slangroom-exec
type: github_release
repo_owner: dyne
repo_name: slangroom-exec
repo_id: 799908380
description: Execute all Zencode from Zenroom and Slangroom plugins in one shot
version_overrides:
  - version_constraint: semver("> 1.5.0")
    files:
      - name: slangroom-exec
      - name: slexfe
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 1.5.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: "true"
    files:
      - name: slangroom-exec
      - name: slexfe
    supported_envs:
      - linux
      - darwin
