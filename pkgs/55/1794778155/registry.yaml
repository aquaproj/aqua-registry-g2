name: domoritz/arrow-tools/csv2arrow
type: github_release
repo_owner: domoritz
repo_name: arrow-tools
repo_id: 596376544
description: A collection of handy CLI tools to convert CSV and JSON to Apache Arrow
  and Parquet
version_overrides:
  - version_constraint: Version == "v0.12.0"
    no_asset: true
  - version_constraint: semver("> 0.22.3")
    files:
      - name: csv2arrow
        src: '{{.AssetWithoutExt}}/csv2arrow'
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: semver("> 0.8.0")
    files:
      - name: csv2arrow
        src: '{{.AssetWithoutExt}}/csv2arrow'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: csv2arrow
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.8.0")
    files:
      - name: csv2arrow
        src: '{{.AssetWithoutExt}}/csv2arrow'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: csv2arrow
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: csv2arrow
        src: '{{.AssetWithoutExt}}/csv2arrow'
    supported_envs:
      - linux
      - darwin/arm64
all_assets_filter: Asset matches "^csv2arrow-.+-.+-.+[.].+([.].+)?$" or Asset matches
  "^csv2arrow-.+-.+[.].+([.].+)?$" or Asset endsWith ".intoto.jsonl"
