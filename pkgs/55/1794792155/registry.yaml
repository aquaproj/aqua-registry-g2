name: ricoberger/grafana-kubernetes-plugin
type: github_release
repo_owner: ricoberger
repo_name: grafana-kubernetes-plugin
repo_id: 1076335547
description: The Grafana Kubernetes Plugin allows you to explore your Kubernetes resources
  and logs directly within Grafana
files:
  - name: kubectl-grafana
github_artifact_attestations:
  signer_workflow: ricoberger/grafana-kubernetes-plugin/.github/workflows/release.yml
version_overrides:
  - version_constraint: semver(">= 0.6.0")
    github_artifact_attestations:
      signer_workflow: ricoberger/grafana-kubernetes-plugin/.github/workflows/release.yml
  - version_constraint: semver("> 0.4.0")
  - version_constraint: semver("> 0.2.0")
    files:
      - name: kubectl-grafana
        src: kubectl-grafana-{{.OS}}-{{.Arch}}
  - version_constraint: semver("<= 0.2.0")
    no_asset: true
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: ricoberger/grafana-kubernetes-plugin/.github/workflows/release.yml
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
      - windows/arm64
    filter: Asset matches "^kubectl-grafana[.]tar[.]gz([.].+)?$"
