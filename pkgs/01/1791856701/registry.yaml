name: awslabs/soci-snapshotter
type: github_release
repo_owner: awslabs
repo_name: soci-snapshotter
repo_id: 523372474
files:
  - name: soci
  - name: soci-snapshotter-grpc
version_overrides:
  - version_constraint: semver("> 0.1.0")
    files:
      - name: soci
      - name: soci-snapshotter-grpc
    supported_envs:
      - linux
  - version_constraint: semver("<= 0.1.0")
    files:
      - name: soci
      - name: soci-snapshotter-grpc
    supported_envs:
      - linux
  - version_constraint: "true"
    files:
      - name: soci
      - name: soci-snapshotter-grpc
    supported_envs:
      - linux
# v0.4.0 publishes every build twice, as -0.4.0- and -v0.4.0-, identical in size.
asset_filters:
  - version_constraint: Version == "v0.4.0"
    all_assets_filter: not (Asset contains "-v0.4.0-")
