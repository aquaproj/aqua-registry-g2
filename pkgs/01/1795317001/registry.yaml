name: Mattbusel/HelixRouter-adaptive-async-compute-router-
type: github_release
repo_owner: Mattbusel
repo_name: HelixRouter-adaptive-async-compute-router-
repo_id: 1127018376
description: Adaptive Tokio job router that picks inline, spawn, CPU pool, batch or
  drop per job from cost and live pressure
files:
  - name: helixrouter
version_overrides:
  - version_constraint: semver("> 1.0.0")
    files:
      - name: helixrouter
        src: '{{.AssetWithoutExt}}/helixrouter'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.0.0")
    no_asset: true
  - version_constraint: "true"
    files:
      - name: helixrouter
        src: '{{.AssetWithoutExt}}/helixrouter'
    supported_envs:
      - darwin
      - windows
      - amd64
