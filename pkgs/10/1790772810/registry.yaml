name: evilmartians/lefthook
type: github_release
repo_owner: evilmartians
repo_name: lefthook
repo_id: 169250119
description: Fast and powerful Git hooks manager for any type of projects
github_artifact_attestations:
    signer_workflow: evilmartians/lefthook/.github/workflows/release.yml
version_overrides:
    - version_constraint: Version == "v0.1.5"
      no_asset: true
    - version_constraint: Version == "v0.2.0"
      files:
        - name: hookah
    - version_constraint: Version == "v0.5.3"
    - version_constraint: Version == "v0.6.3"
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
      overrides:
        - goos: windows
          files:
            - name: lefthook
    - version_constraint: Version == "v0.7.3"
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
      overrides:
        - goos: windows
          files:
            - name: lefthook
    - version_constraint: semver("> 2.0.4")
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
      github_artifact_attestations:
        signer_workflow: evilmartians/lefthook/.github/workflows/release.yml
    - version_constraint: semver("> 1.10.1")
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
    - version_constraint: semver("> 1.6.18")
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
    - version_constraint: semver("> 1.5.1")
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
    - version_constraint: semver("> 0.7.7")
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
    - version_constraint: semver("> 0.7.2")
    - version_constraint: semver("> 0.5.2")
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
      overrides:
        - goos: windows
          files:
            - name: lefthook
    - version_constraint: semver("> 0.2.3")
    - version_constraint: semver("<= 0.2.3")
      files:
        - name: hookah
    - version_constraint: "true"
      files:
        - name: lefthook
          src: lefthook_{{trimV .Version}}_{{.OS}}_{{.Arch}}
      github_artifact_attestations:
        signer_workflow: evilmartians/lefthook/.github/workflows/release.yml
