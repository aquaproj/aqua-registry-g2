name: suzuki-shunsuke/tfcmt
type: github_release
repo_owner: suzuki-shunsuke
repo_name: tfcmt
repo_id: 326347277
description: tfcmt enhances mercari/tfnotify in many ways, including Terraform >=
  v0.15 support and advanced formatting options
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 4.14.19")
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver(">= 4.14.0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("> 4.0.0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: semver("> 3.2.4")
  - version_constraint: semver("> 1.0.0-0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.2.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 0.2.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
