name: Mattbusel/tft-synapse
type: github_release
repo_owner: Mattbusel
repo_name: tft-synapse
repo_id: 1095249938
description: Free TFT helper. Tells you when to save, level or roll
files:
  - name: tft-synapse
version_overrides:
  - version_constraint: semver("> 0.5.0")
    files:
      - name: tft-synapse
        src: '{{.AssetWithoutExt}}/tft-synapse'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.5.0")
    supported_envs:
      - windows/amd64
  - version_constraint: "true"
    files:
      - name: tft-synapse
        src: '{{.AssetWithoutExt}}/tft-synapse'
    supported_envs:
      - darwin
      - windows
      - amd64
asset_rules:
  - envs:
      - windows/amd64
    filter: Asset matches "^tft-synapse([.].+)?$"
