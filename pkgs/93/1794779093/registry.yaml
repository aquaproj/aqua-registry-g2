name: nao1215/sqly
type: github_release
repo_owner: nao1215
repo_name: sqly
repo_id: 559441860
description: easily execute SQL against CSV/TSV/LTSV/JSON and Microsoft Excel with
  shell
github_artifact_attestations:
  signer_workflow: nao1215/sqly/.github/workflows/release.yml
version_overrides:
  - version_constraint: Version == "v0.0.4"
  - version_constraint: Version == "v0.8.0"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.24.0")
    github_artifact_attestations:
      signer_workflow: nao1215/sqly/.github/workflows/release.yml
  - version_constraint: semver("> 0.7.0")
  - version_constraint: semver("> 0.5.2")
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 0.5.2")
    supported_envs:
      - linux/amd64
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: nao1215/sqly/.github/workflows/release.yml
