name: simeji/jid
type: github_release
repo_owner: simeji
repo_name: jid
repo_id: 60534669
description: json incremental digger
# Before 0.7.3 the only Linux ARM build is 32-bit (jid_linux_arm.zip), which can't be
# linux/arm64's. From 0.7.3 it is jid_linux_arm64.zip, which this doesn't match.
all_assets_filter: not (Asset contains "_arm.")
version_overrides:
  # Before 0.7.3 each zip holds the executable under the asset's own name, jid_linux_amd64
  # and so on.
  - version_constraint: semver("< 0.7.3")
    files:
      - name: jid
        src: '{{.AssetWithoutExt}}'
  - version_constraint: "true"
