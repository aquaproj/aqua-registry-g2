name: Genymobile/scrcpy
type: github_release
repo_owner: Genymobile
repo_name: scrcpy
repo_id: 111583593
description: Display and control your Android device
version_overrides:
    - version_constraint: Version == "v1.5-fixversion"
      files:
        - name: scrcpy
          src: scrcpy-{{.OS}}/scrcpy
    - version_constraint: Version == "v3.0"
      files:
        - name: scrcpy
          src: '{{.AssetWithoutExt}}/scrcpy'
    - version_constraint: semver("> 2.7.0")
      files:
        - name: scrcpy
          src: '{{.AssetWithoutExt}}/scrcpy'
      overrides:
        - goos: windows
          files:
            - name: scrcpy
              src: '{{.AssetWithoutExt}}/scrcpy'
    - version_constraint: semver("> 1.1.0")
      files:
        - name: scrcpy
          src: '{{.AssetWithoutExt}}/scrcpy'
    - version_constraint: semver("<= 1.1.0")
      files:
        - name: scrcpy
          src: scrcpy-windows-{{.Version}}/scrcpy
    - version_constraint: "true"
      files:
        - name: scrcpy
          src: '{{.AssetWithoutExt}}/scrcpy'
      overrides:
        - goos: windows
          files:
            - name: scrcpy
              src: '{{.AssetWithoutExt}}/scrcpy'
# Every release that publishes the 32-bit Windows build publishes the 64-bit one beside it,
# and the parser reads both as windows/amd64.
all_assets_filter: not (Asset contains "win32")
# v3.0 is written by hand, for Windows alone. Its Linux and macOS assets are tar archives
# named .tar.gz, and aqua tells an archive's format from its name and contents rather
# than from the format an entry declares, so it can't unpack them whatever the entry
# says. Generating v3.0 again would put them back.
