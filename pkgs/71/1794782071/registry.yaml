name: psastras/sarif-rs/hadolint-sarif
type: github_release
repo_owner: psastras
repo_name: sarif-rs
repo_id: 347270006
description: Convert hadolint warnings into SARIF
version_filter: not (Version matches "-latest$")
version_prefix: hadolint-sarif-
version_overrides:
  - version_constraint: Version == "hadolint-sarif-v0.2.23"
    files:
      - name: hadolint-sarif
        src: target/release/{{.FileName}}-{{.Arch}}-{{.OS}}
    supported_envs:
      - linux/amd64
  - version_constraint: Version in ["hadolint-sarif-v0.2.24", "hadolint-sarif-v0.6.2"]
    supported_envs:
      - linux/amd64
  - version_constraint: semver("> 0.4.2")
    supported_envs:
      - linux/amd64
      - darwin/arm64
  - version_constraint: semver("<= 0.4.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin/arm64
all_assets_filter: Asset matches "^hadolint-sarif-.+-.+[.].+([.].+)?$" or Asset matches
  "^hadolint-sarif-.+-.+([.].+)?$" or Asset endsWith ".intoto.jsonl"
