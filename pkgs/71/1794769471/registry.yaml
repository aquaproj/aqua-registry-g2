name: openai/tunnel-client
type: github_release
repo_owner: openai
repo_name: tunnel-client
repo_id: 1113421659
description: 'Customer-run client for Secure MCP Tunnel: connect private or localhost
  MCP servers to ChatGPT, Codex, the Responses API, and AgentKit without exposing
  them to the public internet'
version_overrides:
  - version_constraint: Version == "v0.0.6--context-conduit-saphire"
    no_asset: true
  - version_constraint: semver("> 0.0.13")
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/openai/tunnel-client/.github/workflows/release.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
      bundle:
        type: github_release
        asset: tunnel-client-{{.Version}}-provenance.sigstore.json
  - version_constraint: semver("<= 0.0.13")
  - version_constraint: "true"
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/openai/tunnel-client/.github/workflows/release.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
      bundle:
        type: github_release
        asset: tunnel-client-{{.Version}}-provenance.sigstore.json
