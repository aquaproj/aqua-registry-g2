name: AvitalTamir/cyphernetes
type: github_release
repo_owner: AvitalTamir
repo_name: cyphernetes
repo_id: 718213959
description: A Kubernetes Query Language
version_overrides:
  - version_constraint: Version == "v0.2"
    supported_envs:
      - linux/amd64
  - version_constraint: semver("> 0.12.1")
  - version_constraint: semver("> 0.10.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.8.1")
    supported_envs:
      - darwin/arm64
  - version_constraint: semver("> 0.6.4-fix.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.1")
    supported_envs:
      - linux/amd64
      - darwin/arm64
  - version_constraint: semver("<= 0.1")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
all_assets_filter: 'not (Asset startsWith "kubectl-cypher-")'
