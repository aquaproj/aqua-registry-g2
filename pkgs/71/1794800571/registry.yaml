name: aquaproj/ar2
type: github_release
repo_owner: aquaproj
repo_name: ar2
repo_id: 1378943882
description: CLI for aqua registry g2
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 0.5.1")
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("<= 0.5.1")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
