name: becheran/mlc
type: github_release
repo_owner: becheran
repo_name: mlc
repo_id: 230644388
description: Check for broken links in markup files
version_overrides:
  - version_constraint: Version in ["v0.13.2", "v0.13.10", "v0.15.1"]
    no_asset: true
  - version_constraint: semver("> 1.0.0")
    supported_envs:
      - darwin/arm64
      - windows
      - linux
  - version_constraint: semver("> 0.15.4")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.14.3")
    files:
      - name: mlc
        src: builds/becheran/mlc_ci/target/{{.Arch}}-{{.OS}}/release/mlc
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 0.13.5")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.13.5")
    supported_envs:
      - linux/amd64
  - version_constraint: "true"
    supported_envs:
      - darwin/arm64
      - windows
      - linux
asset_rules:
  - envs:
      - linux/amd64
    filter: Asset matches "^mlc([.].+)?$"
