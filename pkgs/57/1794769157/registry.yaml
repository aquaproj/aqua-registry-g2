name: inlets/inletsctl
type: github_release
repo_owner: inlets
repo_name: inletsctl
repo_id: 218249412
description: Create inlets servers on the top cloud platforms
overrides:
  - goos: darwin
    files:
      - name: inletsctl
        src: inletsctl-darwin
  - goarch: arm64
    files:
      - name: inletsctl
        src: inletsctl-arm64
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - windows/amd64
      - windows/arm64
    filter: Asset matches "^inletsctl[.]tgz([.].+)?$"
