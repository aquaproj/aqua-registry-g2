name: inlets/inletsctl
type: github_release
repo_owner: inlets
repo_name: inletsctl
repo_id: 218249412
description: Create inlets servers on the top cloud platforms
overrides:
  # The darwin/arm64 archive holds inletsctl-darwin-arm64, which the darwin entry below
  # would otherwise name inletsctl-darwin.
  - goos: darwin
    goarch: arm64
    files:
      - name: inletsctl
        src: inletsctl-darwin-arm64
  - goos: darwin
    files:
      - name: inletsctl
        src: inletsctl-darwin
  - goarch: arm64
    files:
      - name: inletsctl
        src: inletsctl-arm64
# Only the macOS archives name their OS. inletsctl.tgz holds the linux/amd64 executable alone,
# inletsctl-arm64.tgz the linux/arm64 one, and inletsctl.exe.tgz the Windows one.
asset_rules:
  - envs:
      - linux/amd64
    filter: Asset == "inletsctl.tgz"
  - envs:
      - linux/arm64
    filter: Asset == "inletsctl-arm64.tgz"
  - envs:
      - windows/amd64
      - windows/arm64
    filter: Asset == "inletsctl.exe.tgz"
