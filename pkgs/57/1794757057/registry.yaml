name: kubesphere/kubeeye
type: github_release
repo_owner: kubesphere
repo_name: kubeeye
repo_id: 310904702
description: KubeEye aims to find various problems on Kubernetes, such as application
  misconfiguration, unhealthy cluster components and node problems
files:
  - name: kubeeye
    src: ke
supported_envs:
  - linux
version_overrides:
  - version_constraint: semver("< 1.0.0")
  - version_constraint: semver(">= 1.0.0")
    error_message: |
      kubeeye isn't released pre-built binaries anymore.
  - version_constraint: "true"
