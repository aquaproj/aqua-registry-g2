name: hirosassa/ksnotify
type: github_release
repo_owner: hirosassa
repo_name: ksnotify
repo_id: 404486375
description: A CLI command to parse kubectl diff result and notify it to GitLab/GitHub
version_overrides:
  - version_constraint: Version == "v3.2.0"
    no_asset: true
  - version_constraint: semver(">= 3.2.0")
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: semver("> 1.2.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.2.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - darwin
      - linux/amd64
