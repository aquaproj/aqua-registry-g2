name: int128/kubectl-external-forward
type: github_release
repo_owner: int128
repo_name: kubectl-external-forward
repo_id: 341565421
description: kubectl plugin to connect to external host via Envoy Proxy in Kubernetes
  cluster
files:
  - name: kubectl-external_forward
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  # Up to v0.3.0 the plugin was kubectl-socat, and the archive holds it under that name.
  - version_constraint: semver("<= 0.3.0")
    files:
      - name: kubectl-socat
  - version_constraint: "true"
