name: theurichde/go-aws-sso
type: github_release
repo_owner: theurichde
repo_name: go-aws-sso
repo_id: 404460360
description: Makes dealing with AWS SSO Logins an ease
version_overrides:
  - version_constraint: semver(">= 1.2.0-dev.1")
  - version_constraint: semver(">= 0.6.1")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver(">= 0.3.0")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: semver(">= 0.1.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("< 0.1.0")
    files:
      - name: go-aws-sso-util
    supported_envs:
      - linux
      - darwin
  - version_constraint: "true"
