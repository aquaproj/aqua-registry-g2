name: kubevela/kubevela/kubectl-plugin
aliases:
  - name: oam-dev/kubevela/kubectl-plugin
type: github_release
repo_owner: kubevela
repo_name: kubevela
repo_id: 276822250
description: The Modern Application Deployment System Based on OAM
files:
  - name: kubectl-vela
    src: '{{.OS}}-{{.Arch}}/kubectl-vela'
supported_envs:
  - darwin
  - linux
  - amd64
slsa_provenance:
  type: github_release
  asset: multiple.intoto.jsonl
version_overrides:
  - version_constraint: semver(">= 1.10.3")
  - version_constraint: semver(">= 1.2.0")
    slsa_provenance:
      enabled: false
  - version_constraint: "true"
    slsa_provenance:
      enabled: false
    supported_envs:
      - darwin
      - amd64
all_assets_filter: Asset matches "^kubectl-vela-.+-.+-.+[.]tar[.]gz([.].+)?$" or Asset matches "^multiple[.]intoto[.]jsonl([.].+)?$" or Asset endsWith ".intoto.jsonl"
