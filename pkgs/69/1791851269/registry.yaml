name: hashicorp/levant
type: http
repo_owner: hashicorp
repo_name: levant
repo_id: 102973506
description: An open source templating and deployment tool for HashiCorp Nomad jobs
url: https://releases.hashicorp.com/levant/{{trimV .Version}}/levant_{{trimV .Version}}_{{.OS}}_{{.Arch}}.zip
rosetta2: true
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  - version_constraint: semver(">= 0.3.0")
  # releases.hashicorp.com has nothing before 0.3.0; those are GitHub releases of bare
  # binaries named <os>-<arch>-levant.
  - version_constraint: semver("< 0.3.0")
    type: github_release
    asset: '{{.OS}}-{{.Arch}}-levant'
    format: raw
    supported_envs:
      - darwin
      - linux/amd64
