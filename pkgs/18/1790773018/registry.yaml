name: tstack/lnav
type: github_release
repo_owner: tstack
repo_name: lnav
description: Log file navigator
version_overrides:
    - version_constraint: Version == "v0.8.2-alpha"
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: Version == "v0.8.2"
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: Version == "v0.9.0"
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: Version == "v0.12.4"
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver(">= 0.14.0")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
      overrides:
        - goos: windows
          files:
            - name: lnav
              src: lnav-{{trimV .Version}}/bin/lnav
    - version_constraint: semver("> 0.12.3")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
      overrides:
        - goos: windows
          files:
            - name: lnav
              src: lnav-{{trimV .Version}}/bin/lnav
    - version_constraint: semver("> 0.12.0")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver("> 0.11.2")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver("> 0.11.1-test1")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver("> 0.11.0")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver("> 0.8.5")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver("> 0.8.3b")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: semver("> 0.8.1")
    - version_constraint: semver("<= 0.8.1")
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
    - version_constraint: "true"
      files:
        - name: lnav
          src: lnav-{{trimV .Version}}/lnav
      overrides:
        - goos: windows
          files:
            - name: lnav
              src: lnav-{{trimV .Version}}/bin/lnav
