name: bcicen/slackcat
type: github_release
repo_owner: bcicen
repo_name: slackcat
repo_id: 48814717
description: CLI utility to post files and command output to slack
version_overrides:
  - version_constraint: Version == "v1.0"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 1.6.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 1.6.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin
