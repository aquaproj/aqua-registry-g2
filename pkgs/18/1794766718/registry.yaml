name: ytdl-org/ytdl-nightly
type: github_release
repo_owner: ytdl-org
repo_name: ytdl-nightly
repo_id: 661290495
description: Nightly builds for youtube-dl
files:
  - name: youtube-dl
version_overrides:
  - version_constraint: Version == "2024.03.28"
    files:
      - name: youtube-dl
        src: youtube-dl/youtube-dl
    supported_envs:
      - linux
      - darwin
  - version_constraint: "true"
    files:
      - name: youtube-dl
        src: youtube-dl/youtube-dl
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
      - windows/arm64
    filter: Asset matches "^youtube-dl-.+[.].+([.].+)?$" or Asset matches "^youtube-dl([.].+)?$"
