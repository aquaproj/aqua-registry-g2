name: fastly/terrctl
type: github_release
repo_owner: fastly
repo_name: terrctl
repo_id: 166491654
description: A command-line client for Fastly Terrarium. https://wasm.fastlylabs.com
overrides:
  - goos: darwin
    goarch: amd64
    files:
      - name: terrctl
        src: '{{.OS}}/terrctl'
  - goos: windows
    format: zip
    files:
      - name: terrctl
        src: '{{.OS}}/terrctl.exe'
files:
  - name: terrctl
    src: '{{.OS}}-{{.Arch}}/terrctl'
supported_envs:
  - darwin
  - linux
  - amd64
