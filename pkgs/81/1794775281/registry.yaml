name: sourcemeta/jsonschema
type: github_release
repo_owner: sourcemeta
repo_name: jsonschema
repo_id: 802599802
description: The CLI for working with JSON Schema. Covers formatting, linting, testing,
  bundling, and more for both local development and CI/CD pipelines
version_overrides:
  - version_constraint: Version == "continuous"
    error_message: The version 'continuous' is not supported. Please use a specific
      version.
  - version_constraint: semver("> 7.2.2")
    files:
      - name: jsonschema
        src: '{{.AssetWithoutExt}}/bin/jsonschema'
  - version_constraint: semver("> 0.4.1")
    files:
      - name: jsonschema
        src: '{{.AssetWithoutExt}}/bin/jsonschema'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.4.1")
    files:
      - name: jsonschema
        src: '{{.AssetWithoutExt}}/bin/jsonschema'
    supported_envs:
      - linux/amd64
      - darwin/arm64
      - windows
  - version_constraint: "true"
    files:
      - name: jsonschema
        src: '{{.AssetWithoutExt}}/bin/jsonschema'
