name: jdx/hk
type: github_release
repo_owner: jdx
repo_name: hk
repo_id: 922514152
description: git hook and pre-commit lint manager
packslip:
  identity_prefix: https://github.com/jdx/hk/
  issuer: https://token.actions.githubusercontent.com
version_overrides:
  - version_constraint: semver(">= 1.11.0")
  - version_constraint: semver("> 0.1.9")
  - version_constraint: semver("> 0.1.3")
  - version_constraint: semver("<= 0.1.3")
    no_asset: true
  - version_constraint: "true"
