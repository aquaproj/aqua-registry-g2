name: rui314/mold
type: github_release
repo_owner: rui314
repo_name: mold
repo_id: 299510783
description: 'mold: A Modern Linker'
version_overrides:
    - version_constraint: Version == "v1.6.0-pre.1"
      no_asset: true
    - version_constraint: semver("> 2.40.2")
      files:
        - name: mold
          src: bin/mold
        - name: ld.mold
          src: bin/mold
        - name: ld64.mold
          src: bin/mold
      overrides:
        - goos: linux
          files:
            - name: mold
              src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
            - name: ld.mold
              src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
            - name: ld64.mold
              src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
    - version_constraint: semver("> 1.0.3")
      files:
        - name: mold
          src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
        - name: ld.mold
          src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
        - name: ld64.mold
          src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
    - version_constraint: semver("<= 1.0.3")
      no_asset: true
    - version_constraint: "true"
      files:
        - name: mold
          src: bin/mold
        - name: ld.mold
          src: bin/mold
        - name: ld64.mold
          src: bin/mold
      overrides:
        - goos: linux
          files:
            - name: mold
              src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
            - name: ld.mold
              src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
            - name: ld64.mold
              src: mold-{{trimV .Version}}-{{.Arch}}-{{.OS}}/bin/mold
