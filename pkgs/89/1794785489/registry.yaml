name: nika-open/nika
aliases:
  - name: supernovae-st/nika
type: github_release
repo_owner: nika-open
repo_name: nika
repo_id: 1126625946
description: Workflow language and runner for AI jobs - one .nika.yaml file, statically
  checked before any token is spent, hash-chained run traces
github_artifact_attestations:
  signer_workflow: supernovae-st/nika/.github/workflows/release.yml
version_overrides:
  # From v0.124.5 the release is built after the repository moved to nika-open/nika, and
  # its attestations are signed by that repository's workflow.
  - version_constraint: semver(">= 0.124.5")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
      source_tag: '-'
    github_artifact_attestations:
      signer_workflow: nika-open/nika/.github/workflows/release.yml
    supported_envs:
      - linux
      - darwin
  # Built before the repository moved from supernovae-st/nika, so the provenance names the
  # old repository as its source.
  - version_constraint: semver("> 0.105.0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
      source_tag: '-'
      source_uri: github.com/supernovae-st/nika
    github_artifact_attestations:
      signer_workflow: supernovae-st/nika/.github/workflows/release.yml
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.104.0")
    github_artifact_attestations:
      signer_workflow: supernovae-st/nika/.github/workflows/release.yml
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.80.0-alpha.4")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 0.80.0-alpha.4")
    no_asset: true
  - version_constraint: "true"
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
      source_tag: '-'
      source_uri: github.com/supernovae-st/nika
    github_artifact_attestations:
      signer_workflow: supernovae-st/nika/.github/workflows/release.yml
    supported_envs:
      - linux
      - darwin
