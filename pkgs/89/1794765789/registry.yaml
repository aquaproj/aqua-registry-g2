name: mistakenelf/fm
aliases:
  - name: knipferrc/fm
type: github_release
repo_owner: mistakenelf
repo_name: fm
repo_id: 356883757
description: A terminal based file manager
version_overrides:
  - version_constraint: Version == "v1.2.0"
    no_asset: true
  - version_constraint: semver("> 0.9.0")
  - version_constraint: semver("> 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.4.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: "true"
