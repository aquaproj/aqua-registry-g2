name: emanuele-em/proxelar
type: github_release
repo_owner: emanuele-em
repo_name: proxelar
repo_id: 591022890
description: Scriptable local traffic workbench for inspecting, intercepting, replaying,
  and rewriting HTTP/HTTPS and WebSocket traffic
version_overrides:
  - version_constraint: semver("> 0.1.6")
  - version_constraint: semver("<= 0.1.6")
    no_asset: true
  - version_constraint: "true"
# v0.4.6 also publishes x86_64-pc-windows-msvc-cmodules.zip, which tied with the windows zip.
asset_filters:
  - version_constraint: Version == "v0.4.6"
    all_assets_filter: not (Asset contains "cmodules")
