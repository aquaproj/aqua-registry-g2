name: LucasPickering/slumber
type: github_release
repo_owner: LucasPickering
repo_name: slumber
repo_id: 684277349
description: Terminal-based HTTP/REST client
version_overrides:
  - version_constraint: semver("> 1.0.0")
    files:
      - name: slumber
        src: '{{.AssetWithoutExt}}/slumber'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: slumber
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.0.0")
    files:
      - name: slumber
        src: '{{.AssetWithoutExt}}/slumber'
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    files:
      - name: slumber
        src: '{{.AssetWithoutExt}}/slumber'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: slumber
    supported_envs:
      - darwin
      - windows
      - amd64
