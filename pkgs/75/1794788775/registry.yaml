name: PSU3D0/agent-spreadsheet
type: github_release
repo_owner: PSU3D0
repo_name: agent-spreadsheet
repo_id: 1059818445
description: MCP server for spreadsheet analysis and editing. Slim, token-efficient
  tool surface designed for LLM agents
version_overrides:
  - version_constraint: Version == "v0.10.1"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: Version == "v0.11.1"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: Version == "v0.12.0"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.10.0")
    files:
      - name: agent-spreadsheet
      - name: asp
  - version_constraint: semver("> 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: agent-spreadsheet
      - name: asp
