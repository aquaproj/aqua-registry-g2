name: itamae-kitchen/mitamae
type: github_release
repo_owner: itamae-kitchen
repo_name: mitamae
repo_id: 65066008
description: mitamae is a fast, simple, and single-binary configuration management
  tool with a DSL like Chef
files:
  - name: mitamae
    src: mitamae-{{.Arch}}-{{.OS}}
version_overrides:
  - version_constraint: Version == "v0.11.2"
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver(">= 1.14.4")
    github_artifact_attestations:
      signer_workflow: itamae-kitchen/mitamae/.github/workflows/build.yml
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 1.11.1")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.3.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 0.0.4")
    files:
      - name: itamae
        src: itamae-{{.Arch}}-{{.OS}}
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.0.4")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: itamae-kitchen/mitamae/.github/workflows/build.yml
    supported_envs:
      - linux
      - darwin
