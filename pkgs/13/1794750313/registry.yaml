name: jdx/pitchfork
aliases:
  - name: endevco/pitchfork
type: github_release
repo_owner: jdx
repo_name: pitchfork
repo_id: 899500793
description: Daemons with DX
packslip:
  identity_prefix: https://github.com/jdx/pitchfork/
  issuer: https://token.actions.githubusercontent.com
version_overrides:
  - version_constraint: Version == "v0.1.1"
    no_asset: true
  - version_constraint: semver("> 0.1.3")
    supported_envs:
      - linux
      - darwin/arm64
      - windows
  - version_constraint: semver("<= 0.1.3")
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin/arm64
      - windows
