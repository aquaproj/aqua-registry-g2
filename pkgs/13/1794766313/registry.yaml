name: sonatype-nexus-community/nancy
type: github_release
repo_owner: sonatype-nexus-community
repo_name: nancy
repo_id: 168600026
description: A tool to check for vulnerabilities in your Golang dependencies, powered
  by Sonatype OSS Index
version_overrides:
  - version_constraint: semver("> 1.0.17")
  - version_constraint: semver("> 0.0.44")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.0.44")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
