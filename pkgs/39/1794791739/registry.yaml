name: suzuki-shunsuke/ghaperf
type: github_release
repo_owner: suzuki-shunsuke
repo_name: ghaperf
repo_id: 1083410502
description: ghaperf is a CLI to analyze the performance of GitHub Actions using GitHub
  API and raw job logs
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
version_overrides:
  - version_constraint: semver("> 1.0.1")
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: semver("> 0.1.1")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: semver("<= 0.1.1")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin/arm64
