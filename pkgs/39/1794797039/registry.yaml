name: suzuki-shunsuke/docfresh
type: github_release
repo_owner: suzuki-shunsuke
repo_name: docfresh
repo_id: 1165344077
description: Make document maintainable, reusable, and testable
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 0.3.1")
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("> 0.2.0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("<= 0.2.0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
