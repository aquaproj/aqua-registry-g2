name: goshs-labs/goshs
type: github_release
repo_owner: goshs-labs
repo_name: goshs
repo_id: 300549409
description: Feature-rich single-binary file server for red teamers and developers.  HTTP/S
  · WebDAV · FTP/SFTP · SMB · LDAP/S · NTLM hash capture · DNS/SMTP callbacks ·  TLS
  · Auth · Share links. A powerful python3 -m http.server replacement
version_overrides:
  - version_constraint: semver("> 0.0.6")
  - version_constraint: semver("> 0.0.3")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.0.3")
    no_asset: true
  - version_constraint: "true"
