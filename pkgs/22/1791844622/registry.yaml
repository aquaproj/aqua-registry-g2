name: hhatto/gocloc
type: github_release
repo_owner: hhatto
repo_name: gocloc
repo_id: 55236570
description: A little fast cloc(Count Lines Of Code)
version_overrides:
  - version_constraint: Version == "v0.4.6"
    no_asset: true
  - version_constraint: semver("> 0.4.2")
  - version_constraint: semver("> 0.3.3")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.3.1")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.3.1")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
