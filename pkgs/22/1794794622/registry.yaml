name: suzuki-shunsuke/ci-info
type: github_release
repo_owner: suzuki-shunsuke
repo_name: ci-info
repo_id: 307023914
description: CLI tool to get CI related information
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: Version == "v2.1.1"
  - version_constraint: semver("> 2.4.3")
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
  - version_constraint: semver("> 2.1.0")
    slsa_provenance:
      type: github_release
      asset: multiple.intoto.jsonl
  - version_constraint: semver("<= 2.1.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
