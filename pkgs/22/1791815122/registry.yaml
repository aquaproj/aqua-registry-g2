name: regclient/regclient/regctl
type: github_release
repo_owner: regclient
repo_name: regclient
repo_id: 294181202
description: Docker and OCI Registry Client
files:
  - name: regctl
supported_envs:
  - darwin
  - linux
  - amd64
cosign:
  opts:
    - --certificate-identity
    - https://github.com/regclient/regclient/.github/workflows/go.yml@refs/tags/{{.Version}}
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
  bundle:
    type: github_release
    asset: '{{.Asset}}.sigstore.json'
version_overrides:
  - version_constraint: semver(">= 0.11.6")
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/regclient/regclient/.github/workflows/go.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
      bundle:
        type: github_release
        asset: regctl-{{.OS}}-{{.Arch}}.sigstore.json
  - version_constraint: semver(">= 0.3.9")
  - version_constraint: semver("< 0.3.9")
  - version_constraint: "true"
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/regclient/regclient/.github/workflows/go.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
      bundle:
        type: github_release
        asset: regctl-{{.OS}}-{{.Arch}}.sigstore.json
all_assets_filter: Asset matches "^regctl-.+-.+([.].+)?$" or Asset matches "^regctl-.+-.+[.]sigstore[.]json([.].+)?$" or Asset endsWith ".intoto.jsonl"
