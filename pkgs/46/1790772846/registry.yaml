name: gohugoio/hugo/hugo-extended
type: github_release
repo_owner: gohugoio
repo_name: hugo
repo_id: 11180687
description: The world’s fastest framework for building websites
files:
  - name: hugo
version_overrides:
  - version_constraint: Version == "v0.139.5"
    no_asset: true
  - version_constraint: Version == "v0.88.0"
  - version_constraint: Version == "v0.88.1"
  - version_constraint: Version == "v0.89.0"
  - version_constraint: semver("> 0.152.2")
    overrides:
      - goos: darwin
        files:
          - name: hugo
            src: Payload/hugo
  - version_constraint: semver("> 0.102.3")
  - version_constraint: semver("> 0.101.0")
  - version_constraint: semver("> 0.80.0")
  - version_constraint: semver("<= 0.80.0")
  - version_constraint: "true"
    overrides:
      - goos: darwin
        files:
          - name: hugo
            src: Payload/hugo
# hugo_extended_withdeploy_* is another build, with the deploy command, and ties with it.
all_assets_filter: ((Asset matches "extended") and not (Asset contains "withdeploy")) or (Asset matches "checksum")
# From v0.103.0 the Linux amd64 build is published twice, as _Linux-64bit and _linux-amd64.
asset_filters:
  - version_constraint: semver(">= 0.103.0")
    all_assets_filter: ((Asset matches "extended") and not (Asset contains "withdeploy") and not (Asset contains "_Linux-64bit")) or (Asset matches "checksum")
