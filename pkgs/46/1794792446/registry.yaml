name: Songmu/podbard
type: github_release
repo_owner: Songmu
repo_name: podbard
repo_id: 850329368
version_overrides:
  - version_constraint: semver("> 0.0.2")
    files:
      - name: podbard
        src: podbard_{{.Version}}_{{.OS}}_{{.Arch}}/podbard
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 0.0.2")
    files:
      - name: primcast
        src: primcast_{{.Version}}_{{.OS}}_{{.Arch}}/primcast
    supported_envs:
      - linux
      - darwin
  - version_constraint: "true"
    files:
      - name: podbard
        src: podbard_{{.Version}}_{{.OS}}_{{.Arch}}/podbard
    supported_envs:
      - linux
      - darwin
