name: kubecfg/kubecfg
type: github_release
repo_owner: kubecfg
repo_name: kubecfg
repo_id: 429002685
description: A tool for managing complex enterprise Kubernetes environments as code
version_overrides:
  - version_constraint: semver("> 0.34.3")
    supported_envs:
      - linux/amd64
      - darwin/arm64
  - version_constraint: semver("<= 0.34.3")
