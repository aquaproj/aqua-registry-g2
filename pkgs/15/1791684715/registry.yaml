name: mergestat/mergestat-lite
type: github_release
repo_owner: mergestat
repo_name: mergestat-lite
repo_id: 276976140
description: Query git repositories with SQL. Generate reports, perform status checks, analyze codebases
files:
  - name: mergestat
# Before 0.5.0 the command was askgit, from before the project was renamed. v0.1.0's
# archive holds one executable named after the asset.
version_overrides:
  - version_constraint: semver(">= 0.5.0")
  - version_constraint: Version == "v0.1.0"
    files:
      - name: askgit
        src: '{{.AssetWithoutExt}}'
  - version_constraint: semver("< 0.5.0")
    files:
      - name: askgit
