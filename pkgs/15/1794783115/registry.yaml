    src: sshproxy_{{trimV .Version}}_{{.OS}}_{{.Arch}}/sshproxy-replay
  - name: sshproxyctl
    src: sshproxy_{{trimV .Version}}_{{.OS}}_{{.Arch}}/sshproxyctl
supported_envs:
  - linux/amd64
