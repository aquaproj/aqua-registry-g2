name: ikanago/omekasy
type: github_release
repo_owner: ikanago
repo_name: omekasy
repo_id: 482810633
description: Command line application that converts alphanumeric characters to various
  styles defined in Unicode
files:
  - name: omekasy
    src: archive/omekasy
supported_envs:
  - darwin
  - amd64
version_overrides:
  - version_constraint: semver(">= 0.2.0")
  - version_constraint: semver("< 0.2.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
