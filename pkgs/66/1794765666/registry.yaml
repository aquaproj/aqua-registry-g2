name: anthropics/anthropic-cli
type: github_release
repo_owner: anthropics
repo_name: anthropic-cli
repo_id: 1140226073
description: The CLI for the Claude API
# The repository also releases sandboxes, tagged sandboxes-v<version>.
version_filter: Version startsWith "v"
files:
  - name: ant
version_overrides:
  - version_constraint: Version == "v1.3.0"
    no_asset: true
  - version_constraint: "true"
all_assets_filter: not ((Asset matches ".apk$") or (Asset matches ".deb$") or (Asset
  matches ".rpm$") or (Asset matches ".pkg.tar.zst$"))
