name: hadolint/hadolint
type: github_release
repo_owner: hadolint
repo_name: hadolint
repo_id: 46234189
description: Dockerfile linter, validate inline bash, written in Haskell
github_artifact_attestations:
    signer_workflow: hadolint/hadolint/.github/workflows/release.yml
version_overrides:
    - version_constraint: Version == "v1.0"
      no_asset: true
    - version_constraint: Version == "v2.7.0"
    - version_constraint: Version == "v2.10.0"
    - version_constraint: semver("> 2.14.0")
      github_artifact_attestations:
        signer_workflow: hadolint/hadolint/.github/workflows/release.yml
    - version_constraint: semver("> 2.12.1-beta")
    - version_constraint: semver("> 2.9.3")
    - version_constraint: semver("> 1.2.2")
    - version_constraint: semver("<= 1.2.2")
    - version_constraint: "true"
      github_artifact_attestations:
        signer_workflow: hadolint/hadolint/.github/workflows/release.yml
