name: greymd/teip
type: github_release
repo_owner: greymd
repo_name: teip
repo_id: 268647751
# The only Windows asset a release has ever carried is teip_installer-<version>-x86_64-pc-windows-msvc.exe,
# an Inno Setup installer with a GUI rather than teip itself, so nothing can be installed for Windows.
description: Masking tape to help commands "do one thing well"
version_overrides:
  - version_constraint: Version == "v2.3.1"
    files:
      - name: teip
        src: bin/teip
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: semver("> 2.1.0")
    files:
      - name: teip
        src: bin/teip
    supported_envs:
      - darwin
      - linux
  - version_constraint: semver("> 1.2.0")
    files:
      - name: teip
        src: bin/teip
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: semver("<= 1.2.0")
    files:
      - name: teip
        src: bin/teip
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    files:
      - name: teip
        src: bin/teip
    supported_envs:
      - darwin
      - linux
