name: adhocteam/ssm
type: github_release
repo_owner: adhocteam
repo_name: ssm
repo_id: 193833136
description: AWS SSM Parameter Store CLI
version_overrides:
  - version_constraint: Version == "v0.3.0"
    no_asset: true
  - version_constraint: semver("> 1.1.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 1.1.0")
    supported_envs:
      - linux/amd64
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin
