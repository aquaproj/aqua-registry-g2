name: glsec/glsec
type: github_release
repo_owner: glsec
repo_name: glsec
repo_id: 1238611883
description: Static security scanner and linter for GitLab CI. Finds .gitlab-ci.yml
  misconfigurations, supply-chain risks, and leaked secrets. Offline, SARIF output,
  OWASP CICD-SEC and CWE mappings
github_artifact_attestations:
  signer_workflow: glsec/glsec/.github/workflows/build-release.yml
version_overrides:
  - version_constraint: semver("> 1.20.0")
    github_artifact_attestations:
      signer_workflow: glsec/glsec/.github/workflows/build-release.yml
  - version_constraint: semver("> 1.10.0")
    github_artifact_attestations:
      signer_workflow: glsec/glsec/.github/workflows/release.yml
  - version_constraint: semver("<= 1.10.0")
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: glsec/glsec/.github/workflows/build-release.yml
