name: protocolbuffers/protobuf/protoc
type: github_release
repo_owner: protocolbuffers
repo_name: protobuf
repo_id: 23357588
description: Protocol Buffers - Google's data interchange format
files:
  - name: protoc
    src: bin/protoc
replacements:
  arm64: aarch_64
supported_envs:
  - darwin
  - linux
  - amd64
# Each release publishes a 32-bit Windows build, win32, beside the 64-bit one, win64, and
# without this the 32-bit one was picked for windows/amd64.
all_assets_filter: not (Asset contains "win32")
