name: pgplex/pgschema
type: github_release
repo_owner: pgplex
repo_name: pgschema
repo_id: 998434422
description: Terraform-style, declarative schema migration CLI for Postgres. Agent friendly
version_overrides:
  - version_constraint: semver("> 1.5.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 1.2.1")
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: semver("<= 1.2.1")
    supported_envs:
      - linux/amd64
      - darwin/arm64
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
