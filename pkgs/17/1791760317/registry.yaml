name: sassman/t-rec-rs
type: github_release
repo_owner: sassman
repo_name: t-rec-rs
repo_id: 302482658
description: Blazingly fast terminal recorder that generates animated gif images for the web written in rust
files:
  - name: t-rec
version_overrides:
  - version_constraint: Version == "v0.7.0"
    supported_envs:
      - darwin
  - version_constraint: Version == "v0.7.1"
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: Version == "v0.7.2"
    supported_envs:
      - linux/amd64
  - version_constraint: semver("> 0.6.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.6.2")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin
