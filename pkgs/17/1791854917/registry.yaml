name: yinheli/sshw
type: github_release
repo_owner: yinheli
repo_name: sshw
repo_id: 141798856
description: ssh client wrapper for automatic login
version_overrides:
  - version_constraint: semver(">= 1.1.1")
  - version_constraint: semver(">= 1.0.8")
    files:
      - name: sshw
        src: sshw-{{.OS}}-{{.Arch}}-{{.Version}}/sshw
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: "true"
    supported_envs:
      - darwin
      - linux/amd64
