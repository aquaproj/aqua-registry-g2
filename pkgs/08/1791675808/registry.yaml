name: ip7z/7zip
type: github_release
repo_owner: ip7z
repo_name: 7zip
repo_id: 466446150
description: 7-Zip is a file archiver with a high compression ratio
files:
  - name: 7zzs
  - name: 7zz
  - name: 7za
version_overrides:
