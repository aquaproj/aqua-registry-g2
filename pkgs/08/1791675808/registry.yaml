    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: windows
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
  - version_constraint: Version == "23.01"
    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: darwin
        files:
          - name: 7zz
      - goos: windows
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
  - version_constraint: Version in ["24.05", "24.06"]
    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: darwin
        files:
          - name: 7zz
      - goos: windows
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
  - version_constraint: "true"
    overrides:
      - goos: linux
        files:
