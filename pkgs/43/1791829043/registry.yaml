name: sigstore/gitsign
type: github_release
repo_owner: sigstore
repo_name: gitsign
repo_id: 491573171
description: Keyless Git signing using Sigstore
cosign:
  opts:
    - --certificate-identity
    - https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/{{.Version}}
    - --certificate-oidc-issuer
    - https://token.actions.githubusercontent.com
    - --certificate-github-workflow-repository
    - sigstore/gitsign
    - --certificate-github-workflow-ref
    - refs/tags/{{.Version}}
  bundle:
    type: github_release
    asset: '{{.Asset}}.bundle'
version_overrides:
  - version_constraint: Version == "v0.15.0"
    no_asset: true
  - version_constraint: semver("> 0.14.0")
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - sigstore/gitsign
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: '{{.Asset}}.bundle'
  - version_constraint: semver("> 0.0.1-alpha")
    cosign:
      opts:
        - --certificate
        - https://github.com/sigstore/gitsign/releases/download/{{.Version}}/{{.Asset}}.pem
        - --certificate-identity
        - https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --signature
        - https://github.com/sigstore/gitsign/releases/download/{{.Version}}/{{.Asset}}.sig
        - --certificate-github-workflow-repository
        - sigstore/gitsign
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
  - version_constraint: semver("<= 0.0.1-alpha")
    no_asset: true
  - version_constraint: "true"
    cosign:
      opts:
        - --certificate-identity
        - https://github.com/sigstore/gitsign/.github/workflows/release.yml@refs/tags/{{.Version}}
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - sigstore/gitsign
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: '{{.Asset}}.bundle'
