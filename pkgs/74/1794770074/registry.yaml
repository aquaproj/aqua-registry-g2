name: tohjustin/kube-lineage
type: github_release
repo_owner: tohjustin
repo_name: kube-lineage
repo_id: 397617980
description: A CLI tool to display all dependencies or dependents of an object in
  a Kubernetes cluster
files:
  - name: kubectl-lineage
    src: kube-lineage
  - name: kube-lineage
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  - version_constraint: semver(">= 0.2.0")
  - version_constraint: semver("< 0.2.0")
    files:
      - name: kubectl-lineage
  - version_constraint: "true"
