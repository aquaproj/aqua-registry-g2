name: XTLS/Xray-core
type: github_release
repo_owner: XTLS
repo_name: Xray-core
description: Xray, Penetrates Everything. Also the best v2ray-core
files:
    - name: xray
version_overrides:
    - version_constraint: semver("> 1.4.5")
      replacements:
        amd64: "64"
        arm64: arm64-v8a
    - version_constraint: semver("> 1.2.1")
      replacements:
        amd64: "64"
        arm64: arm64-v8a
    - version_constraint: semver("<= 1.2.1")
      replacements:
        amd64: "64"
        arm64: arm64-v8a
    - version_constraint: "true"
      replacements:
        amd64: "64"
        arm64: arm64-v8a
all_assets_filter: |
    let words = ["-32\\.", "^Xray-win7-"];
    not any(words, {Asset matches #})
