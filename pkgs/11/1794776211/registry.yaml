name: dtan4/k8sec
type: github_release
repo_owner: dtan4
repo_name: k8sec
repo_id: 58996649
description: CLI tool to manage Kubernetes Secrets easily
version_overrides:
  - version_constraint: semver("> 0.5.1")
  - version_constraint: semver("<= 0.5.1")
    files:
      - name: k8sec
        src: '{{.OS}}-{{.Arch}}/k8sec'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
