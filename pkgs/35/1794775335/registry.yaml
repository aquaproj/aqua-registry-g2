name: StanMarek/ghost-complete
type: github_release
repo_owner: StanMarek
repo_name: ghost-complete
repo_id: 1170162111
description: Terminal autocomplete engine with a PTY proxy and shell specifications
  for Ghostty
github_artifact_attestations:
  signer_workflow: StanMarek/ghost-complete/.github/workflows/release.yml
version_overrides:
  - version_constraint: semver("> 0.8.1")
    files:
      - name: ghost-complete
        src: ghost-complete-{{.Arch}}-{{.OS}}/ghost-complete
    github_artifact_attestations:
      signer_workflow: StanMarek/ghost-complete/.github/workflows/release.yml
    supported_envs:
      - darwin
  - version_constraint: semver("<= 0.8.1")
    files:
      - name: ghost-complete
        src: ghost-complete-{{.Arch}}-{{.OS}}/ghost-complete
    supported_envs:
      - darwin
  - version_constraint: "true"
    files:
      - name: ghost-complete
        src: ghost-complete-{{.Arch}}-{{.OS}}/ghost-complete
    github_artifact_attestations:
      signer_workflow: StanMarek/ghost-complete/.github/workflows/release.yml
    supported_envs:
      - darwin
