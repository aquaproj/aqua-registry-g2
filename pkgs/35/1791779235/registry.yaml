name: ip7z/7zip
type: github_release
repo_owner: ip7z
repo_name: 7zip
repo_id: 466446150
description: 7-Zip is a file archiver with a high compression ratio
all_assets_filter: not (Asset endsWith ".exe") and not (Asset endsWith ".msi")
replacements:
  windows: extra
files:
  - name: 7zzs
  - name: 7zz
  - name: 7za
version_overrides:
  - version_constraint: Version == "21.07"
    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: darwin
        files:
          - name: 7zz
      - goos: windows
        format: 7z
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
  - version_constraint: Version in ["22.00", "22.01"]
    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: windows
        format: 7z
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
    supported_envs:
      - linux
      - windows
  - version_constraint: Version == "23.01"
    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: darwin
        files:
          - name: 7zz
      - goos: windows
        format: 7z
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
  - version_constraint: Version in ["24.05", "24.06"]
    overrides:
      - goos: linux
        files:
          - name: 7zzs
      - goos: darwin
        files:
          - name: 7zz
      - goos: windows
        format: 7z
        files:
          - name: 7za
            src: '{{.Arch}}/7za.exe'
  - version_constraint: "true"
    overrides:
      - goos: linux
        files:
          - name: 7zzs
          - name: 7zz
      - goos: darwin
        files:
          - name: 7zz
      - goos: windows
        goarch: amd64
        format: 7z
        files:
          - name: 7za
            src: x64/7za.exe
      - goos: windows
        goarch: arm64
        format: 7z
        files:
          - name: 7za
            src: arm64/7za.exe
