name: suzuki-shunsuke/ghtkn
type: github_release
repo_owner: suzuki-shunsuke
repo_name: ghtkn
repo_id: 1046372472
description: A CLI to create GitHub App User Access Token for secure local development
slsa_provenance:
  type: github_release
  asset: multiple.intoto.jsonl
packslip:
  identity_prefix: https://github.com/suzuki-shunsuke/go-release-workflow/
  issuer: https://token.actions.githubusercontent.com
github_artifact_attestations:
  signer_workflow: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 0.4.1")
    slsa_provenance:
      enabled: false
  - version_constraint: semver("> 0.2.2")
  - version_constraint: semver("<= 0.2.2")
  - version_constraint: "true"
    slsa_provenance:
      enabled: false
