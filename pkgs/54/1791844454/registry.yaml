name: helmwave/helmwave
type: github_release
repo_owner: helmwave
repo_name: helmwave
repo_id: 309215235
description: New  wave for @helm
version_overrides:
  - version_constraint: Version == "0.9.0"
    supported_envs:
      - linux
  - version_constraint: Version == "v0.20.0"
    no_asset: true
  - version_constraint: semver("> 0.35.3")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.8.4")
  - version_constraint: semver("> 0.1.5")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.1.5")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
all_assets_filter: 'not (Asset startsWith "gitops_")'
