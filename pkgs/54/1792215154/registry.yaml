name: elixir-lsp/elixir-ls
type: github_release
repo_owner: elixir-lsp
repo_name: elixir-ls
repo_id: 126746886
description: A frontend-independent IDE "smartness" server for Elixir. Implements the "Language Server Protocol" standard and provides debugger support via the "Debug Adapter Protocol"
version_overrides:
  - version_constraint: semver("> 0.17.10")
    files:
      - name: elixir-ls
        src: language_server.sh
      - name: elixir-debug-adapter
        src: debug_adapter.sh
    overrides:
      - goos: windows
        files:
          - name: elixir-ls
            src: language_server.bat
          - name: elixir-debug-adapter
            src: debug_adapter.bat
  - version_constraint: semver("> 0.14.6")
    files:
      - name: elixir-ls
        src: language_server.sh
      - name: elixir-debug-adapter
        src: debugger.sh
    overrides:
      - goos: windows
        files:
          - name: elixir-ls
            src: language_server.bat
          - name: elixir-debug-adapter
            src: debugger.bat
  - version_constraint: semver("<= 0.14.6")
    files:
      - name: elixir-ls
        src: language_server.sh
      - name: elixir-debug-adapter
        src: debugger.sh
    overrides:
      - goos: windows
        files:
          - name: elixir-ls
            src: language_server.bat
          - name: elixir-debug-adapter
            src: debugger.bat
  - version_constraint: "true"
    files:
      - name: elixir-ls
        src: language_server.sh
      - name: elixir-debug-adapter
        src: debug_adapter.sh
    overrides:
      - goos: windows
        files:
          - name: elixir-ls
            src: language_server.bat
          - name: elixir-debug-adapter
            src: debug_adapter.bat
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
      - windows/amd64
      - windows/arm64
    filter: Asset matches "^elixir-ls[.].+([.].+)?$" or Asset matches "^elixir-ls-.+[.].+([.].+)?$"
