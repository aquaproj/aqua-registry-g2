name: gittower/git-flow-next
type: github_release
repo_owner: gittower
repo_name: git-flow-next
repo_id: 949459538
description: A modern reimplementation of git-flow in Go that offers greater flexibility
  while maintaining backward compatibility with the original git-flow and git-flow-avh
files:
  - name: git-flow
version_overrides:
  - version_constraint: Version == "v0.1.0-alpha.1"
    no_asset: true
  - version_constraint: semver(">= 2.0.0")
    files:
      - name: git-flow
  - version_constraint: semver("< 2.0.0")
    files:
      - name: git-flow
        src: git-flow-{{.Version}}-{{.OS}}-{{.Arch}}
  - version_constraint: "true"
    files:
      - name: git-flow
