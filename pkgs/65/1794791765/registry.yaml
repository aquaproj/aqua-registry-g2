name: alltuner/mise-completions-sync
type: github_release
repo_owner: alltuner
repo_name: mise-completions-sync
repo_id: 1134864792
description: Automatically sync shell completions for tools managed by mise
version_overrides:
  - version_constraint: semver("> 0.5.6")
    files:
      - name: misecompsync
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.5.1")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 0.5.1")
  - version_constraint: "true"
    files:
      - name: misecompsync
    supported_envs:
      - linux
      - darwin
