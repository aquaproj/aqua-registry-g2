name: ogham/exa
type: github_release
repo_owner: ogham
repo_name: exa
repo_id: 20060596
description: A modern replacement for ‘ls’
version_overrides:
    - version_constraint: semver(">= 0.10.0")
      files:
        - name: exa
          src: bin/exa
    - version_constraint: "true"
      files:
        - name: exa
          src: exa-linux-x86_64
      overrides:
        - goos: darwin
          files:
            - name: exa
              src: exa-macos-x86_64
