      signer_workflow: topgrade-rs/topgrade/.github/workflows/create_release_assets.yml
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver(">= 16.1.0")
    github_artifact_attestations:
      signer_workflow: topgrade-rs/topgrade/.github/workflows/create_release_assets.yml
