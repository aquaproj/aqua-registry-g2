name: funbiscuit/spacedisplay-rs
type: github_release
repo_owner: funbiscuit
repo_name: spacedisplay-rs
repo_id: 545084493
description: Fast and lightweight tool to scan your disk space
version_overrides:
  - version_constraint: semver("> 0.1.1")
    files:
      - name: spacedisplay
        src: spacedisplay-rs
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.1.1")
    files:
      - name: spacedisplay
        src: spacedisplay-rs
    supported_envs:
      - linux/amd64
      - windows/amd64
  - version_constraint: "true"
    files:
      - name: spacedisplay
        src: spacedisplay-rs
    supported_envs:
      - darwin
      - windows
      - amd64
