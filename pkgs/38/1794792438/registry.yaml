name: Songmu/laminate
type: github_release
repo_owner: Songmu
repo_name: laminate
repo_id: 1035150953
description: A command-line bridge tool that orchestrates external image generation
  commands to convert text/code strings to images
version_overrides:
  - version_constraint: "true"
    files:
      - name: laminate
        src: laminate_{{.Version}}_{{.OS}}_{{.Arch}}/laminate
    supported_envs:
      - linux
      - darwin
