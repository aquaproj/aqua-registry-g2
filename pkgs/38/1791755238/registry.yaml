name: pipe-cd/pipecd/pipectl
type: github_release
repo_owner: pipe-cd
repo_name: pipecd
repo_id: 271714774
description: The command line tool for PipeCD
version_filter: Version startsWith "v"
version_overrides:
  - version_constraint: semver("> 0.33.0")
  - version_constraint: semver("> 0.9.1")
  - version_constraint: semver("<= 0.9.1")
    no_asset: true
  - version_constraint: "true"
all_assets_filter: 'Asset matches "^pipectl_.+_.+_.+([.].+)?$" or Asset endsWith ".intoto.jsonl"'
