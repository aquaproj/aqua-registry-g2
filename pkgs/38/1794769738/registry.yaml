name: bonnefoa/kubectl-fzf
type: github_release
repo_owner: bonnefoa
repo_name: kubectl-fzf
repo_id: 155163258
description: A fast kubectl autocompletion with fzf
files:
  - name: kubectl-fzf-server
  - name: kubectl-fzf-completion
supported_envs:
  - linux/amd64
  - darwin
# v2 and earlier ship cache_builder and shell scripts to source; kubectl-fzf-server and
# kubectl-fzf-completion came with v3.
version_overrides:
  - version_constraint: semver(">= 3.0.0")
  - version_constraint: semver("< 3.0.0")
    files:
      - name: cache_builder
