name: grafana/mimir/mimirtool
type: github_release
repo_owner: grafana
repo_name: mimir
repo_id: 385634291
description: Grafana Mimir provides horizontally scalable, highly available, multi-tenant, long-term storage for Prometheus
version_prefix: mimir-
version_overrides:
  - version_constraint: Version == "mimir-3.2.0-rc.0"
    no_asset: true
  - version_constraint: Version in ["mimir-2.2.0-rc.0", "mimir-3.1.0-rc.0"]
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 3.0.9") or Version == "mimir-3.1.0-rc.1"
  - version_constraint: semver("<= 3.1.2")
    supported_envs:
      - linux
      - darwin
  - version_constraint: "true"
all_assets_filter: not (Asset matches "mimir-")
