name: sharkdp/diskus
type: github_release
repo_owner: sharkdp
repo_name: diskus
repo_id: 155746625
description: A minimal, fast alternative to 'du -sh'
files:
  - name: diskus
    src: diskus-{{.Version}}-{{.Arch}}-{{.OS}}/diskus
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  # v0.1.0 and v0.2.0 were released while the project was named dup: the archive holds
  # dup-<version>-<target>/dup.
  - version_constraint: semver("< 0.3.0")
    files:
      - name: diskus
        src: dup-{{.Version}}-{{.Arch}}-{{.OS}}/dup
    supported_envs:
      - darwin
      - linux/amd64
  # Before v0.7.0 the releases build for x86_64 macOS and Linux only.
  - version_constraint: semver("< 0.7.0")
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: "true"
