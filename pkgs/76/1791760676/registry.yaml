name: sharkdp/diskus
type: github_release
repo_owner: sharkdp
repo_name: diskus
repo_id: 155746625
description: A minimal, fast alternative to 'du -sh'
files:
  - name: diskus
    src: diskus-{{.Version}}-{{.Arch}}-{{.OS}}/diskus
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  # Before v0.7.0 the releases build for x86_64 macOS and Linux only.
  - version_constraint: semver("< 0.7.0")
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: "true"
