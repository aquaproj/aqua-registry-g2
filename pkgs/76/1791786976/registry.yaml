name: jacobdeichert/mask
type: github_release
repo_owner: jacobdeichert
repo_name: mask
repo_id: 195581837
description: A CLI task runner defined by a simple markdown file
version_prefix: mask/
files:
  - name: mask
    src: mask-{{.SemVer}}-{{.Arch}}-{{.OS}}/mask
supported_envs:
  - darwin
  - amd64
version_overrides:
  - version_constraint: semver(">= 0.11.4")
  - version_constraint: semver(">= 0.11.2")
    version_prefix: ""
  - version_constraint: semver(">= 0.11.1")
    version_prefix: ""
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("< 0.11.1")
    version_prefix: ""
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
