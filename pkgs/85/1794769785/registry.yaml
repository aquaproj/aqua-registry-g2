name: dependabot/cli
type: github_release
repo_owner: dependabot
repo_name: cli
repo_id: 540522997
description: A tool for testing and debugging Dependabot update jobs
github_artifact_attestations:
  signer_workflow: dependabot/cli/.github/workflows/release.yml
version_overrides:
  - version_constraint: Version in ["v1.25.0", "v1.33.0"]
    no_asset: true
  - version_constraint: semver("> 1.62.1")
    files:
      - name: dependabot
    github_artifact_attestations:
      signer_workflow: dependabot/cli/.github/workflows/release.yml
  - version_constraint: semver("<= 1.62.1")
    files:
      - name: dependabot
  - version_constraint: "true"
    files:
      - name: dependabot
    github_artifact_attestations:
      signer_workflow: dependabot/cli/.github/workflows/release.yml
