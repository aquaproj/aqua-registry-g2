name: DeNA/unity-meta-check/unity-meta-check
type: github_release
repo_owner: DeNA
repo_name: unity-meta-check
repo_id: 339063961
description: Checker for missing/dangling meta files. The result print to stdout.
version_overrides:
  - version_constraint: semver("> 3.3.0")
    supported_envs:
      - darwin
      - linux
      - windows
  - version_constraint: semver("<= 3.3.0")
    supported_envs:
      - darwin
      - linux/amd64
      - windows
  - version_constraint: "true"
    supported_envs:
      - darwin
      - linux
      - windows
all_assets_filter: Asset matches "^unity-meta-check-.+-.+([.].+)?$" or Asset endsWith
  ".intoto.jsonl"
