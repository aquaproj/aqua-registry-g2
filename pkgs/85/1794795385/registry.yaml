name: goark/gnkf
type: github_release
repo_owner: goark
repo_name: gnkf
repo_id: 282792963
description: Network Kanji Filter by Golang
version_overrides:
  - version_constraint: semver(">= 0.7.5")
  - version_constraint: semver(">= 0.6.0")
  - version_constraint: semver(">= 0.4.0")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: semver("< 0.4.0")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: "true"
