name: containerd/containerd
type: github_release
repo_owner: containerd
repo_name: containerd
description: An open and reliable container runtime
version_filter: Version matches "^v[0-9]+.[0-9]+.[0-9]+$"
overrides:
    - goos: windows
      files:
        - name: containerd
          src: bin/{{.FileName}}
        - name: containerd-shim-runhcs-v1
          src: bin/{{.FileName}}
        - name: containerd-stress
          src: bin/{{.FileName}}
        - name: ctr
          src: bin/{{.FileName}}
files:
    - name: containerd
      src: bin/{{.FileName}}
    - name: containerd-shim-runc-v2
      src: bin/{{.FileName}}
    - name: containerd-stress
      src: bin/{{.FileName}}
    - name: ctr
      src: bin/{{.FileName}}
slsa_provenance:
    enabled: false
github_artifact_attestations:
    signer_workflow: containerd/containerd/.github/workflows/release.yml
version_overrides:
    - version_constraint: Version == "v1.2.11"
      no_asset: true
    - version_constraint: semver("> 2.0.0")
      github_artifact_attestations:
        signer_workflow: containerd/containerd/.github/workflows/release.yml
    - version_constraint: semver("> 1.5.18")
    - version_constraint: semver("> 1.3.4")
      files:
        - name: containerd
          src: bin/{{.FileName}}
        - name: containerd-shim
          src: bin/{{.FileName}}
        - name: containerd-shim-runc-v1
          src: bin/{{.FileName}}
        - name: containerd-shim-runc-v2
          src: bin/{{.FileName}}
        - name: ctr
          src: bin/{{.FileName}}
      overrides:
        - goos: windows
          files:
            - name: containerd
              src: bin/{{.FileName}}
            - name: containerd-shim-runhcs-v1
              src: bin/{{.FileName}}
            - name: ctr
              src: bin/{{.FileName}}
    - version_constraint: semver("> 1.2.13")
      files:
        - name: containerd
          src: bin/{{.FileName}}
        - name: containerd-shim
          src: bin/{{.FileName}}
        - name: containerd-shim-runc-v1
          src: bin/{{.FileName}}
        - name: containerd-shim-runc-v2
          src: bin/{{.FileName}}
        - name: containerd-stress
          src: bin/{{.FileName}}
        - name: ctr
          src: bin/{{.FileName}}
    - version_constraint: semver("> 0.2.9")
      files:
        - name: containerd
          src: bin/{{.FileName}}
        - name: containerd-shim
          src: bin/{{.FileName}}
        - name: containerd-shim-runc-v1
          src: bin/{{.FileName}}
        - name: ctr
          src: bin/{{.FileName}}
    - version_constraint: semver("<= 0.2.9")
      no_asset: true
    - version_constraint: "true"
      github_artifact_attestations:
        signer_workflow: containerd/containerd/.github/workflows/release.yml
all_assets_filter: Asset matches "^containerd-[0-9]+"
