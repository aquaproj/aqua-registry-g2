name: kjanat/actionlint
type: github_release
repo_owner: kjanat
repo_name: actionlint
repo_id: 1326162482
description: Find problems in your GitHub Actions workflows
build:
  type: go_install
  path: actionlint.kjanat.dev/cmd/actionlint
github_artifact_attestations:
  enabled: true
  signer_workflow: kjanat/actionlint/.github/workflows/release.yml
# Before v1.16.0 the attesting workflow is release.yaml.
version_overrides:
  - version_constraint: semver(">= 1.16.0")
  - version_constraint: semver("< 1.16.0")
    github_artifact_attestations:
      enabled: true
      signer_workflow: kjanat/actionlint/.github/workflows/release.yaml
