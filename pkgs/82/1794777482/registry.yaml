name: operator-framework/operator-registry
type: github_release
repo_owner: operator-framework
repo_name: operator-registry
repo_id: 152314982
description: Operator Registry runs in a Kubernetes or OpenShift cluster to provide
  operator catalog data to Operator Lifecycle Manager
files:
  - name: opm
version_overrides:
  - version_constraint: Version in ["v1.10.0", "v1.16.0"]
    no_asset: true
  - version_constraint: Version in ["v1.7.0", "v1.11.0", "v1.12.4"]
    supported_envs:
      - darwin
  - version_constraint: Version in ["v1.11.1", "v1.12.3", "v1.15.0"]
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: Version == "v1.14.3"
    supported_envs:
      - linux/amd64
  - version_constraint: semver("> 1.19.5")
  - version_constraint: semver("> 1.14.2")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 1.12.2")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 1.9.0")
    supported_envs:
      - darwin
  - version_constraint: semver("> 1.6.1")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("> 1.5.6")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 1.5.6")
    no_asset: true
  - version_constraint: "true"
