name: crate-ci/committed
type: github_release
repo_owner: crate-ci
repo_name: committed
repo_id: 199063936
description: Nitpicking commit history since beabf39
version_overrides:
  - version_constraint: Version == "v0.1.22"
    no_asset: true
  - version_constraint: Version == "v0.2.8"
    supported_envs:
      - linux/amd64
      - windows
  - version_constraint: Version == "v0.1.21"
    files:
      - name: committed
        src: '{{.AssetWithoutExt}}/committed'
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.1.20")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.1.15")
    no_asset: true
  - version_constraint: semver("> 0.1.4")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.1.2")
    supported_envs:
      - windows
  - version_constraint: semver("<= 0.1.2")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
