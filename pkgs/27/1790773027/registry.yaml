name: vi/websocat
type: github_release
repo_owner: vi
repo_name: websocat
repo_id: 74579985
description: Command-line client for WebSockets, like netcat (or curl) for ws:// with advanced socat-like functions
version_overrides:
    - version_constraint: semver(">= 1.10.0")
    - version_constraint: "true"
      replacements:
        linux: linux64
# Old releases name a 32-bit ARM build linuxarm32, which was offered for linux/arm64, and a
# 32-bit x86 one linux32.
all_assets_filter: not (Asset contains "arm32" or Asset contains "linux32")
