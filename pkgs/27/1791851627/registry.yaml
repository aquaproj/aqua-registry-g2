name: nats-io/natscli
type: github_release
repo_owner: nats-io
repo_name: natscli
repo_id: 318166068
description: The NATS Command Line Interface
files:
  - name: nats
    src: nats-{{trimV .Version}}-{{.OS}}-{{.Arch}}/nats
version_overrides:
  - version_constraint: semver(">= 0.0.27")
  - version_constraint: semver(">= 0.0.22")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: semver("< 0.0.22")
    supported_envs:
      - darwin
      - linux
      - amd64
  - version_constraint: "true"
