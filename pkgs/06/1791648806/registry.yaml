name: docker/cli
type: http
repo_owner: docker
repo_name: cli
description: Docker CE CLI
url: https://download.docker.com/{{.OS}}/static/stable/{{.Arch}}/docker-{{trimV .Version}}.{{.Format}}
format: tgz
version_filter: not (Version contains "beta" or Version contains "rc")
version_source: github_tag
overrides:
  - goos: linux
    files:
      - name: containerd
        src: docker/containerd
      - name: containerd-shim-runc-v2
        src: docker/containerd-shim-runc-v2
      - name: ctr
        src: docker/ctr
      - name: docker
        src: docker/docker
      - name: docker-init
        src: docker/docker-init
      - name: docker-proxy
        src: docker/docker-proxy
      - name: dockerd
        src: docker/dockerd
      - name: runc
        src: docker/runc
  - goos: windows
    format: zip
files:
  - name: docker
    src: docker/docker
replacements:
  amd64: x86_64
  arm64: aarch64
  darwin: mac
  windows: win
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  - version_constraint: semver(">= 23.0.0")
  - version_constraint: semver("< 23.0.0")
    overrides:
      - goos: linux
        files:
          - name: containerd
            src: docker/containerd
          - name: containerd-shim
            src: docker/containerd-shim
          - name: containerd-shim-runc-v2
            src: docker/containerd-shim-runc-v2
          - name: ctr
            src: docker/ctr
          - name: docker
            src: docker/docker
          - name: docker-init
            src: docker/docker-init
          - name: docker-proxy
            src: docker/docker-proxy
          - name: dockerd
            src: docker/dockerd
          - name: runc
            src: docker/runc
      - goos: windows
        format: zip
  - version_constraint: "true"
