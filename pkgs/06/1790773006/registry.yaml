name: tailscale/tailscale
type: http
repo_owner: tailscale
repo_name: tailscale
repo_id: 237523442
description: The easiest, most secure way to use WireGuard and 2FA
url: https://pkgs.tailscale.com/stable/tailscale_{{trimV .Version}}_{{.Arch}}.{{.Format}}
format: tgz
overrides:
    - goos: darwin
      format: pkg
      url: https://pkgs.tailscale.com/stable/Tailscale-{{trimV .Version}}-macos.{{.Format}}
      files:
        - name: tailscale
          src: Distribution.pkg/Payload/Contents/MacOS/Tailscale
files:
    - name: tailscale
      src: '{{.AssetWithoutExt}}/tailscale'
    - name: tailscaled
      src: '{{.AssetWithoutExt}}/tailscaled'
supported_envs:
    - linux
    - darwin
version_overrides:
    # From 1.104 the macOS package's payload is the app bundle itself, so the executable
    # sits under Tailscale.app rather than at Contents directly.
    - version_constraint: semver(">= 1.104.0")
      overrides:
        - goos: darwin
          format: pkg
          url: https://pkgs.tailscale.com/stable/Tailscale-{{trimV .Version}}-macos.{{.Format}}
          files:
            - name: tailscale
              src: Distribution.pkg/Payload/Tailscale.app/Contents/MacOS/Tailscale
    - version_constraint: "true"
