name: stackrox/kube-linter
type: github_release
repo_owner: stackrox
repo_name: kube-linter
repo_id: 287336275
description: KubeLinter is a static analysis tool that checks Kubernetes YAML files and Helm charts to ensure the applications represented in them adhere to best practices
version_overrides:
  - version_constraint: Version in ["0.0.1", "v0.8.0"]
    no_asset: true
  - version_constraint: semver("<= 0.4.0")
    supported_envs:
      - darwin
      - windows
      - amd64
  # The signatures of 0.5.0, 0.5.1 and 0.6.0 aren't in the transparency log. They are made
  # with the project's key, which is still checked; --insecure-ignore-tlog leaves out the
  # log alone.
  - version_constraint: Version in ["0.5.0", "0.6.0"]
    cosign:
      opts:
        - --key
        - https://raw.githubusercontent.com/stackrox/kube-linter/refs/tags/{{.Version}}/kubelinter-cosign.pub
        - --signature
        - https://github.com/stackrox/kube-linter/releases/download/{{.Version}}/{{.Asset}}.sig
        - --insecure-ignore-tlog
    supported_envs:
      - darwin
      - windows
      - amd64
  # 0.5.1 signs only its Linux build.
  - version_constraint: Version == "0.5.1"
    cosign:
      opts:
        - --key
        - https://raw.githubusercontent.com/stackrox/kube-linter/refs/tags/{{.Version}}/kubelinter-cosign.pub
        - --signature
        - https://github.com/stackrox/kube-linter/releases/download/{{.Version}}/{{.Asset}}.sig
        - --insecure-ignore-tlog
    overrides:
      - goos: darwin
        cosign:
          enabled: false
      - goos: windows
        cosign:
          enabled: false
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.6.7")
    cosign:
      opts:
        - --key
        - https://raw.githubusercontent.com/stackrox/kube-linter/refs/tags/{{.Version}}/kubelinter-cosign.pub
        - --signature
        - https://github.com/stackrox/kube-linter/releases/download/{{.Version}}/{{.Asset}}.sig
    supported_envs:
      - darwin
      - windows
      - amd64
  # v0.6.8 publishes no signature for kube-linter-windows.zip.
  - version_constraint: Version == "v0.6.8"
    cosign:
      opts:
        - --key
        - https://raw.githubusercontent.com/stackrox/kube-linter/refs/tags/{{.Version}}/kubelinter-cosign.pub
        - --signature
        - https://github.com/stackrox/kube-linter/releases/download/{{.Version}}/{{.Asset}}.sig
    overrides:
      - goos: windows
        goarch: amd64
        cosign:
          enabled: false
  - version_constraint: semver("<= 0.7.6")
    cosign:
      opts:
        - --key
        - https://raw.githubusercontent.com/stackrox/kube-linter/refs/tags/{{.Version}}/kubelinter-cosign.pub
        - --signature
        - https://github.com/stackrox/kube-linter/releases/download/{{.Version}}/{{.Asset}}.sig
  - version_constraint: "true"
    cosign:
      opts:
        - --key
        - https://raw.githubusercontent.com/stackrox/kube-linter/refs/tags/{{.Version}}/kubelinter-cosign.pub
      bundle:
        type: github_release
        asset: '{{.Asset}}.sigstore.json'
all_assets_filter: not (Asset endsWith ".tar.gz")
