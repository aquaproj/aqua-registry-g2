name: Piturnah/gex
type: github_release
repo_owner: Piturnah
repo_name: gex
repo_id: 518201542
description: 'Git Explorer: cross-platform git workflow improvement tool inspired
  by Magit'
version_overrides:
  - version_constraint: semver("> 0.3.5")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.3.5")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - darwin
      - windows
      - amd64
