name: Ladicle/kubectl-rolesum
type: github_release
repo_owner: Ladicle
repo_name: kubectl-rolesum
repo_id: 186439829
description: Summarize Kubernetes RBAC roles for the specified subjects
files:
  - name: kubectl-rolesum
    src: kubectl-rolesum_{{.OS}}-{{.Arch}}/kubectl-rolesum
supported_envs:
  - windows
  - darwin
  - linux/amd64
version_overrides:
  # The releases before 1.4 ship the command under its old name, kubectl-bindrole.
  - version_constraint: semver("< 1.4.0")
    files:
      - name: kubectl-rolesum
        src: kubectl-bindrole_{{.OS}}-{{.Arch}}/kubectl-bindrole
  - version_constraint: "true"
