name: cbroglie/mustache
type: github_release
repo_owner: cbroglie
repo_name: mustache
repo_id: 39479317
description: The mustache template language in Go
version_overrides:
  - version_constraint: Version in ["v1.0.0", "v1.1.0"]
    no_asset: true
  - version_constraint: semver("> 1.3.1")
  - version_constraint: semver("<= 1.3.1")
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
