name: openshift/osdctl
type: github_release
repo_owner: openshift
repo_name: osdctl
repo_id: 269182765
description: CLI for the OSD utilities
version_overrides:
  - version_constraint: Version == "v0.4.1"
    no_asset: true
  - version_constraint: semver("> 0.12.0")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.1.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.1.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
