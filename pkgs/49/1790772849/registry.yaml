name: golang-migrate/migrate
type: github_release
repo_owner: golang-migrate
repo_name: migrate
repo_id: 118105436
description: Database migrations. CLI and Golang library
version_overrides:
    - version_constraint: semver(">= 4.15.0")
    - version_constraint: "true"
      files:
        - name: migrate
          src: migrate.{{.OS}}-{{.Arch}}
      overrides:
        - goos: windows
          files:
            - name: migrate
              src: migrate.{{.OS}}-{{.Arch}}.exe
