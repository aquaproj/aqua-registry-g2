name: babarot/iap_curl
aliases:
  - name: b4b4r07/iap_curl
type: github_release
repo_owner: babarot
repo_name: iap_curl
repo_id: 107211377
description: A CLI that is curl wrapper for making HTTP request to IAP-protected app,
  more easier than curl
version_overrides:
  - version_constraint: semver("> 0.1.3")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.1.3")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux/amd64
      - darwin
