name: kkinnear/zprint
type: github_release
repo_owner: kkinnear
repo_name: zprint
repo_id: 68876645
description: Beautifully format Clojure and Clojurescript source code and s-expressions
version_overrides:
  - version_constraint: semver("> 1.2.7")
    replacements:
      linux: l
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: semver("> 0.4.10")
    replacements:
      linux: l
    supported_envs:
      - darwin/amd64
      - linux/amd64
  - version_constraint: semver("> 0.4.7")
    replacements:
      linux: l
    supported_envs:
      - linux/amd64
  - version_constraint: semver("<= 0.4.7")
    no_asset: true
  - version_constraint: "true"
    replacements:
      linux: l
    supported_envs:
      - darwin
      - linux/amd64
# zprintm is the macOS build for Intel and zprintma the one for Apple silicon. Their names
# don't spell darwin as anything the parser reads, and no spelling of it tells the two apart
# (zprintma starts with zprintm), so no spelling is given and these rules place them.
asset_rules:
  - envs:
      - darwin/amd64
    filter: Asset startsWith "zprintm-"
  - envs:
      - darwin/arm64
    filter: Asset startsWith "zprintma-"
