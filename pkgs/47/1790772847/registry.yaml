name: gohugoio/hugo/hugo-extended-withdeploy
type: github_release
repo_owner: gohugoio
repo_name: hugo
repo_id: 11180687
description: The world’s fastest framework for building websites
files:
  - name: hugo
version_overrides:
  - version_constraint: Version == "v0.139.5"
    no_asset: true
  - version_constraint: Version == "v0.137.0"
  - version_constraint: semver("> 0.152.2")
    overrides:
      - goos: darwin
        files:
          - name: hugo
            src: Payload/hugo
  - version_constraint: semver("> 0.138.0")
  - version_constraint: semver(">= 0.137.0")
  - version_constraint: semver("< 0.137.0")
    no_asset: true
  - version_constraint: "true"
    overrides:
      - goos: darwin
        files:
          - name: hugo
            src: Payload/hugo
all_assets_filter: (Asset matches "extended_withdeploy") or (Asset matches "checksum")
# From v0.170.0 every build is extended, and the assets are named hugo_withdeploy_* rather
# than hugo_extended_withdeploy_*.
asset_filters:
  - version_constraint: semver(">= 0.170.0")
    all_assets_filter: (Asset contains "_withdeploy_") or (Asset matches "checksum")
