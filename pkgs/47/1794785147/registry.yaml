name: minamijoyo/myaws
type: github_release
repo_owner: minamijoyo
repo_name: myaws
repo_id: 66151418
description: A human friendly AWS CLI written in Go
version_overrides:
  - version_constraint: semver("> 0.4.1")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("> 0.0.3")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("<= 0.0.3")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin
