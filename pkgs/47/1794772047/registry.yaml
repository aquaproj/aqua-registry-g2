name: orlangure/gocovsh
type: github_release
repo_owner: orlangure
repo_name: gocovsh
repo_id: 453526680
description: 'Go Coverage in your terminal: a tool for exploring Go Coverage reports
  from the command line'
version_overrides:
  # checksums.txt of v0.4.0 to v0.5.1 is signed with a certificate that carries no SCT,
  # which today's cosign requires: certificate does not include required embedded SCT.
  # The signer is read off the release and still checked; this leaves out the SCT alone.
  - version_constraint: Version in ["v0.4.0", "v0.4.1-alpha1", "v0.4.1", "v0.5.0", "v0.5.1"]
    checksum:
      cosign:
        opts:
          - --insecure-ignore-sct
  # v0.2.0 to v0.3.0 sign checksums.txt with a certificate from the Sigstore of 2022, which
  # today's trusted root doesn't vouch for: leaf certificate verification failed.
  - version_constraint: Version in ["v0.2.0", "v0.2.1", "v0.3.0"]
    checksum:
      cosign:
        enabled: false
  - version_constraint: "true"
