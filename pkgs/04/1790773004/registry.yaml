name: sxyazi/yazi
type: github_release
repo_owner: sxyazi
repo_name: yazi
description: Blazing fast terminal file manager written in Rust, based on async I/O
files:
    - name: yazi
    - name: ya
version_overrides:
    - version_constraint: Version == "v0.1.4"
      files:
        - name: yazi
          src: yazi-{{.Arch}}-{{.OS}}
    - version_constraint: Version == "v0.2.4"
      files:
        - name: yazi
          src: yazi-{{.Arch}}-{{.OS}}/yazi
    - version_constraint: semver("> 0.2.3")
      files:
        - name: yazi
          src: yazi-{{.Arch}}-{{.OS}}/yazi
        - name: ya
          src: yazi-{{.Arch}}-{{.OS}}/ya
    - version_constraint: semver("> 0.1.3")
      files:
        - name: yazi
          src: yazi-{{.Arch}}-{{.OS}}/yazi
    - version_constraint: semver("<= 0.1.3")
      files:
        - name: yazi
          src: yazi-{{.Arch}}-{{.OS}}
    - version_constraint: "true"
      files:
        - name: yazi
          src: yazi-{{.Arch}}-{{.OS}}/yazi
        - name: ya
          src: yazi-{{.Arch}}-{{.OS}}/ya
