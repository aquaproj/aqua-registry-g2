name: exercism/cli
type: github_release
repo_owner: exercism
repo_name: cli
repo_id: 11870975
description: A Go based command line tool for exercism.org
files:
  - name: exercism
version_overrides:
  - version_constraint: semver(">= 3.2.0")
  - version_constraint: semver(">= 3.0.13")
    supported_envs:
      - darwin
      - amd64
  # The Windows zips of v3.0.11 and v3.0.12 hold ../shell/*, paths outside the directory
  # they are extracted to, which aqua refuses to extract.
  - version_constraint: Version in ["v3.0.11", "v3.0.12"]
    supported_envs:
      - darwin
      - linux/amd64
  - version_constraint: semver(">= 3.0.0")
    supported_envs:
      - darwin
      - amd64
  - version_constraint: semver(">= 1.7.3")
    supported_envs:
      - darwin
      - amd64
  - version_constraint: semver(">= 1.7.2")
    supported_envs:
      - darwin
      - amd64
  - version_constraint: semver("< 1.7.2")
    supported_envs:
      - darwin
      - amd64
  - version_constraint: "true"
