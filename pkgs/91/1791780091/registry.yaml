name: sharkdp/vivid
type: github_release
repo_owner: sharkdp
repo_name: vivid
repo_id: 158295285
description: A themeable LS_COLORS generator with a rich filetype database
files:
  - name: vivid
    src: vivid-{{.Version}}-{{.Arch}}-{{.OS}}/vivid
supported_envs:
  - darwin
  - linux
  - amd64
version_overrides:
  # Before 0.3.0 the project was dircolors-hd, and so was the executable.
  - version_constraint: semver("< 0.3.0")
    files:
      - name: dircolors-hd
        src: '{{.AssetWithoutExt}}/dircolors-hd'
      - name: vivid
        src: '{{.AssetWithoutExt}}/dircolors-hd'
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver("< 0.8.0")
    supported_envs:
      - linux/amd64
      - darwin
  - version_constraint: semver(">= 0.8.0, < 0.11.0")
  - version_constraint: semver("= 0.11.0")
    files:
      - name: vivid
        src: vivid-v0.10.1-{{.Arch}}-{{.OS}}/vivid
  - version_constraint: "true"
