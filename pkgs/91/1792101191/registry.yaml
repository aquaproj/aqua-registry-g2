name: rhysd/actionlint
type: github_release
repo_owner: rhysd
repo_name: actionlint
repo_id: 370668507
description: ':octocat: Static checker for GitHub Actions workflow files'
github_artifact_attestations:
  signer_workflow: rhysd/actionlint/.github/workflows/release.yaml
version_overrides:
  - version_constraint: semver("> 1.7.10")
    github_artifact_attestations:
      signer_workflow: rhysd/actionlint/.github/workflows/release.yaml
  - version_constraint: semver("> 1.4.0")
  - version_constraint: semver("<= 1.4.0")
  - version_constraint: "true"
    github_artifact_attestations:
      signer_workflow: rhysd/actionlint/.github/workflows/release.yaml
