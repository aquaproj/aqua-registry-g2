name: zwasm/zwasm
type: github_release
repo_owner: zwasm
repo_name: zwasm
repo_id: 1154193071
description: A fast, spec-compliant WebAssembly runtime written in Zig
version_overrides:
  - version_constraint: Version == "v1.11.1"
    no_asset: true
  - version_constraint: semver("> 1.5.0")
    supported_envs:
      - linux
      - darwin/arm64
      - windows/amd64
  - version_constraint: semver("<= 1.5.0")
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: "true"
    supported_envs:
      - linux
      - darwin/arm64
      - windows/amd64
