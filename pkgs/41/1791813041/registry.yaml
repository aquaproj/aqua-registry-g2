name: corneliusweig/rakkess/access-matrix
type: github_release
repo_owner: corneliusweig
repo_name: rakkess
repo_id: 172054938
description: Review Access - kubectl plugin to show an access matrix for k8s server resources
files:
  - name: kubectl-access_matrix
    src: access-matrix-{{.Arch}}-{{.OS}}
supported_envs:
  - darwin
  - amd64
all_assets_filter: Asset matches "^access-matrix-.+-.+[.]tar[.]gz([.].+)?$" or Asset matches "^access-matrix-amd64-windows[.]zip([.].+)?$" or Asset endsWith ".intoto.jsonl"
