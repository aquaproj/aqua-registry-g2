name: domoritz/arrow-tools/json2parquet
type: github_release
repo_owner: domoritz
repo_name: arrow-tools
repo_id: 596376544
description: Convert JSON files to Apache Parquet. This package is part of Arrow CLI
  tools
version_overrides:
  - version_constraint: Version == "v0.12.0"
    no_asset: true
  - version_constraint: semver("> 0.22.3")
    files:
      - name: json2parquet
        src: '{{.AssetWithoutExt}}/json2parquet'
    supported_envs:
      - linux
      - darwin/arm64
  - version_constraint: semver("> 0.8.0")
    files:
      - name: json2parquet
        src: '{{.AssetWithoutExt}}/json2parquet'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: json2parquet
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("<= 0.8.0")
    files:
      - name: json2parquet
        src: '{{.AssetWithoutExt}}/json2parquet'
    overrides:
      - goos: windows
        format: zip
        files:
          - name: json2parquet
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: "true"
    files:
      - name: json2parquet
        src: '{{.AssetWithoutExt}}/json2parquet'
    supported_envs:
      - linux
      - darwin/arm64
all_assets_filter: Asset matches "^json2parquet-.+-.+-.+[.].+([.].+)?$" or Asset matches
  "^json2parquet-.+-.+[.].+([.].+)?$" or Asset endsWith ".intoto.jsonl"
