name: slsa-framework/slsa-verifier
type: github_release
repo_owner: slsa-framework
repo_name: slsa-verifier
repo_id: 474162642
description: Verify provenance from SLSA compliant builders
version_overrides:
  - version_constraint: Version == "v1.4.0"
  - version_constraint: semver("> 2.0.1")
    slsa_provenance:
      type: github_release
      asset: '{{.Asset}}.intoto.jsonl'
  - version_constraint: semver("> 1.3.2")
    overrides:
      - goos: linux
        goarch: amd64
        slsa_provenance:
          type: github_release
          asset: slsa-verifier-{{.OS}}-{{.Arch}}.intoto.jsonl
  - version_constraint: semver("<= 1.3.2")
    overrides:
      - goos: linux
        goarch: amd64
        slsa_provenance:
          type: github_release
          asset: slsa-verifier-{{.OS}}-{{.Arch}}.intoto.jsonl
  - version_constraint: "true"
    slsa_provenance:
      type: github_release
      asset: '{{.Asset}}.intoto.jsonl'
