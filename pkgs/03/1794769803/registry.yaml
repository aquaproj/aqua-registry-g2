name: Lallassu/gorss
type: github_release
repo_owner: Lallassu
repo_name: gorss
repo_id: 209380442
description: Go Terminal Feed Reader
files:
  - name: gorss
    src: dist/gorss_{{.OS}}
supported_envs:
  - darwin
  - linux/amd64
version_overrides:
  # Before 0.3 the command is gorss/gorss_<os> rather than dist/gorss_<os>.
  - version_constraint: semver("< 0.3")
    files:
      - name: gorss
        src: gorss/gorss_{{.OS}}
    replacements:
      darwin: osx
  - version_constraint: "true"
