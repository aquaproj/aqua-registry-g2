name: pre-commit/pre-commit
type: github_release
repo_owner: pre-commit
repo_name: pre-commit
repo_id: 17689377
description: A framework for managing and maintaining multi-language pre-commit hooks
version_overrides:
  - version_constraint: semver("> 2.7.0")
    supported_envs:
      - darwin
      - linux
  - version_constraint: semver("<= 2.7.0")
    no_asset: true
  - version_constraint: "true"
    supported_envs:
      - darwin
      - linux
asset_rules:
  - envs:
      - linux/amd64
      - linux/arm64
      - darwin/amd64
      - darwin/arm64
    filter: Asset matches "^pre-commit-.+[.]pyz([.].+)?$"
