name: ctxrs/ctx
type: github_release
repo_owner: ctxrs
repo_name: ctx
repo_id: 1165116270
description: Search the coding agent history already on your machine
version_overrides:
  - version_constraint: Version == "v0.20.0"
    supported_envs:
      - darwin
      - windows
      - amd64
  - version_constraint: semver("> 0.19.0")
  - version_constraint: semver("<= 0.19.0")
    no_asset: true
  - version_constraint: "true"
all_assets_filter: 'not (Asset startsWith "ctx-onnxruntime-" or Asset endsWith ".third-party-notices.txt")'
