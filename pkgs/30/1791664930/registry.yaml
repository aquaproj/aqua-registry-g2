name: docker/buildx
type: github_release
repo_owner: docker
repo_name: buildx
repo_id: 177210627
description: Docker CLI plugin for extended build capabilities with BuildKit
files:
  - name: docker-cli-plugin-docker-buildx
version_overrides:
  - version_constraint: semver(">= 0.36.0-rc2")
    cosign:
      opts:
        - --certificate-identity-regexp
        - ^https://github\.com/docker/github-builder/\.github/workflows/bake\.yml@.+$
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - docker/buildx
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json
    overrides:
      - goos: darwin
        cosign:
          enabled: false
      - goos: windows
        cosign:
          enabled: false
  - version_constraint: semver(">= 0.31.0")
    cosign:
      opts:
        - --certificate-identity-regexp
        - ^https://github\.com/docker/github-builder/\.github/workflows/bake\.yml@.+$
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - docker/buildx
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json
    overrides:
      - goos: darwin
        cosign:
          enabled: false
  - version_constraint: semver("> 0.10.0-rc1")
  - version_constraint: semver("> 0.6.3")
  - version_constraint: semver("> 0.5.1")
  - version_constraint: semver("> 0.5.0-rc1")
  - version_constraint: semver("<= 0.5.0-rc1")
  - version_constraint: "true"
    cosign:
      opts:
        - --certificate-identity-regexp
        - ^https://github\.com/docker/github-builder/\.github/workflows/bake\.yml@.+$
        - --certificate-oidc-issuer
        - https://token.actions.githubusercontent.com
        - --certificate-github-workflow-repository
        - docker/buildx
        - --certificate-github-workflow-ref
        - refs/tags/{{.Version}}
      bundle:
        type: github_release
        asset: buildx-{{.Version}}.{{.OS}}-{{.Arch}}.sigstore.json
    overrides:
      - goos: darwin
        cosign:
          enabled: false
      - goos: windows
        cosign:
          enabled: false
