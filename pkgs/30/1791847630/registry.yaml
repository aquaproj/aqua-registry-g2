description: Find outdated or deprecated Helm charts running in your cluster
version_overrides:
  - version_constraint: semver("> 2.3.2")
  - version_constraint: semver("> 2.0.1")
    supported_envs:
      - linux
      - darwin
  - version_constraint: semver("<= 2.0.1")
