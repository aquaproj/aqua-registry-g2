name: Bug of registry
description: |
  Please report the bug of registry.
labels:
  - bug
body:
  - type: textarea
    id: package-name
    attributes:
      label: package name
      description: |
        e.g. `suzuki-shunsuke/github-comment`
    validations:
      required: false
  - type: textarea
    id: aqua-info
    attributes:
      label: aqua info
      description: |
        Please use the latest version.
        Please run `aqua info` command and paste the result.
        `aqua info` requires `aqua >= v2.10.0`.
      value: |
        ```console
        $ aqua info

        ```
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: Overview
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce
      description: |
        Please see [the guide](https://github.com/suzuki-shunsuke/oss-contribution-guide#write-good-how-to-reproduce) too.
        aqua.yaml should be not partial but complete configuration.
        Please remove unneeded configuration to reproduce the issue.
      value: |
        aqua.yaml

        ```yaml

        ```

        aqua-lock.json

        ```json
        ```

        Executed command and output

        ```console
        $
        ```
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
    validations:
      required: false
