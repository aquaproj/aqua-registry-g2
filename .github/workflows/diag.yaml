---
# Temporary. Asks GitHub what the branch app's token may do, and is deleted once it
# has answered.
name: diag
on: workflow_dispatch
permissions: {}
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ar2
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: branch_token
        with:
          app-id: ${{ vars.AR2_BRANCH_CLIENT_ID }}
          private-key: ${{ secrets.AR2_BRANCH_PRIVATE_KEY }}
      - name: What the token can reach
        env:
          GH_TOKEN: ${{ steps.branch_token.outputs.token }}
        run: |
          gh api /installation/repositories --jq '.repositories[].full_name'
      - name: Who the token is
        env:
          GH_TOKEN: ${{ steps.branch_token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" --jq '.[0].sha'
      - name: A blob, which needs contents write and nothing else
        env:
          GH_TOKEN: ${{ steps.branch_token.outputs.token }}
        run: |
          gh api -i -X POST "repos/$GITHUB_REPOSITORY/git/blobs" \
            -f content=diag -f encoding=utf-8 2>&1 | grep -iE "^HTTP|^x-accepted|^x-oauth|sha|message" | head -10
      - name: A tree holding a workflow file, which is what ar2 does
        env:
          GH_TOKEN: ${{ steps.branch_token.outputs.token }}
        run: |
          cat > tree.json <<'JSON'
          {"tree":[{"path":".github/workflows/test.yaml","mode":"100644","type":"blob","content":"name: t\non: pull_request\njobs: {}\n"}]}
          JSON
          gh api -i -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input tree.json 2>&1 \
            | grep -iE "^HTTP|^x-accepted|^x-oauth|sha|message" | head -10
      - name: A tree holding an ordinary file, for comparison
        env:
          GH_TOKEN: ${{ steps.branch_token.outputs.token }}
        run: |
          cat > tree2.json <<'JSON'
          {"tree":[{"path":"README.md","mode":"100644","type":"blob","content":"diag\n"}]}
          JSON
          gh api -i -X POST "repos/$GITHUB_REPOSITORY/git/trees" --input tree2.json 2>&1 \
            | grep -iE "^HTTP|^x-accepted|^x-oauth|sha|message" | head -10
