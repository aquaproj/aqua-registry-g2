---
name: main (workflow_call)
on: workflow_call
jobs:
  # What the pull request does to the packages under pkgs/.
  packages:
    uses: ./.github/workflows/wc_packages.yaml
    permissions:
      contents: read
      pull-requests: read

  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    steps:
      # The files at the root -- index.json and names.json -- and the pin. Not the
      # packages, which are most of the repository and none of what is read here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            aqua
      # ar2's own install, kept between runs: with it restored aqua neither downloads ar2 nor
      # verifies its attestation, which asks GitHub's API. Every pull request runs these jobs,
      # and verifying ar2 for each used up GITHUB_TOKEN's thousand requests an hour. Only ar2's
      # directory, so that a package a job tests is never restored rather than installed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
            ~/AppData/Local/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
          key: ar2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua/aqua.yaml', 'aqua/aqua-checksums.json') }}
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          packages: ar2
          # -a includes the global configuration, which is where ar2 is pinned.
          aqua_opts: -l -a
      # index.json is what 'aqua g' searches, and it arrives by a pull request that
      # merges itself. ar2 reads it as the type aqua reads, so a field aqua wouldn't
      # read is caught rather than ignored.
      - run: ar2 validate-index
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  aqua:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            aqua
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
      # Installing for real, not linking: it is the checksums that are being checked.
      # A pull request raising ar2's version without bringing aqua-checksums.json
      # along leaves the workflows unable to install anything, and this is what says
      # so before it merges rather than on the next run.
      - run: aqua install -a
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  # A skill whose front matter doesn't parse doesn't load, and nothing says so until
  # somebody asks for it. 'claude plugin validate' won't catch it: it validates a plugin,
  # and a tree of skill directories holds no manifest for it to find.
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .agents
            .claude
            .github
            aqua
            skills
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          aqua_opts: -l -a
      - run: bash .github/scripts/validate-skills.sh
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

