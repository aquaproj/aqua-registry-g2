---
name: main (workflow_call)
on: workflow_call
jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          packages: ar2
          # -a includes the global configuration, which is where ar2 is pinned.
          aqua_opts: -l -a
      # index.json is what 'aqua g' searches, and it arrives by a pull request that
      # merges itself. ar2 reads it as the type aqua reads, so a field aqua wouldn't
      # read is caught rather than ignored.
      - run: ar2 validate-index
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  aqua:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
      # Installing for real, not linking: it is the checksums that are being checked.
      # A pull request raising ar2's version without bringing aqua-checksums.json
      # along leaves the workflows unable to install anything, and this is what says
      # so before it merges rather than on the next run.
      - run: aqua install -a
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  # A skill whose front matter doesn't parse doesn't load, and nothing says so until
  # somebody asks for it. 'claude plugin validate' won't catch it: it validates a plugin,
  # and a tree of skill directories holds no manifest for it to find.
  skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          aqua_opts: -l -a
      - run: bash .github/scripts/validate-skills.sh
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          aqua_opts: -l -a
      - run: actionlint
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
