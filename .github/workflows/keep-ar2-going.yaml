---
name: keep ar2 going
# Start the chain of ar2 runs again when it has stopped and nobody stopped it. See
# .github/scripts/keep-chain.sh for what counts as stopped.
#
# After a run that didn't succeed, which is where a chain ends without meaning to: a run
# that was cancelled because it hit the job's timeout dispatches nothing. And on a
# schedule, for whatever else ends one -- a finite chain running out, or the restart after
# a streak of failures that is left to it. GitHub runs a schedule late, hours late at
# times, so this is the slow path; the first is the one that usually fires.
#
# To stop the chain, disable the ar2 workflow. To start it again, enable it: this starts
# a chain within the schedule's next run, or dispatch ar2 by hand for one now.
on:
  workflow_run:
    workflows:
      - ar2
    types:
      - completed
  schedule:
    - cron: "23 * * * *"
permissions: {}
# One check at a time, so two of them can't each find nothing going and both dispatch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  keep:
    if: github.event_name == 'schedule' || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Checking out main for the script.
      contents: read
      # Reading ar2's runs and dispatching it.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/keep-chain.sh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # The limit the chain has run with. A chain this starts is otherwise what one
          # started by hand would be.
          LIMIT: "10"
