---
name: ar2
# Run ar2 the way it is meant to run: as GitHub Actions, so that its commits are
# signed. A commit made through the Git data API is signed when the caller is
# GitHub Actions or a GitHub App, and left unsigned for a user access token, so a
# run from a laptop can't produce something a signature ruleset accepts.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: how many package versions to generate in this run
        required: false
        default: "2"
      log_level:
        description: how much the run says about what it is doing
        required: false
        default: info
      chain:
        description: how many more runs follow this one, or "forever"
        required: false
        default: "0"
permissions: {}
# One run at a time. The chain never makes two by itself -- a run dispatches its
# successor and the successor waits for it to finish -- but a dispatch by hand while a
# chain is going would, and two runs generating at once would take the same packages
# from the top of the same order.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    # Both app keys live here rather than at the repository level, so a workflow on
    # any other ref can't read them. The environment only lets main deploy to it.
    # One environment because a job may name only one, and this job mints both
    # tokens; handing one job's token to another isn't possible, as a secret is
    # masked out of job outputs.
    environment: ar2
    timeout-minutes: 30
    permissions:
      # Creating the package branch and committing to the head branch.
      contents: write
      # Opening the pull request and turning on auto-merge.
      pull-requests: write
      # Reading and writing the state. 'ar2 run' builds the state when the
      # container registry holds none and adds whatever aqua-registry has gained
      # since, so 'ar2 init' isn't part of a scheduled run.
      packages: write
      # Dispatching the next run of this workflow, and reading whether the runs
      # before this one failed.
      actions: write
      # Saying on the monitoring issue that the chain stopped.
      issues: write
    steps:
      # For aqua/aqua.yaml, which pins the ar2 version and its checksum. The
      # repository is only read here; ar2 does its own writing through the API with
      # the tokens below, so the checkout keeps no credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      # A separate token for creating package branches. Creating one has to get
      # past the ruleset requiring status checks, which a brand new branch can't
      # have; this app is a bypass actor for that ruleset. It holds no
      # pull-requests permission, so the bypass can't be turned into a way to
      # merge something unchecked.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: branch_token
        with:
          app-id: ${{ vars.AR2_BRANCH_CLIENT_ID }}
          private-key: ${{ secrets.AR2_BRANCH_PRIVATE_KEY }}
      # The token that commits to the head branch and opens the pull request. A pull
      # request opened or updated with GITHUB_TOKEN gets its checks in an
      # approval-required state, so nothing would run until someone pressed a button
      # and auto-merge would never fire. This app is a bypass actor for nothing: it
      # opens pull requests and that is all, so the checks still decide what merges.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr_token
        with:
          app-id: ${{ vars.AR2_PR_CLIENT_ID }}
          private-key: ${{ secrets.AR2_PR_PRIVATE_KEY }}
      - name: record when the run started
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: generate
        run: |
          ar2 run \
            --log-level "$LOG_LEVEL" \
            --limit "$LIMIT" \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_BRANCH_TOKEN: ${{ steps.branch_token.outputs.token }}
          AR2_PR_TOKEN: ${{ steps.pr_token.outputs.token }}
          LIMIT: ${{ inputs.limit }}
          LOG_LEVEL: ${{ inputs.log_level }}

      # The cadence is this, rather than a schedule. A workflow asking for every ten
      # minutes is triggered every few hours: aqua-registry's own updater, set to
      # "*/10 * * * *", ran eight times in the last day, three to five hours apart.
      # A run that dispatches the next one instead gives a cadence of however long a
      # run takes, which is what the limit was chosen for, and spends no time idle.
      #
      # It continues after a failure too. A rate limit or a repository that didn't
      # answer would otherwise stop the registry until somebody noticed, and what
      # noticing looks like is the paragraph below.
      #
      # Not after a cancellation, which is how a chain is stopped: cancel the run that is
      # going and no successor is dispatched. A job that hit its timeout counts as
      # cancelled too, so a run that got stuck ends the chain rather than handing the same
      # state to another run to get stuck on.
      - name: dispatch the next run
        if: ${{ !cancelled() && inputs.chain != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.generate.outcome }}
          STARTED_AT: ${{ steps.started.outputs.at }}
          CHAIN: ${{ inputs.chain }}
          LIMIT: ${{ inputs.limit }}
          LOG_LEVEL: ${{ inputs.log_level }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The issue whoever watches this repository gets the mail from.
          ISSUE: "105"
        run: bash .github/scripts/chain.sh
