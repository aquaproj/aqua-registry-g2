---
name: versions (workflow_call)
# Ask for a package branch's list of versions to be written again.
#
# Called by the push workflow on the package branch, and it does the one thing that branch
# can do: say which branch changed. The writing is somewhere else, because the app that may
# push onto a package branch has its key in the ar2 environment and only main may deploy to
# it -- a workflow running on a package branch, which is where a push workflow runs, can't
# read it, and letting it would mean that key being usable from every branch the registry
# generates.
#
# A repository_dispatch crosses that line without carrying anything over it. It is one of
# the two events GitHub raises even when GITHUB_TOKEN sends them, and the workflow it
# triggers is read from the default branch, so that workflow runs with main's secrets and
# this one needs none.
on: workflow_call
jobs:
  ask:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=versions \
            -F "client_payload[branch]=$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
