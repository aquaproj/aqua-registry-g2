---
# The checks of what a pull request does to the packages under pkgs/.
#
# A package's pull request is merged without a person reading it, so the trust in what was
# generated comes from here. Called from wc_main.yaml for every pull request into main; one
# that touches no package plans nothing and checks nothing.
name: packages (workflow_call)
on: workflow_call
jobs:
  # What to check and where. The jobs are worked out from the files rather than fixed
  # here: an entry for an environment nobody thought of would otherwise go unchecked,
  # which is the one thing a merge gate must not do.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
      files: ${{ steps.plan.outputs.files }}
      packages: ${{ steps.plan.outputs.packages }}
      template_defs: ${{ steps.templates.outputs.template_defs }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    permissions:
      contents: read
      # Reading which files the pull request touches.
      pull-requests: read
    steps:
      # The registry holds every package, so only what is read is checked out: the
      # tooling here, and the packages the pull request touches once they are known.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            aqua
      - id: plan
        run: bash .github/scripts/plan-packages.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
      - if: steps.plan.outputs.packages != ''
        run: echo "$PACKAGES" | xargs git sparse-checkout add
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
      # ar2's own install, kept between runs: with it restored aqua neither downloads ar2 nor
      # verifies its attestation, which asks GitHub's API. Every pull request runs these jobs,
      # and verifying ar2 for each used up GITHUB_TOKEN's thousand requests an hour. Only ar2's
      # directory, so that a package a job tests is never restored rather than installed.
      - if: steps.plan.outputs.packages != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
            ~/AppData/Local/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
          key: ar2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua/aqua.yaml', 'aqua/aqua-checksums.json') }}
      - if: steps.plan.outputs.packages != ''
        uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.67.0-lock.0
          packages: ar2
          # -a includes the global configuration. Without it the packages pinned there
          # are not linked and the command isn't found.
          aqua_opts: -l -a
      # The definition of every package the pull request touches, whatever else it
      # touches. It is the only thing that says which package a directory holds, and
      # nothing else on the way in reads it: one that had stopped being YAML merged, and
      # the package then generated nothing while a run said so in a log nobody was
      # watching. A package whose definition is gone is one being removed, and has none
      # to read.
      - if: steps.plan.outputs.packages != ''
        run: |
          for dir in $PACKAGES; do
            if [ -f "$dir/registry.yaml" ]; then
              ar2 validate-definition "$dir/registry.yaml"
            fi
          done
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
      # Packages served as templates: what a pull request may do to them, and which of
      # their definitions to install. Not for the catalogue's pull request, which carries
      # the templates rendered from definitions already merged and is checked below.
      - id: templates
        if: steps.plan.outputs.packages != '' && github.head_ref != 'ar2_index'
        run: bash .github/scripts/check-templates.sh
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
      # The templates the catalogue's pull request writes or removes have to be exactly
      # what ar2 renders from the definitions beside them, which are the merged ones here:
      # the checkout is the pull request merged into main.
      - if: steps.plan.outputs.templates != ''
        run: echo "$TEMPLATES" | xargs ar2 validate-templates
        env:
          TEMPLATES: ${{ steps.plan.outputs.templates }}
      - if: steps.plan.outputs.count == '0' && steps.templates.outputs.template_defs == ''
        run: echo "This pull request adds or changes no generated registry file and no template to install." >> "$GITHUB_STEP_SUMMARY"
      # One job per environment the files describe, on a machine of that environment.
      # An environment with no runner to answer for it fails here rather than being
      # passed over quietly.
      #
      # Except darwin, whose two environments share one macOS machine. ar2 test runs no
      # binary it checks -- it downloads, hashes, opens and verifies signatures -- so an
      # amd64 entry tells an arm64 Mac nothing it wouldn't tell an Intel one, and macOS is
      # the runner every pull request queues for: a darwin job ran for half a minute and
      # waited five to twenty for a machine. Environments sharing a runner are one job,
      # which checks each of them in turn.
      #
      # An Intel Mac rather than an arm64 one. GitHub is short of macOS arm64 machines:
      # jobs on macos-15 waited over an hour and were cancelled as "not acquired by Runner
      # of type hosted even after multiple attempts", with the annotation "Due to capacity
      # constraints, jobs targeting macOS arm64 runners may experience longer queue times".
      # Since nothing checked is run, either kind of Mac answers for both environments.
      #
      # A template's environments are what its test_versions expand to, worked out the
      # same way.
      - id: matrix
        if: steps.plan.outputs.count != '0' || steps.templates.outputs.template_defs != ''
        run: |
          # The environments are written to a file first rather than read from ar2 as it
          # runs: a process substitution's exit status is lost, and ar2 failing would read
          # as no environment at all.
          : > envs.txt
          if [ -n "${FILES// /}" ]; then
            echo "$FILES" | xargs ar2 test --environments >> envs.txt
            if [ ! -s envs.txt ]; then
              echo "::error::the files describe no environment to check them on"
              exit 1
            fi
          fi
          for def in $TEMPLATE_DEFS; do
            ar2 test --template --environments "$def" > template_envs.txt
            if [ ! -s template_envs.txt ] && [ "$(yq '(.template.skip_test // "") != ""' "$def")" != true ]; then
              echo "::error::$def: its test_versions expand to no environment to install them on"
              exit 1
            fi
            cat template_envs.txt >> envs.txt
          done
          : > matrix.jsonl
          while read -r env; do
            os=${env%%/*}
            arch=${env##*/}
            case "$env" in
              linux/amd64) runner=ubuntu-26.04 ;;
              linux/arm64) runner=ubuntu-26.04-arm ;;
              darwin/amd64) runner=macos-26-intel ;;
              darwin/arm64) runner=macos-26-intel ;;
              windows/amd64) runner=windows-2025 ;;
              windows/arm64) runner=windows-11-arm ;;
              *)
                echo "::error::no runner answers for $env, so its entry can't be checked"
                exit 1
                ;;
            esac
            jq -n -c --arg env "$env" --arg os "$os" --arg arch "$arch" --arg runner "$runner" \
              '{env: $env, os: $os, arch: $arch, runner: $runner}' >> matrix.jsonl
          done < envs.txt
          if [ ! -s matrix.jsonl ]; then
            # Only templates, each with skip_test: none of their versions is installed here.
            echo "No environment to install anything on: every template says why CI installs none of its versions." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          matrix=$(jq -s -c 'unique | group_by(.runner) | map({env: (map(.env) | join(" ")), os: .[0].os, arch: (map(.arch) | join(" ")), runner: .[0].runner})' matrix.jsonl)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"
        env:
          FILES: ${{ steps.plan.outputs.files }}
          TEMPLATE_DEFS: ${{ steps.templates.outputs.template_defs }}
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      # How much of GITHUB_TOKEN's budget the repository has used, as one line. The budget is
      # the whole repository's, so a job's cost is the difference between lines read while
      # nothing else runs. Read after the job's requests: a token that hasn't made a request
      # yet answers with a window of its own (core=0). Asking rate_limit costs nothing.
      #
      # A run step rather than a local action: a '$/' action made every job download the whole
      # registry, pkgs/ included, in "Set up job".
      - if: always()
        continue-on-error: true
        run: |
          gh api rate_limit --jq '"api-budget end core=\(.resources.core.used)/\(.resources.core.limit) graphql=\(.resources.graphql.used)/\(.resources.graphql.limit) reset=\(.resources.core.reset)"'
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        # The Windows runners default to PowerShell, and these steps are written for
        # the shell the other runners use.
        shell: bash
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            aqua
      - run: echo "$PACKAGES" | xargs git sparse-checkout add
        env:
          PACKAGES: ${{ needs.plan.outputs.packages }}
      # ar2's own install, kept between runs: with it restored aqua neither downloads ar2 nor
      # verifies its attestation, which asks GitHub's API. Every pull request runs these jobs,
      # and verifying ar2 for each used up GITHUB_TOKEN's thousand requests an hour. Only ar2's
      # directory, so that a package a job tests is never restored rather than installed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
            ~/AppData/Local/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
          key: ar2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua/aqua.yaml', 'aqua/aqua-checksums.json') }}
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.67.0-lock.0
          packages: ar2
          aqua_opts: -l -a
      # The entries of this environment, on a machine of this environment, a package at a
      # time: the package's name is read from its definition, and it is what an
      # attestation is verified against. A job for more than one architecture -- darwin's --
      # checks each in turn.
      - run: |
          for dir in $PACKAGES; do
            files=()
            for file in $FILES; do
              case $file in
                "$dir"/*) files+=("$file") ;;
              esac
            done
            if [ "${#files[@]}" -eq 0 ]; then
              continue
            fi
            for arch in $ARCHS; do
              ar2 test --definition "$dir/registry.yaml" --os "$OS" --arch "$arch" "${files[@]}"
            done
          done
          # A package served as a template has no generated file: its test_versions are
          # expanded the way aqua expands them and installed, as a pkg.yaml is in
          # aqua-registry.
          for def in $TEMPLATE_DEFS; do
            for arch in $ARCHS; do
              ar2 test --template --os "$OS" --arch "$arch" "$def"
            done
          done
        env:
          OS: ${{ matrix.os }}
          ARCHS: ${{ matrix.arch }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
          FILES: ${{ needs.plan.outputs.files }}
          TEMPLATE_DEFS: ${{ needs.plan.outputs.template_defs }}
          # Verifying an attestation asks GitHub about the artifact, and downloading
          # assets without a token runs into the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      # How much of GITHUB_TOKEN's budget the repository has used, as one line. The budget is
      # the whole repository's, so a job's cost is the difference between lines read while
      # nothing else runs. Read after the job's requests: a token that hasn't made a request
      # yet answers with a window of its own (core=0). Asking rate_limit costs nothing.
      #
      # A run step rather than a local action: a '$/' action made every job download the whole
      # registry, pkgs/ included, in "Set up job".
      - if: always()
        continue-on-error: true
        run: |
          gh api rate_limit --jq '"api-budget end core=\(.resources.core.used)/\(.resources.core.limit) graphql=\(.resources.graphql.used)/\(.resources.graphql.limit) reset=\(.resources.core.reset)"'
        env:
          GH_TOKEN: ${{ github.token }}

  # The pull request rewriting every published file. See ar2 rewrite --verify.
  rewrite:
    if: github.head_ref == 'ar2_rewrite'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      AQUA_GLOBAL_CONFIG: ${{ github.workspace }}/aqua/aqua.yaml
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            aqua
      # ar2's own install, kept between runs: with it restored aqua neither downloads ar2 nor
      # verifies its attestation, which asks GitHub's API. Every pull request runs these jobs,
      # and verifying ar2 for each used up GITHUB_TOKEN's thousand requests an hour. Only ar2's
      # directory, so that a package a job tests is never restored rather than installed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
            ~/AppData/Local/aquaproj-aqua/pkgs/github_release/github.com/aquaproj/ar2
          key: ar2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('aqua/aqua.yaml', 'aqua/aqua-checksums.json') }}
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.67.0-lock.0
          packages: ar2
          aqua_opts: -l -a
      # Every definition and registry.json in the pull request has to be exactly what
      # rewriting the base gives, and every versions.json what its files give.
      #
      # The base is where the pull request branched off, not the base branch's tip: a version
      # merged since is on main and not in the pull request, which says nothing about it.
      - run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          ar2 rewrite --verify --base "$base" --head "$HEAD_SHA" \
            --g2-owner "${GITHUB_REPOSITORY%/*}" --g2-repo "${GITHUB_REPOSITORY#*/}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      # How much of GITHUB_TOKEN's budget the repository has used, as one line. The budget is
      # the whole repository's, so a job's cost is the difference between lines read while
      # nothing else runs. Read after the job's requests: a token that hasn't made a request
      # yet answers with a window of its own (core=0). Asking rate_limit costs nothing.
      #
      # A run step rather than a local action: a '$/' action made every job download the whole
      # registry, pkgs/ included, in "Set up job".
      - if: always()
        continue-on-error: true
        run: |
          gh api rate_limit --jq '"api-budget end core=\(.resources.core.used)/\(.resources.core.limit) graphql=\(.resources.graphql.used)/\(.resources.graphql.limit) reset=\(.resources.core.reset)"'
        env:
          GH_TOKEN: ${{ github.token }}
