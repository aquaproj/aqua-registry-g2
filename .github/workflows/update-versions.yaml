---
name: update-versions
# Keep each package's versions.json in step with its versions directory.
#
# ar2 opens a pull request per version, and none of them writes the package's versions.json:
# the list records the sha of the versions directory it was made from, so two pull requests
# open for one package would conflict on it. A merge adding a version leaves the list behind,
# and this brings the lists up to date, in one pull request from ar2_versions that merges
# itself.
#
# Which lists are behind is asked of main as it is, for every package, by ar2: a list whose
# source isn't the sha of its versions directory. Nothing is remembered between runs, so a run
# that was cancelled, or a push that raised none, is caught by whichever run comes next.
#
# The pull request only changes lists, so it raises no run of its own: the push it merges
# touches no versions directory.
on:
  push:
    branches:
      - main
    paths:
      - pkgs/*/*/versions/**
  # What catches a push that raised no run at all. GitHub doesn't always: cheat/cheat 4.1.1
  # merged seconds after 4.2.0 and no workflow ran for it. The odd minutes are to stay off the
  # top of the hour, when everyone else's schedule is.
  schedule:
    - cron: "19,49 * * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: ids of the packages whose lists to make again, separated by spaces; empty checks every package
        required: false
        default: ""
permissions: {}
# One at a time. Two runs commit to the same branch, and the second adds to what the first
# put there. GitHub keeps one pending run per group and cancels the one before it, which loses
# nothing: every run checks every package.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  update-versions:
    runs-on: ubuntu-24.04
    # The environment of the catalogue's update, which holds the pull request key alone. This
    # is the same kind of pull request: made from what the default branch holds, and merged
    # by its checks.
    environment: index
    timeout-minutes: 15
    permissions:
      # Turning auto-merge on for the pull request, which is done with this token rather than
      # the pull request app's and needs both.
      contents: write
      pull-requests: write
    steps:
      # For aqua/aqua.yaml, which pins the ar2 version and its checksum. Nothing else is read
      # from the checkout, so only that is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: aqua
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          packages: ar2
      # The token that commits the lists and opens their pull request. A pull request opened
      # or updated with GITHUB_TOKEN gets its checks in an approval-required state.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr_token
        with:
          client-id: ${{ vars.AR2_PR_CLIENT_ID }}
          private-key: ${{ secrets.AR2_PR_PRIVATE_KEY }}
      - run: |
          # Every package's list is checked when no packages are named: ar2 finds the ones
          # behind from what main holds, so nothing has to be worked out here or remembered
          # between runs.
          read -r -a ids <<< "$PACKAGES"
          ar2 update-versions \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}" \
            "${ids[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_PR_TOKEN: ${{ steps.pr_token.outputs.token }}
          PACKAGES: ${{ inputs.packages }}
