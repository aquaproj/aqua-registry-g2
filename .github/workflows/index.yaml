---
name: index
# Keep index.json in step with the definitions.
#
# 'ar2 run' adds a package to the catalogue as it takes it over, which is the one
# moment a package can be new to it. This is the reconciliation: it reads every
# package's definition and makes the catalogue say what they say. Two things that
# catches -- a package whose run failed after committing its definition, or whose
# pull request was never merged, which the catalogue is missing; and a package whose
# definition was edited after its entry was made, which the catalogue describes as it
# was. Nothing else would notice either.
#
# A definition merging asks for it, so the catalogue follows a package by about a minute
# rather than by however long GitHub takes to answer the schedule -- which here has been a
# few hours. The schedule stays as what catches a merge this missed.
#
# It reads each package's directory, named after the package's id, and takes the
# package's name out of the definition in it, because an id says nothing about which
# package it is. A definition holding nothing but a claim to a package is waiting for the
# pull request that brings the rest of it, and there is nothing to describe the package
# with until then.
on:
  # Every half hour rather than every hour. A scheduled workflow runs when GitHub
  # gets to it, which at the top of the hour is when everyone else asked too, so an
  # hourly schedule spends a good deal of its time more than an hour apart. The odd
  # minutes are for the same reason.
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: packages whose entries to read out of their definitions again, separated by spaces; empty reconciles the whole catalogue
        required: false
        default: ""
  # A definition changing on main. What runs is the reconciliation, which reads the
  # package's name out of the definition in the first place. The merge that pushes it is
  # the pull request app's, since a push GITHUB_TOKEN made raises no workflow run.
  push:
    branches:
      - main
    paths:
      - pkgs/*/*/registry.yaml
permissions: {}
# One at a time. Two reconciliations commit the same catalogue to the same branch, and the
# second would reset what the first put there. Queued rather than cancelled in flight: a
# run that comes after sees everything the one before it did.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-24.04
    # Its own environment, holding the pull request key alone.
    environment: index
    timeout-minutes: 15
    permissions:
      # Committing the catalogue to the update branch.
      contents: write
      # Opening the pull request.
      pull-requests: write
    steps:
      # For aqua/aqua.yaml, which pins the ar2 version and its checksum.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          packages: ar2
      # The token that commits the catalogue and opens its pull request. A pull
      # request opened or updated with GITHUB_TOKEN gets its checks in an
      # approval-required state, and this one is added to on every run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr_token
        with:
          client-id: ${{ vars.AR2_PR_CLIENT_ID }}
          private-key: ${{ secrets.AR2_PR_PRIVATE_KEY }}
      - run: |
          # The packages are one field and each is its own argument, so they are split on
          # spaces rather than interpolated into the command line. Empty leaves the
          # arguments off, which is the reconciliation the schedule runs.
          args=()
          for package in $PACKAGES; do
            args+=("$package")
          done
          ar2 index \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}" \
            "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_PR_TOKEN: ${{ steps.pr_token.outputs.token }}
          PACKAGES: ${{ inputs.packages }}
