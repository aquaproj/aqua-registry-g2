---
name: index
# Keep index.json in step with the package branches.
#
# 'ar2 run' adds a package to the catalogue as it takes it over, which is the one
# moment a package can be new to it. This is the reconciliation: it reads every
# branch's definition and makes the catalogue say what they say. Two things that
# catches -- a package whose run failed after committing its definition, or whose
# pull request was never merged, which the catalogue is missing; and a package whose
# definition was edited after its entry was made, which the catalogue describes as it
# was. Nothing else would notice either.
#
# It runs on demand here. It belongs on a schedule in the real registry, where nobody
# is watching for a package that quietly never arrived.
#
# It reads the branches named after a package's id and takes each package's name out of
# the definition on its branch, because a branch named after an id says nothing about
# which package it holds. A branch holding nothing but its claim to a package -- which is
# what a branch is created with -- is waiting for the pull request that brings its
# definition, and there is nothing to describe the package with until then.
#
# Not a create event: GitHub reads the workflow from the ref that was created, and a
# package branch is an orphan carrying only the branch template. index.yaml lives on
# main and would never be there, so the event fires and nothing runs.
on:
  # Every half hour rather than every hour. A scheduled workflow runs when GitHub
  # gets to it, which at the top of the hour is when everyone else asked too, so an
  # hourly schedule spends a good deal of its time more than an hour apart. The odd
  # minutes are for the same reason.
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: packages whose entries to read out of their definitions again, separated by spaces; empty reconciles the whole catalogue
        required: false
        default: ""
permissions: {}
jobs:
  index:
    runs-on: ubuntu-24.04
    # Its own environment, holding the pull request key alone. This workflow never
    # creates a package branch, so it has no business reaching the key that bypasses
    # the ruleset guarding them.
    environment: index
    timeout-minutes: 15
    permissions:
      # Committing the catalogue to the update branch.
      contents: write
      # Opening the pull request.
      pull-requests: write
    steps:
      # For aqua/aqua.yaml, which pins the ar2 version and its checksum.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.64.0
          packages: ar2
      # The token that commits the catalogue and opens its pull request. A pull
      # request opened or updated with GITHUB_TOKEN gets its checks in an
      # approval-required state, and this one is added to on every run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: pr_token
        with:
          client-id: ${{ vars.AR2_PR_CLIENT_ID }}
          private-key: ${{ secrets.AR2_PR_PRIVATE_KEY }}
      - run: |
          # The packages are one field and each is its own argument, so they are split on
          # spaces rather than interpolated into the command line. Empty leaves the
          # arguments off, which is the reconciliation the schedule runs.
          args=()
          for package in $PACKAGES; do
            args+=("$package")
          done
          ar2 index \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}" \
            "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_PR_TOKEN: ${{ steps.pr_token.outputs.token }}
          PACKAGES: ${{ inputs.packages }}
