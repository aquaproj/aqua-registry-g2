---
# Ask for the catalogue to be read out of this definition again, after it changes.
#
# A push workflow is read from the branch that was pushed, so this has to be on the package
# branch itself rather than on main. It is copied here when the branch is created and is
# never updated again, which is why it holds nothing but the call: what it calls lives on
# main, where it can be improved for every package at once.
#
# Don't add jobs to this file. Add them to wc_index.yaml on main.
name: index
on:
  push:
    # This branch, and not the head branch of a pull request for it: a head branch holds
    # the definition too, and the catalogue describes what has merged.
    branches:
      - pkg_*
    # The definition, which is what the catalogue is read out of. The versions aren't in
    # it, and versions.json isn't either.
    paths:
      - registry.yaml
permissions: {}
jobs:
  index:
    # The full form rather than a relative path, which would resolve against this branch.
    uses: aquaproj/aqua-registry-g2/.github/workflows/wc_index.yaml@main
    permissions:
      # Asking for the catalogue to be read again, which is a repository_dispatch.
      contents: write
  # Don't add jobs to this file. Add them to wc_index.yaml on main.
