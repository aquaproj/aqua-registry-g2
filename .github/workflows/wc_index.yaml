---
name: index (workflow_call)
# Ask for the catalogue to be read out of the definitions again.
#
# Called by the push workflow on a package branch when its definition changes, and it does
# the one thing that branch can do: say that something did. The reading is somewhere else,
# because the key that opens the catalogue's pull request is in the index environment and
# only main may deploy to it -- a workflow running on a package branch, which is where a
# push workflow runs, can't reach it.
#
# A repository_dispatch crosses that line without carrying anything over it, and is one of
# the two events GitHub raises even when GITHUB_TOKEN sends them.
on: workflow_call
jobs:
  ask:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=index
        env:
          GH_TOKEN: ${{ github.token }}
