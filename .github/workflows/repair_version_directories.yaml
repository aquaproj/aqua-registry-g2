---
name: repair version directories
# Move the version directories written before a version was escaped.
#
# A version directory is the version with every byte outside [A-Za-z0-9.-] written as an
# underscore and two hex digits, so WebAssembly/binaryen's version_133 is held at
# versions/version_5f133. Five directories were written under the tag as it is, and aqua
# asking for version_133 looks for the escaped name, finds nothing, and can't install the
# package from the registry at all.
#
# Dispatched by hand, and temporary. Nothing writes an unescaped directory any more, so
# once this has run there is nothing left for it to find and both it and its script go.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: say what would be moved without moving it
        type: boolean
        required: false
        default: true
permissions: {}
# Never alongside something else writing to the package branches: a push onto a branch
# another run has just moved would be rejected.
concurrency:
  group: ar2
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    # The app key lives here rather than at the repository level, so a workflow on any
    # other ref can't read it. The environment only lets main deploy to it.
    environment: ar2
    timeout-minutes: 30
    permissions:
      # Reading the branches and their trees. The writing is the app's.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app that bypasses the pull request requirement on the package branches, which
      # is what lets the move be pushed onto one. It holds no pull-requests permission, so
      # the bypass can't be turned into a way to merge something unchecked.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: branch_token
        with:
          client-id: ${{ vars.AR2_BRANCH_CLIENT_ID }}
          private-key: ${{ secrets.AR2_BRANCH_PRIVATE_KEY }}
      - run: python3 .github/workflows/repair_version_directories.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_BRANCH_TOKEN: ${{ steps.branch_token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
