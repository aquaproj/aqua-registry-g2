---
name: versions
# Keep each package branch's list of the versions it holds.
#
# A package's versions are the directories on its branch, so listing them means reading
# the branch's tree and then a file per version to learn anything about them. versions.json
# is that list as one object, with the date each release was published and the digest of
# the file the registry serves, which is what a reader choosing a version needs.
#
# A sweep from here rather than a workflow on each package branch. The app key lives in
# this repository's ar2 environment, which only main may deploy to, and a workflow running
# on a package branch couldn't read it; letting it would mean the key being usable from
# every branch the registry generates. The lists are instead kept from main, which is
# where everything else that writes runs.
on:
  # Every half hour, on the odd minutes, for the reason index.yaml gives: a schedule runs
  # when GitHub gets to it, and the top of the hour is when everyone else asked too.
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: packages to write, separated by spaces; empty is every package
        required: false
        default: ""
      limit:
        description: how many branches this run writes to, 0 for as many as there are
        required: false
        default: "0"
      dry_run:
        description: say what would be written without writing it
        type: boolean
        required: false
        default: false
      log_level:
        description: how much the run says about what it is doing
        required: false
        default: info
permissions: {}
# The ar2 group, because this writes to the package branches and so does a generating run.
# A push onto a branch the other has just moved would be rejected, and the list would be
# written by the next sweep instead of now.
concurrency:
  group: ar2
  cancel-in-progress: false
jobs:
  versions:
    runs-on: ubuntu-24.04
    # The app key lives here rather than at the repository level, so a workflow on any
    # other ref can't read it. The environment only lets main deploy to it.
    environment: ar2
    timeout-minutes: 30
    permissions:
      # Reading aqua/aqua.yaml for the ar2 version. The writing is the app's, through the
      # API.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
      # The app that bypasses the pull request requirement on the package branches, which
      # is what lets a list be pushed onto one. It holds no pull-requests permission, so
      # the bypass can't be turned into a way to merge something unchecked.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: branch_token
        with:
          client-id: ${{ vars.AR2_BRANCH_CLIENT_ID }}
          private-key: ${{ secrets.AR2_BRANCH_PRIVATE_KEY }}
      - run: |
          # The packages are one field and each is its own argument, so they are split on
          # spaces rather than interpolated into the command line. Empty leaves the
          # arguments off, which is every package.
          args=()
          for package in $PACKAGES; do
            args+=("$package")
          done
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          ar2 versions \
            --log-level "$LOG_LEVEL" \
            --limit "$LIMIT" \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}" \
            "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_BRANCH_TOKEN: ${{ steps.branch_token.outputs.token }}
          PACKAGES: ${{ inputs.packages }}
          LIMIT: ${{ inputs.limit || 0 }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
