---
name: dates
# Fill in, for the versions the registry already holds, when the release each came
# from was published. registry.json says it from ar2 v0.5.0 on; the files written
# before that don't, and nothing can work it out from them.
#
# Dispatched by hand rather than scheduled. It is for the files written before the
# field existed, so it has an end: once every package is filled in a run reads the
# registry, finds nothing, and writes nothing.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: packages to fill in, separated by spaces; empty is every package
        required: false
        default: ""
      limit:
        description: how many packages this run writes to, 0 for as many as there are
        required: false
        default: "0"
      dry_run:
        description: say what would be written without writing it
        type: boolean
        required: false
        default: false
      log_level:
        description: how much the run says about what it is doing
        required: false
        default: info
permissions: {}
# One run at a time, and never alongside a generating run: both write to the package
# branches, and a push onto a branch another run has just moved would be rejected and
# the package left half filled in.
concurrency:
  group: ar2
  cancel-in-progress: false
jobs:
  dates:
    runs-on: ubuntu-24.04
    # The app key lives here rather than at the repository level, so a workflow on any
    # other ref can't read it. The environment only lets main deploy to it.
    environment: ar2
    timeout-minutes: 30
    permissions:
      # Reading aqua/aqua.yaml for the ar2 version. The writing is the app's, through
      # the API.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.64.0
      # The app that bypasses the pull request requirement on the package branches,
      # which is what lets a date be pushed onto one. It holds no pull-requests
      # permission, so the bypass can't be turned into a way to merge something
      # unchecked.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: branch_token
        with:
          client-id: ${{ vars.AR2_BRANCH_CLIENT_ID }}
          private-key: ${{ secrets.AR2_BRANCH_PRIVATE_KEY }}
      - run: |
          # The packages are one field and each is its own argument, so they are split
          # on spaces rather than interpolated into the command line. Empty leaves the
          # arguments off, which is every package.
          args=()
          for package in $PACKAGES; do
            args+=("$package")
          done
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          ar2 dates \
            --log-level "$LOG_LEVEL" \
            --limit "$LIMIT" \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}" \
            "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_BRANCH_TOKEN: ${{ steps.branch_token.outputs.token }}
          PACKAGES: ${{ inputs.packages }}
          LIMIT: ${{ inputs.limit }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOG_LEVEL: ${{ inputs.log_level }}
