---
name: close-issues
# Close the issues ar2 opened once what they are about is resolved.
#
# A run opens an issue per package for the environments a version was published without
# (missing-environment), for the versions a check of integrity stopped (integrity), and for the
# versions that keep failing for a reason that should pass (transient-failure), and writes into
# it what it is about. 'ar2 close-issues' asks the registry about each, and
# closes an issue whose every version and environment is resolved.
#
# What resolves one is a version merging: an environment put back by 'ar2 regenerate', or a
# stopped version published.
#
# On a schedule rather than on every push touching a versions directory. A run reads every
# open issue's comments and a registry.json per version they record, one REST call each, on
# GITHUB_TOKEN's budget, which is the whole repository's. While the chain of ar2 runs merges
# a version every few seconds, a run on each push meant a run all the time: three of them
# took most of 800 calls in two minutes. An issue closing within the hour is soon enough.
#
# Hourly by a chain rather than by the schedule alone: GitHub ran the hourly cron every five
# to eight hours (03:56 and then nothing until after 09:00 on 2026-11-23), and fixed issues
# stayed open that long. Each run waits out the hour from its start in the next job and then
# dispatches the next run. The schedule stays as the fallback that starts a chain again if
# one stops: a scheduled run that comes while a run is going waits as the pending run, and the
# next job leaves the dispatch to it, so the two don't make two chains. To stop the chain,
# disable this workflow. The odd minute keeps off the top of the hour and off index and update-versions.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}
permissions: {}
# One at a time, so that two runs don't comment on the same issue twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  close-issues:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # Reading the identities and what the registry serves.
      contents: read
      # Commenting on the issues and closing them.
      issues: write
    steps:
      # For aqua/aqua.yaml, which pins the ar2 version and its checksum.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
        with:
          aqua_version: v2.67.0-lock.0
          packages: ar2
      - run: |
          ar2 close-issues \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # How much of GITHUB_TOKEN's budget the repository has used, as one line. The budget is
      # the whole repository's, so a job's cost is the difference between lines read while
      # nothing else runs. Read after the job's requests: a token that hasn't made a request
      # yet answers with a window of its own (core=0). Asking rate_limit costs nothing.
      #
      # A run step rather than a local action: a '$/' action made every job download the whole
      # registry, pkgs/ included, in "Set up job".
      - if: always()
        continue-on-error: true
        run: |
          gh api rate_limit --jq '"api-budget end core=\(.resources.core.used)/\(.resources.core.limit) graphql=\(.resources.graphql.used)/\(.resources.graphql.limit) reset=\(.resources.core.reset)"'
        env:
          GH_TOKEN: ${{ github.token }}
  # Waits out the hour from the run's start and dispatches the next run. It runs after a
  # failure, a timeout or a cancellation of close-issues alike, so that one bad run doesn't
  # leave the issues to the schedule.
  next:
    needs: close-issues
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    permissions:
      # Reading this run's start and the runs waiting, and dispatching the next run.
      actions: write
    steps:
      - name: wait out the hour and dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .run_started_at)
          elapsed=$(($(date +%s) - $(date -d "$started" +%s)))
          if [ "$elapsed" -lt 3600 ]; then
            sleep $((3600 - elapsed))
          fi
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/close-issues.yaml" --jq .state)
          if [[ $state == disabled* ]]; then
            echo "close-issues is disabled; the chain stops here" >&2
            exit 0
          fi
          # A run already waiting -- one dispatched by hand or by the schedule -- goes next and
          # dispatches its own successor. Dispatching here would cancel it.
          waiting=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow close-issues.yaml \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [ "$waiting" != 0 ]; then
            echo "a close-issues run is already waiting; it goes next" >&2
            exit 0
          fi
          gh workflow run close-issues.yaml --repo "$GITHUB_REPOSITORY"
