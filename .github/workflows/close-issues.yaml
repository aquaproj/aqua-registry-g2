---
name: close-issues
# Close the issues ar2 opened once what they are about is resolved.
#
# A run opens an issue per package for the environments a version was published without
# (missing-environment), for the versions a check of integrity stopped (integrity), and for the
# versions that keep failing for a reason that should pass (transient-failure), and writes into
# it what it is about. 'ar2 close-issues' asks the registry about each, and
# closes an issue whose every version and environment is resolved.
#
# What resolves one is a version merging: an environment put back by 'ar2 regenerate', or a
# stopped version published.
#
# On a schedule rather than on every push touching a versions directory. A run reads every
# open issue's comments and a registry.json per version they record, one REST call each, on
# GITHUB_TOKEN's budget, which is the whole repository's. While the chain of ar2 runs merges
# a version every few seconds, a run on each push meant a run all the time: three of them
# took most of 800 calls in two minutes. An issue closing within the hour is soon enough.
# The odd minute keeps off the top of the hour and off index and update-versions.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch: {}
permissions: {}
# One at a time, so that two runs don't comment on the same issue twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  close-issues:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # Reading the identities and what the registry serves.
      contents: read
      # Commenting on the issues and closing them.
      issues: write
    steps:
      # For aqua/aqua.yaml, which pins the ar2 version and its checksum.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.67.0-lock.0
          packages: ar2
      - run: |
          ar2 close-issues \
            --g2-owner "${GITHUB_REPOSITORY%/*}" \
            --g2-repo "${GITHUB_REPOSITORY#*/}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # How much of GITHUB_TOKEN's budget the repository has used. See the action.
      - uses: $/.github/actions/measure-rate-limit
        if: always()
        continue-on-error: true
