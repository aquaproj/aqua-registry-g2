---
# The checks a pull request into main has to pass.
#
# Don't add jobs to this file. Add them to wc_main.yaml.
name: test
on:
  pull_request:
    # Not labeled or unlabeled: no label is read, and a run for one would leave a skipped
    # status-check-main, which GitHub reads as a pass. Not auto_merge_enabled or
    # auto_merge_disabled either: whether auto-merge is on isn't read, and a run for one
    # started beside the one for opened cancels it, which fails status-check-main.
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/wc_main.yaml
    permissions:
      contents: read
      # Reading which files the pull request touches.
      pull-requests: read
  # The one check the ruleset requires.
  status-check-main:
    runs-on: ubuntu-26.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - test
    steps:
      - run: exit 1
  # Don't add jobs to this file. Add them to wc_main.yaml.
