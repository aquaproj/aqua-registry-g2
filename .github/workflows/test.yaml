---
# The checks a pull request into main has to pass.
#
# Don't add jobs to this file. Add them to wc_main.yaml.
name: test
on:
  pull_request:
    # Not labeled or unlabeled. A run for a label would skip every job, and its skipped
    # status-check-main would be the newest, which GitHub reads as a pass: putting any label
    # on a failing pull request would have made it mergeable. replaces-published, the one
    # label the checks read, re-runs this workflow from replaces_published.yaml instead.
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/wc_main.yaml
    permissions:
      contents: read
      # Reading which files the pull request touches, and who labelled it.
      pull-requests: read
      issues: read
  # The one check the ruleset requires.
  status-check-main:
    runs-on: ubuntu-24.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - test
    steps:
      - run: exit 1
  # Don't add jobs to this file. Add them to wc_main.yaml.
