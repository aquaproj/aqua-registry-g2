---
# The checks a pull request into main has to pass.
#
# Don't add jobs to this file. Add them to wc_main.yaml.
name: test
on:
  pull_request:
    # auto_merge_enabled and auto_merge_disabled too: a pull request that changes a published
    # file may not merge itself, so turning auto-merge on has to be checked again. Not
    # labeled or unlabeled: no label is read, and a run for one would leave a skipped
    # status-check-main, which GitHub reads as a pass.
    types: [opened, synchronize, reopened, auto_merge_enabled, auto_merge_disabled]
permissions: {}
concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/wc_main.yaml
    permissions:
      contents: read
      # Reading which files the pull request touches, and whether it is set to merge itself.
      pull-requests: read
  # The one check the ruleset requires.
  status-check-main:
    runs-on: ubuntu-24.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - test
    steps:
      - run: exit 1
  # Don't add jobs to this file. Add them to wc_main.yaml.
