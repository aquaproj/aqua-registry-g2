---
# The checks a pull request into main has to pass.
#
# Don't add jobs to this file. Add them to wc_main.yaml.
name: test
on:
  pull_request:
    # labeled and unlabeled too: replaces-published is put on after the pull request is
    # opened, and the check that reads it has to run again when it is.
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions: {}
# Any other label put on or taken off is nothing to check, and ar2 labels every pull request
# it opens a moment after opening it. Such a run gets a group of its own, so that it doesn't
# cancel the run the pull request was opened with -- a cancelled run's status-check-main
# fails, and a failure blocks the merge whatever the run beside it says -- and it skips
# every job.
concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}--${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'replaces-published' && github.run_id || 'checks' }}
  cancel-in-progress: true
jobs:
  test:
    if: (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'replaces-published'
    uses: ./.github/workflows/wc_main.yaml
    permissions:
      contents: read
      # Reading which files the pull request touches, and who labelled it.
      pull-requests: read
      issues: read
  # The one check the ruleset requires.
  status-check-main:
    runs-on: ubuntu-24.04
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 10
    permissions: {}
    needs:
      - test
    steps:
      - run: exit 1
  # Don't add jobs to this file. Add them to wc_main.yaml.
