---
name: distribute the versions caller
# Put the versions caller on the package branches that haven't got it.
#
# A push workflow is read from the branch that was pushed, so the one asking for a
# branch's list of versions has to be on that branch. New branches get it from the
# template; this is for the branches that existed before the template did.
#
# Dispatched by hand, and temporary. Once every branch has it there is nothing for this to
# find, and it goes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: say which branches would be written to without writing
        type: boolean
        required: false
        default: true
permissions: {}
# Never alongside something else writing to the package branches: a push onto a branch
# another run has just moved would be rejected.
concurrency:
  group: ar2
  cancel-in-progress: false
jobs:
  distribute:
    runs-on: ubuntu-24.04
    # The app key lives here rather than at the repository level, so a workflow on any
    # other ref can't read it. The environment only lets main deploy to it.
    environment: ar2
    timeout-minutes: 30
    permissions:
      # Reading the branches and what they hold. The writing is the app's.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: branch_token
        with:
          client-id: ${{ vars.AR2_BRANCH_CLIENT_ID }}
          private-key: ${{ secrets.AR2_BRANCH_PRIVATE_KEY }}
      - run: python3 .github/workflows/distribute_versions_caller.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AR2_BRANCH_TOKEN: ${{ steps.branch_token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
