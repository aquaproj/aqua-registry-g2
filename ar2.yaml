---
# ar2's configuration for this registry. See
# https://github.com/aquaproj/ar2 for what it means.
ignored_packages:
  - name: odigos-io/odigos
    reason: |
      The repository odigos-io/odigos is gone: it answers 404 by name and by its id (501095512), while the organization remains. No asset can be downloaded, so aqua can't install any version, published or not.
  - name: scenarigo/scenarigo
    reason: |
      Its asset name carries the Go version the plugin support was built against,
      declared as a required variable with no default. The value comes from the
      machine installing it rather than from the release, so there is no one answer
      to resolve and publish. aqua-registry (v1) keeps serving it.
  - name_regexp: bridgecrewio/.*
    reason: |
      The bridgecrewio organization has an IP allow list enabled, so the GitHub API
      refuses the token a run uses: "your IP address is not permitted to access this
      resource", and its downloads are refused from the addresses CI runs on too.
      aqua-registry (v1) ignores bridgecrewio/yor for the same reason.
  - name: qltysh-archive/test-reporter
    reason: |
      The repository is archived and its downloads, served from codeclimate.com, answer 404
      for every version, so nothing can be generated or installed.
  - name: golang/tools/gorename
    reason: |
      The command was deleted upstream: https://github.com/golang/go/issues/69360
  - name_regexp: aquasecurity/.*
    reason: |
      The aquasecurity organization has an IP allow list enabled, so the GitHub API
      refuses the token a run uses: "your IP address is not permitted to access this
      resource". aqua-registry (v1) keeps serving its packages.
  - name_regexp: Shopify/.*
    reason: |
      The Shopify organization has an IP allow list enabled, so the GitHub API refuses
      the token a run uses: "your IP address is not permitted to access this
      resource". aqua-registry (v1) keeps serving its packages.
  - name: Arata1202/ascdir
    reason: |
      The repository Arata1202/ascdir is gone: the API and the web page both answer 404, while
      the owner remains. No asset can be downloaded, so aqua can't install any version.
